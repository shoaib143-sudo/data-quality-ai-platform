name: ADR-006 AI Provider Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify ReasoningProvider contract and adapter behavior
        run: pnpm run verify:reasoning-provider
      - name: Verify Model Gateway contract and routing behavior
        run: pnpm run verify:model-gateway
      - name: Verify RetrievalProvider contract and semantic projection behavior
        run: pnpm run verify:retrieval-provider
      - name: Production build
        run: pnpm run build
