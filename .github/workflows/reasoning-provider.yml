name: ADR-006 AI Provider Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify ReasoningProvider contract and adapter behavior
        run: pnpm run verify:reasoning-provider
      - name: Verify Model Gateway contract and routing behavior
        run: pnpm run verify:model-gateway
      - name: Verify EmbeddingProvider contract and governed runtime behavior
        run: pnpm run verify:embedding-provider
      - name: Verify RetrievalProvider contract and semantic projection behavior
        run: pnpm run verify:retrieval-provider
      - name: Verify MemoryProvider authority and lifecycle boundaries
        run: pnpm run verify:memory-provider
      - name: Verify Learning Engine authority and promotion boundaries
        run: pnpm run verify:learning-engine
      - name: Verify Command Center control-state boundary
        run: pnpm run verify:command-center
      - name: Verify TelemetryProvider contract and persistence safety
        run: pnpm run verify:telemetry-provider
      - name: Verify EvaluationEngine contract and scorecard behavior
        run: pnpm run verify:evaluation-engine
      - name: Verify verified-case evaluation dataset authority boundaries
        run: pnpm run verify:evaluation-dataset
      - name: Verify ModelRegistry lifecycle and evaluation boundaries
        run: pnpm run verify:model-registry
      - name: Verify Intelligent Router evaluation-aware fail-closed behavior
        run: pnpm run verify:intelligent-router
      - name: Verify governed RoutingPolicy contract and behavior
        run: pnpm run verify:routing-policy
      - name: Verify Intelligent Router route-decision telemetry
        run: pnpm run verify:route-telemetry
      - name: Production build
        run: pnpm run build
