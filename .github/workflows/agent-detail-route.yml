name: Agent Detail Route

on:
  pull_request:
    paths:
      - 'app/agents/**'
      - 'scripts/verify-agent-detail-route.mjs'
      - '.github/workflows/agent-detail-route.yml'
  push:
    branches: [main]
    paths:
      - 'app/agents/**'
      - 'scripts/verify-agent-detail-route.mjs'
      - '.github/workflows/agent-detail-route.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify versioned agent detail route
        run: node scripts/verify-agent-detail-route.mjs
