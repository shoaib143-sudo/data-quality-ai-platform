name: Profiling Native Replay

on:
  push:
    branches: [main]
    paths:
      - 'lib/agents/executors/profiling-executor.ts'
      - 'lib/agents/runtime/native-supervisor-tier2-profiling.ts'
      - 'lib/connectors/**'
      - 'lib/profiling/**'
      - 'app/api/profiling/**'
      - 'app/api/agents/run/route.ts'
      - 'app/api/agents/supervisor/tier2/profiling-snapshot/route.ts'
      - 'infra/profiling/**'
      - 'supabase/migrations/**profile**'
      - 'supabase/migrations/**profiling**'
      - 'scripts/verify-profiling-native-replay.mjs'
      - 'scripts/verify-profiling-safe-mutation-replay.mjs'
      - 'scripts/verify-profiling-compare-replay.mjs'
      - 'scripts/verify-profiling-investigation-replay.mjs'
      - 'scripts/verify-profiling-metric-replay.mjs'
      - 'scripts/verify-profiling-dataset-replay.mjs'
      - 'scripts/verify-profiling-production-validation.mjs'
      - 'scripts/test-profiling-production-validation.mjs'
      - 'scripts/lib/profiling-production-validation.mjs'
      - 'scripts/test-profiling-request-input.mjs'
      - 'scripts/verify-profiling-scale-certification.mjs'
      - 'scripts/test-profiling-scale-certification.mjs'
      - 'scripts/verify-native-supervisor-tier2-profiling.mjs'
      - 'scripts/ci-full-quality-gate.sh'
      - 'tests/profiling-production-validation-workflow.test.mjs'
      - 'tests/profiling-production-validation-source.test.mjs'
      - 'package.json'
      - '.github/workflows/profiling-native-replay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/agents/executors/profiling-executor.ts'
      - 'lib/agents/runtime/native-supervisor-tier2-profiling.ts'
      - 'lib/connectors/**'
      - 'lib/profiling/**'
      - 'app/api/profiling/**'
      - 'app/api/agents/run/route.ts'
      - 'app/api/agents/supervisor/tier2/profiling-snapshot/route.ts'
      - 'infra/profiling/**'
      - 'supabase/migrations/**profile**'
      - 'supabase/migrations/**profiling**'
      - 'scripts/verify-profiling-native-replay.mjs'
      - 'scripts/verify-profiling-safe-mutation-replay.mjs'
      - 'scripts/verify-profiling-compare-replay.mjs'
      - 'scripts/verify-profiling-investigation-replay.mjs'
      - 'scripts/verify-profiling-metric-replay.mjs'
      - 'scripts/verify-profiling-dataset-replay.mjs'
      - 'scripts/verify-profiling-production-validation.mjs'
      - 'scripts/test-profiling-production-validation.mjs'
      - 'scripts/lib/profiling-production-validation.mjs'
      - 'scripts/test-profiling-request-input.mjs'
      - 'scripts/verify-profiling-scale-certification.mjs'
      - 'scripts/test-profiling-scale-certification.mjs'
      - 'scripts/verify-native-supervisor-tier2-profiling.mjs'
      - 'scripts/ci-full-quality-gate.sh'
      - 'tests/profiling-production-validation-workflow.test.mjs'
      - 'tests/profiling-production-validation-source.test.mjs'
      - 'package.json'
      - '.github/workflows/profiling-native-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify profiling native read-only replay certification
        run: node scripts/verify-profiling-native-replay.mjs
      - name: Verify profiling replay-safe mutations
        run: node scripts/verify-profiling-safe-mutation-replay.mjs
      - name: Verify profiling replay-safe comparison
        run: node scripts/verify-profiling-compare-replay.mjs
      - name: Verify profiling replay-safe investigation
        run: node scripts/verify-profiling-investigation-replay.mjs
      - name: Verify profiling replay-safe metric execution
        run: node scripts/verify-profiling-metric-replay.mjs
      - name: Verify profiling replay-safe dataset execution
        run: node scripts/verify-profiling-dataset-replay.mjs
      - name: Profiling production validation negative and failure cases
        run: node --test scripts/test-profiling-production-validation.mjs tests/profiling-production-validation-workflow.test.mjs tests/profiling-production-validation-source.test.mjs
      - name: Existing profiling lifecycle contract
        run: pnpm run verify:profiling-lifecycle
      - name: Profiling governance insights contract
        run: node scripts/verify-profiling-governance-insights.mjs
      - name: Profiling request trust boundary
        run: node scripts/test-profiling-request-input.mjs
      - name: Profiling scale certification
        run: |
          node scripts/verify-profiling-scale-certification.mjs
          node --experimental-strip-types scripts/test-profiling-scale-certification.mjs
      - name: Controlled Tier 2 profiling supervisor
        run: node scripts/verify-native-supervisor-tier2-profiling.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit

  live-production:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate live production profiling estate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROFILING_PRODUCTION_VALIDATION_REQUIRED: 'true'
          PROFILING_PRODUCTION_VALIDATION_EVIDENCE_PATH: ${{ runner.temp }}/profiling-production-validation.json
        run: node scripts/verify-profiling-production-validation.mjs
      - name: Upload profiling production validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profiling-production-validation-${{ github.sha }}
          path: ${{ runner.temp }}/profiling-production-validation.json
          retention-days: 90
          if-no-files-found: error
