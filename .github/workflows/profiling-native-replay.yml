name: Profiling Native Replay

on:
  push:
    branches: [main]
    paths:
      - 'lib/agents/executors/profiling-executor.ts'
      - 'lib/profiling/derived-tools.ts'
      - 'lib/profiling/executor.ts'
      - 'lib/profiling/investigation-replay.ts'
      - 'lib/profiling/metric-replay.ts'
      - 'lib/profiling/profile-dataset-replay.ts'
      - 'lib/profiling/replay-safe-tools.ts'
      - 'lib/profiling/replay-safe-comparison.ts'
      - 'supabase/migrations/**profiling**'
      - 'scripts/verify-profiling-native-replay.mjs'
      - 'scripts/verify-profiling-safe-mutation-replay.mjs'
      - 'scripts/verify-profiling-compare-replay.mjs'
      - 'scripts/verify-profiling-investigation-replay.mjs'
      - 'scripts/verify-profiling-metric-replay.mjs'
      - 'scripts/verify-profiling-dataset-replay.mjs'
      - '.github/workflows/profiling-native-replay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/agents/executors/profiling-executor.ts'
      - 'lib/profiling/derived-tools.ts'
      - 'lib/profiling/executor.ts'
      - 'lib/profiling/investigation-replay.ts'
      - 'lib/profiling/metric-replay.ts'
      - 'lib/profiling/profile-dataset-replay.ts'
      - 'lib/profiling/replay-safe-tools.ts'
      - 'lib/profiling/replay-safe-comparison.ts'
      - 'supabase/migrations/**profiling**'
      - 'scripts/verify-profiling-native-replay.mjs'
      - 'scripts/verify-profiling-safe-mutation-replay.mjs'
      - 'scripts/verify-profiling-compare-replay.mjs'
      - 'scripts/verify-profiling-investigation-replay.mjs'
      - 'scripts/verify-profiling-metric-replay.mjs'
      - 'scripts/verify-profiling-dataset-replay.mjs'
      - '.github/workflows/profiling-native-replay.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify profiling native read-only replay certification
        run: node scripts/verify-profiling-native-replay.mjs
      - name: Verify profiling replay-safe mutations
        run: node scripts/verify-profiling-safe-mutation-replay.mjs
      - name: Verify profiling replay-safe comparison
        run: node scripts/verify-profiling-compare-replay.mjs
      - name: Verify profiling replay-safe investigation
        run: node scripts/verify-profiling-investigation-replay.mjs
      - name: Verify profiling replay-safe metric execution
        run: node scripts/verify-profiling-metric-replay.mjs
      - name: Verify profiling replay-safe dataset execution
        run: node scripts/verify-profiling-dataset-replay.mjs
