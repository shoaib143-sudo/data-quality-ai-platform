name: Execution Control Service Role ACL

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-execution-control-service-role-acl.mjs'
      - '.github/workflows/execution-control-service-role-acl.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-execution-control-service-role-acl.mjs'
      - '.github/workflows/execution-control-service-role-acl.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify execution-control service-role ACL
        run: node scripts/verify-execution-control-service-role-acl.mjs
