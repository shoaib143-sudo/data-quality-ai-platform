name: Production Security Posture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datanexus_security_posture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify security posture source contract
        run: node scripts/verify-production-security-posture.mjs
      - name: Verify glossary direct-write boundary
        run: node scripts/verify-glossary-direct-write-boundary.mjs
      - name: Execute dynamic and negative PostgreSQL cases
        run: psql -h 127.0.0.1 -U postgres -d datanexus_security_posture -f scripts/test-production-security-posture.sql
      - name: Exercise glossary privilege boundary
        run: psql -h 127.0.0.1 -U postgres -d datanexus_security_posture -f scripts/test-glossary-direct-write-boundary.sql
      - name: Re-run glossary privilege boundary to prove fixture isolation
        run: psql -h 127.0.0.1 -U postgres -d datanexus_security_posture -f scripts/test-glossary-direct-write-boundary.sql
