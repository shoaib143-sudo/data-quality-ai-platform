name: Run-scoped AI Capability Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-ai-capability-e2e-ledger.mjs'
      - '.github/workflows/ai-capability-e2e-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify migration version uniqueness
        run: node scripts/verify-migration-version-uniqueness.mjs
      - name: Verify run-scoped 75-capability evidence contract
        run: node scripts/verify-ai-capability-e2e-ledger.mjs
