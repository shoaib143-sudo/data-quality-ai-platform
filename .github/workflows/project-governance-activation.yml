name: Project Governance Activation

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**project_governance_activation.sql'
      - 'scripts/verify-project-governance-activation.mjs'
      - '.github/workflows/project-governance-activation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**project_governance_activation.sql'
      - 'scripts/verify-project-governance-activation.mjs'
      - '.github/workflows/project-governance-activation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify governance activation contract
        run: node scripts/verify-project-governance-activation.mjs
