name: Native Compensation Reclaim Fencing

on:
  push:
    branches: [main]
    paths:
      - 'lib/agents/runtime/native-recovery-v2.ts'
      - 'lib/agents/runtime/native-compensation-fencing.ts'
      - 'scripts/verify-native-compensation-reclaim-fencing.mjs'
      - 'supabase/migrations/**native_compensation_reclaim_fencing.sql'
      - '.github/workflows/native-compensation-reclaim-fencing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/agents/runtime/native-recovery-v2.ts'
      - 'lib/agents/runtime/native-compensation-fencing.ts'
      - 'scripts/verify-native-compensation-reclaim-fencing.mjs'
      - 'supabase/migrations/**native_compensation_reclaim_fencing.sql'
      - '.github/workflows/native-compensation-reclaim-fencing.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify compensation crash reclaim fencing
        run: node scripts/verify-native-compensation-reclaim-fencing.mjs
      - name: Typecheck native compensation fencing
        run: pnpm exec tsc --noEmit
