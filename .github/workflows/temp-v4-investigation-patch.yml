name: Temporary V4 Investigation Patch

on:
  push:
    branches:
      - implementation/v4-investigation-agents-20260910

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: implementation/v4-investigation-agents-20260910
      - name: Apply V4 integration patch
        run: node scripts/patch-v4-investigation.mjs
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/agents/governance-specialist-agent.ts app/api/agents/governance/run/route.ts
          git commit -m "feat(v4): wire governed investigation into specialist agents"
          git push origin HEAD:implementation/v4-investigation-agents-20260910
