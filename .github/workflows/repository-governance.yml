name: Repository Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify repository governance contract
        run: node scripts/verify-github-governance.mjs
      - name: Verify post-implementation certification contract
        run: node scripts/verify-post-implementation-certification-contract.mjs
      - name: Exercise certification contract negative and failure cases
        run: node --test scripts/test-post-implementation-certification-contract.mjs
      - name: Verify certification best-practice hardening profile
        run: node scripts/verify-certification-best-practice-hardening-v2.mjs
      - name: Exercise certification hardening negative cases
        run: node --test scripts/test-certification-best-practice-hardening-v2.mjs
      - name: Exercise fail-closed certification decision engine
        run: node --test scripts/test-post-implementation-certification-decision.mjs
      - name: Verify fast-path CI safety model
        run: node scripts/verify-fast-path-ci.mjs
      - name: Verify immutable action references
        run: node scripts/verify-workflow-action-pinning.mjs
      - name: Report workflow action inventory
        run: node scripts/report-workflow-action-inventory.mjs
      - name: Verify workflow action allowlist
        run: node scripts/verify-workflow-action-allowlist.mjs
      - name: Verify least-privilege workflow posture
        run: node scripts/verify-workflow-security-posture.mjs
      - name: Exercise governance negative and failure cases
        run: node --test tests/github-governance-contract.test.mjs tests/pull-request-title-policy.test.mjs tests/workflow-credential-scope.test.mjs
      - name: Validate pull request title
        run: node scripts/verify-pull-request-title.mjs
