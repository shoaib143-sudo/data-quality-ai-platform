name: V5 Operational Action Learning

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify governed action learning journey
        run: node scripts/verify-journey-governed-action-learning.mjs
      - name: Verify operational and immutable outcome authority
        run: node scripts/verify-v5-outcome-authority-reconciliation.mjs
