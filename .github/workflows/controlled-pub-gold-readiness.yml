name: Controlled PUB Gold Readiness
on:
  push:
    branches: [ops/pub-gold-readiness-20260927]
    paths: [scripts/run-pub-gold-readiness.mjs, .github/workflows/controlled-pub-gold-readiness.yml]
permissions: {contents: read}
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATANEXUS_BASE_URL: https://data-quality-ai-platform.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 10}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/run-pub-gold-readiness.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: controlled-pub-gold-readiness-evidence, path: artifacts/pub-gold-readiness.json, if-no-files-found: warn, retention-days: 30}
