name: Living Tree Job Monitor
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/monitoring/**'
      - 'app/api/monitoring/**'
      - 'lib/monitoring/**'
      - 'lib/agents/run-profiling-job.ts'
      - 'lib/agents/runtime/native-autonomy-runtime.ts'
      - 'scripts/*monitor*'
      - 'tests/browser/execution-monitor/**'
      - 'tests/fixtures/execution-monitor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/execution-monitor.yml'
  push:
    branches: [main]
    paths:
      - 'app/monitoring/**'
      - 'app/api/monitoring/**'
      - 'lib/monitoring/**'
      - 'lib/agents/run-profiling-job.ts'
      - 'lib/agents/runtime/native-autonomy-runtime.ts'
      - 'scripts/*monitor*'
      - 'tests/browser/execution-monitor/**'
      - 'tests/fixtures/execution-monitor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/execution-monitor.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run verify:execution-monitor
      - run: node scripts/verify-native-supervisor-production.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify synthetic client interactions
        run: pnpm exec playwright test --config tests/browser/execution-monitor/playwright.config.ts
      - name: Preserve screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution-monitor-browser-evidence
          path: test-results/
          if-no-files-found: ignore
