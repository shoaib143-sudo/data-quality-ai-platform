name: Profiling Scale Certification

on:
  push:
    branches: [main]
    paths:
      - 'infra/profiling/**'
      - 'lib/profiling/scale-certification.ts'
      - 'scripts/test-profiling-scale-certification.mjs'
      - 'scripts/verify-profiling-scale-certification.mjs'
      - 'supabase/migrations/**profile_replay_fk_indexes.sql'
      - '.github/workflows/profiling-scale-certification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/profiling/**'
      - 'lib/profiling/scale-certification.ts'
      - 'scripts/test-profiling-scale-certification.mjs'
      - 'scripts/verify-profiling-scale-certification.mjs'
      - 'supabase/migrations/**profile_replay_fk_indexes.sql'
      - '.github/workflows/profiling-scale-certification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify scale certification contract
        run: node scripts/verify-profiling-scale-certification.mjs
      - name: Negative and failure cases
        run: node --experimental-strip-types scripts/test-profiling-scale-certification.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
