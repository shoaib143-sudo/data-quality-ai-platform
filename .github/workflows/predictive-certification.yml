name: Predictive Certification Gate

on:
  pull_request:
    paths:
      - 'lib/ai/predictive-certification.ts'
      - 'scripts/test-predictive-certification.mjs'
      - 'scripts/audit-predictive-certification-adversarial.mjs'
      - '.github/workflows/predictive-certification.yml'
  push:
    branches: [main]
    paths:
      - 'lib/ai/predictive-certification.ts'
      - 'scripts/test-predictive-certification.mjs'
      - 'scripts/audit-predictive-certification-adversarial.mjs'
      - '.github/workflows/predictive-certification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run predictive certification tests
        run: node --experimental-strip-types --test scripts/test-predictive-certification.mjs
      - name: Run predictive certification adversarial audit
        run: node scripts/audit-predictive-certification-adversarial.mjs
