name: Data Steward Persona Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/governance/personas.ts'
      - 'lib/governance/persona-acceptance-tasks.ts'
      - 'lib/governance/workspace-policy.ts'
      - 'app/home/**'
      - 'components/governance/**'
      - 'app/agents/autonomous-governance/**'
      - 'app/api/agents/governance-orchestrator/**'
      - 'app/api/schedules/**'
      - 'supabase/migrations/**'
      - 'scripts/test-data-steward-persona-certification.mjs'
      - 'scripts/audit-data-steward-persona-adversarial.mjs'
      - 'scripts/test-data-steward-persona-ui-ux.mjs'
      - '.github/workflows/data-steward-persona-certification.yml'
  push:
    branches: [main]
    paths:
      - 'lib/governance/personas.ts'
      - 'lib/governance/persona-acceptance-tasks.ts'
      - 'lib/governance/workspace-policy.ts'
      - 'app/home/**'
      - 'components/governance/**'
      - 'app/agents/autonomous-governance/**'
      - 'app/api/agents/governance-orchestrator/**'
      - 'app/api/schedules/**'
      - 'supabase/migrations/**'
      - 'scripts/test-data-steward-persona-certification.mjs'
      - 'scripts/audit-data-steward-persona-adversarial.mjs'
      - 'scripts/test-data-steward-persona-ui-ux.mjs'
      - '.github/workflows/data-steward-persona-certification.yml'

permissions:
  contents: read

jobs:
  certify-data-steward:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Unit and persona contract tests
        run: node --experimental-strip-types --test scripts/test-data-steward-persona-certification.mjs
      - name: Independent adversarial audit
        run: node scripts/audit-data-steward-persona-adversarial.mjs
      - name: UI and UX tests
        run: node --experimental-strip-types --test scripts/test-data-steward-persona-ui-ux.mjs
