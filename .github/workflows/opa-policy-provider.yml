name: OPA Policy Provider

on:
  push:
    branches: [main]
    paths:
      - 'lib/governance/opa-policy-decision-provider.ts'
      - 'lib/governance/governance-policy-decision-provider.ts'
      - 'infra/opa/**'
      - 'scripts/verify-opa-policy-provider.mjs'
      - 'scripts/test-opa-policy-decision-provider.mjs'
      - '.github/workflows/opa-policy-provider.yml'
  pull_request:
    paths:
      - 'lib/governance/opa-policy-decision-provider.ts'
      - 'lib/governance/governance-policy-decision-provider.ts'
      - 'infra/opa/**'
      - 'scripts/verify-opa-policy-provider.mjs'
      - 'scripts/test-opa-policy-decision-provider.mjs'
      - '.github/workflows/opa-policy-provider.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-opa-policy-provider.mjs
      - run: node --experimental-strip-types scripts/test-opa-policy-decision-provider.mjs
      - run: bash infra/opa/render-build.sh
      - run: bash infra/opa/test-runtime.sh
      - run: pnpm exec tsc --noEmit
