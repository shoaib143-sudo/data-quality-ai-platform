name: Repair Data Quality Retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-data-quality-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize resumable retry patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/data-quality/automation.ts')
          text = path.read_text()

          old = """    let passedCount = Number(executeStep.output.passed ?? 0)\n    let failedCount = Number(executeStep.output.failed ?? 0)\n    let errorCount = Number(executeStep.output.errors ?? 0)\n    let exceptionCount = Number(executeStep.output.row_exceptions ?? 0)\n    let quarantinedCount = Number(executeStep.output.quarantined_records ?? 0)\n"""
          new = """    let totalCount = Number(executeStep.output.total ?? 0)\n    let passedCount = Number(executeStep.output.passed ?? 0)\n    let failedCount = Number(executeStep.output.failed ?? 0)\n    let errorCount = Number(executeStep.output.errors ?? 0)\n    let exceptionCount = Number(executeStep.output.row_exceptions ?? 0)\n    let quarantinedCount = Number(executeStep.output.quarantined_records ?? 0)\n"""
          if old not in text:
              raise SystemExit('Unable to find resumable counter block')
          text = text.replace(old, new, 1)

          old = """    passedCount = results.filter((result) => result.status === 'PASSED').length\n    failedCount = results.filter((result) => result.status === 'FAILED').length\n    errorCount = results.filter((result) => result.status === 'ERROR').length\n"""
          new = """    totalCount = results.length\n    passedCount = results.filter((result) => result.status === 'PASSED').length\n    failedCount = results.filter((result) => result.status === 'FAILED').length\n    errorCount = results.filter((result) => result.status === 'ERROR').length\n"""
          if old not in text:
              raise SystemExit('Unable to find quality result counter block')
          text = text.replace(old, new, 1)

          text = text.replace('rules_total: results.length,', 'rules_total: totalCount,', 1)
          text = text.replace('pass_rate: results.length ? passedCount / results.length : 1,', 'pass_rate: totalCount ? passedCount / totalCount : 1,', 1)

          path.write_text(text)
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data-quality/automation.ts
          git diff --cached --check
          git commit -m "fix: finalize resumable data quality retry state"
          git push origin HEAD:main
