name: Persona Presentation Engine

on:
  pull_request:
    paths:
      - 'lib/governance/persona-presentation.ts'
      - 'lib/governance/personas.ts'
      - 'components/governance/**'
      - 'app/home/**'
      - 'Architecture/2026-09-12-persona-aware-presentation-engine.md'
      - 'scripts/verify-persona-presentation-engine.mjs'
      - '.github/workflows/persona-presentation-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify persona-aware presentation contract
        run: node scripts/verify-persona-presentation-engine.mjs
      - name: Verify TypeScript production build
        run: pnpm build
