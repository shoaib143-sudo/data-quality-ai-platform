name: Apply Profiling Trust Boundary

on:
  push:
    branches:
      - implementation/p0-p5-revalidation-20260910
    paths:
      - scripts/patch-profiling-trust-boundary.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: implementation/p0-p5-revalidation-20260910
      - name: Apply guarded source patch
        run: node scripts/patch-profiling-trust-boundary.mjs
      - name: Commit patched executor
        run: |
          if git diff --quiet -- lib/profiling/executor.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/profiling/executor.ts
          git commit -m "fix(profiling): reject metadata-only profile evidence"
          git push origin HEAD:implementation/p0-p5-revalidation-20260910
