name: JDBC Bridge

on:
  push:
    branches: [main]
    paths:
      - 'services/jdbc-bridge/**'
      - '.github/workflows/jdbc-bridge.yml'
  pull_request:
    paths:
      - 'services/jdbc-bridge/**'
      - '.github/workflows/jdbc-bridge.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/jdbc-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run bridge tests
        run: mvn -B test
