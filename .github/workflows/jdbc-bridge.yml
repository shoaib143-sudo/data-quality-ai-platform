name: JDBC Bridge

on:
  push:
    branches: [main]
    paths:
      - 'services/jdbc-bridge/**'
      - 'scripts/verify-jdbc-bridge-deployment-contract.mjs'
      - 'infra/cloudflare/jdbc-bridge-poc/**'
      - 'scripts/verify-cloudflare-jdbc-bridge-poc-contract.mjs'
      - 'scripts/audit-cloudflare-jdbc-bridge-poc-adversarial.mjs'
      - 'tests/cloudflare-jdbc-bridge-poc-failure-cases.test.mjs'
      - 'docs/cloudflare-jdbc-bridge-poc-post-implementation-validation.md'
      - '.github/workflows/jdbc-bridge.yml'
  pull_request:
    paths:
      - 'services/jdbc-bridge/**'
      - 'scripts/verify-jdbc-bridge-deployment-contract.mjs'
      - 'infra/cloudflare/jdbc-bridge-poc/**'
      - 'scripts/verify-cloudflare-jdbc-bridge-poc-contract.mjs'
      - 'scripts/audit-cloudflare-jdbc-bridge-poc-adversarial.mjs'
      - 'tests/cloudflare-jdbc-bridge-poc-failure-cases.test.mjs'
      - 'docs/cloudflare-jdbc-bridge-poc-post-implementation-validation.md'
      - '.github/workflows/jdbc-bridge.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/jdbc-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify deployment availability contract
        run: node ../../scripts/verify-jdbc-bridge-deployment-contract.mjs
      - name: Verify Cloudflare JDBC PoC contract
        run: node ../../scripts/verify-cloudflare-jdbc-bridge-poc-contract.mjs
      - name: Test Cloudflare JDBC PoC negative and failure cases
        run: node --test ../../tests/cloudflare-jdbc-bridge-poc-failure-cases.test.mjs
      - name: Independent adversarial Cloudflare JDBC PoC audit
        run: node ../../scripts/audit-cloudflare-jdbc-bridge-poc-adversarial.mjs
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run bridge tests
        run: mvn -B test
      - name: Build bridge container
        run: docker build --pull --tag datanexus-jdbc-bridge:ci .
      - name: Export bridge container
        if: github.event_name == 'push'
        run: docker save datanexus-jdbc-bridge:ci | gzip -9 > jdbc-bridge-image.tar.gz
      - name: Upload bridge container artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdbc-bridge-image-${{ github.sha }}
          path: services/jdbc-bridge/jdbc-bridge-image.tar.gz
          if-no-files-found: error
          retention-days: 7
