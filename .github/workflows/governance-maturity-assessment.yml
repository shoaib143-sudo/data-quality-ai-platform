name: Governance Maturity Assessment

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/governance/maturity/**'
      - 'app/journeys/governance-maturity/**'
      - 'components/governance/maturity-onboarding.tsx'
      - 'lib/governance/maturity-*.ts'
      - 'supabase/migrations/*governance_maturity_assessment.sql'
      - 'tests/governance-maturity-*.test.mjs'
      - 'package.json'
      - '.github/workflows/governance-maturity-assessment.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/governance/maturity/**'
      - 'app/journeys/governance-maturity/**'
      - 'components/governance/maturity-onboarding.tsx'
      - 'lib/governance/maturity-*.ts'
      - 'supabase/migrations/*governance_maturity_assessment.sql'
      - 'tests/governance-maturity-*.test.mjs'
      - 'package.json'
      - '.github/workflows/governance-maturity-assessment.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify governance maturity assessment
        run: pnpm run verify:governance-maturity
