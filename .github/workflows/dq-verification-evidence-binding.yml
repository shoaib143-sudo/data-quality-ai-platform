name: DQ Verification Evidence Binding

on:
  pull_request:
    paths:
      - 'lib/data-quality/remediation-verification.ts'
      - 'lib/data-quality/remediation-verification-integrity.ts'
      - 'lib/data-quality/remediation-reprofile.ts'
      - 'supabase/migrations/20260912032000_backfill_dq_verification_profile_linkage.sql'
      - 'scripts/test-dq-verification-evidence-binding.mjs'
      - 'scripts/verify-dq-verification-evidence-binding.mjs'
      - '.github/workflows/dq-verification-evidence-binding.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify evidence binding contracts
        run: node scripts/verify-dq-verification-evidence-binding.mjs
      - name: Unit test evidence binding
        run: node --experimental-strip-types scripts/test-dq-verification-evidence-binding.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
