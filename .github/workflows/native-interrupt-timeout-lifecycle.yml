name: Native interrupt timeout lifecycle

on:
  pull_request:
    paths:
      - 'lib/agents/runtime/native-interrupt-lifecycle.ts'
      - 'supabase/migrations/20260912054000_native_interrupt_timeout_lifecycle.sql'
      - 'scripts/verify-native-interrupt-timeout-lifecycle.mjs'
      - '.github/workflows/native-interrupt-timeout-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'lib/agents/runtime/native-interrupt-lifecycle.ts'
      - 'supabase/migrations/20260912054000_native_interrupt_timeout_lifecycle.sql'
      - 'scripts/verify-native-interrupt-timeout-lifecycle.mjs'
      - '.github/workflows/native-interrupt-timeout-lifecycle.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-native-interrupt-timeout-lifecycle.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
