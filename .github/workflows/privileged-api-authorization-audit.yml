name: Privileged API Authorization Audit

on:
  pull_request:
    paths:
      - 'app/api/**'
      - 'lib/auth/**'
      - 'scripts/audit-user-facing-admin-routes.mjs'
      - '.github/workflows/privileged-api-authorization-audit.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/**'
      - 'lib/auth/**'
      - 'scripts/audit-user-facing-admin-routes.mjs'
      - '.github/workflows/privileged-api-authorization-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Inventory privileged API routes
        run: node scripts/audit-user-facing-admin-routes.mjs
