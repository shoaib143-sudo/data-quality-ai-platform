name: Cloudflare Canary Deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character Git commit SHA already validated by GitHub CI
        required: true
        type: string
      confirm_paid_activation:
        description: Confirm explicit owner approval for Workers Paid activation/deployment
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-canary-deployment
  cancel-in-progress: false

jobs:
  deploy-canary:
    if: inputs.confirm_paid_activation == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-canary
    steps:
      - name: Checkout exact certified SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          test "${#GITHUB_SHA}" -eq 40
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$GITHUB_SHA" = "${{ inputs.commit_sha }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Revalidate canary and container contracts
        run: |
          set -euo pipefail
          pnpm run verify:provider-neutral-runtime
          pnpm run verify:container-runtime
          pnpm exec tsc --noEmit
          pnpm build

      - name: Build standalone container locally
        run: docker build --tag datanexus-canary:"$GITHUB_SHA" .

      - name: Install pinned Cloudflare deployment tooling
        run: npm install --no-save --ignore-scripts wrangler@4.131.1 @cloudflare/containers@0.3.7

      - name: Deploy exact-SHA Cloudflare canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_ID="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx wrangler@4.131.1 deploy --config infra/cloudflare/runtime/wrangler.jsonc \
            --var "DATANEXUS_ENV:canary" \
            --var "DATANEXUS_PLATFORM:cloudflare" \
            --var "DATANEXUS_COMMIT_SHA:$GITHUB_SHA" \
            --var "DATANEXUS_RELEASE_ID:$RELEASE_ID" \
            --var "DATANEXUS_BUILD_TIMESTAMP:$BUILD_TIMESTAMP"
