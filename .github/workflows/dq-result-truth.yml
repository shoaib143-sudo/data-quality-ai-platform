name: DQ Result Truth

on:
  pull_request:
    paths:
      - 'supabase/migrations/**dq_result_truth**'
      - 'scripts/verify-dq-result-truth.mjs'
      - '.github/workflows/dq-result-truth.yml'
      - 'Architecture/2026-09-10-ADR-007-trusted-operational-governance-capability-model.md'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**dq_result_truth**'
      - 'scripts/verify-dq-result-truth.mjs'
      - '.github/workflows/dq-result-truth.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify canonical DQ result truth
        run: node scripts/verify-dq-result-truth.mjs
