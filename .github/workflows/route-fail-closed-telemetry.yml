name: Route Fail Closed Telemetry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify route telemetry contract
        run: node scripts/verify-route-telemetry.mjs
      - name: Verify fail closed route telemetry behavior
        run: node --experimental-strip-types scripts/test-route-fail-closed-telemetry.mjs
