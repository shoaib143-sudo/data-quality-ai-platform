name: Continuous Learning Governance

on:
  pull_request:
    paths:
      - 'app/admin/learning-cases/**'
      - 'app/api/admin/learning-cases/**'
      - 'lib/agents/proactive-governed-case-learning-admin.ts'
      - 'scripts/test-proactive-governed-case-learning-ui.mjs'
      - 'lib/agents/proactive-governed-case-learning-service.ts'
      - 'scripts/test-proactive-governed-case-learning-persistence.mjs'
      - 'supabase/migrations/20260920012000_proactive_governed_case_learning.sql'
      - 'lib/agents/proactive-governed-case-learning.ts'
      - 'scripts/test-proactive-governed-case-learning.mjs'
      - 'lib/agents/governed-learning-benchmarks.ts'
      - 'lib/agents/governed-learning-benchmark-service.ts'
      - 'scripts/test-governed-learning-benchmarks.mjs'
      - 'supabase/migrations/20260920011000_governed_learning_candidate_benchmarks.sql'
      - 'lib/agents/governed-learning-candidates.ts'
      - 'lib/agents/governed-learning-candidate-service.ts'
      - 'scripts/test-governed-learning-candidates.mjs'
      - 'supabase/migrations/20260920010000_governed_learning_candidates.sql'
      - 'lib/ai/continuous-learning-governance.ts'
      - 'scripts/test-continuous-learning-governance.mjs'
      - 'scripts/audit-continuous-learning-governance-adversarial.mjs'
      - '.github/workflows/continuous-learning-governance.yml'
  push:
    branches: [main]
    paths:
      - 'app/admin/learning-cases/**'
      - 'app/api/admin/learning-cases/**'
      - 'lib/agents/proactive-governed-case-learning-admin.ts'
      - 'scripts/test-proactive-governed-case-learning-ui.mjs'
      - 'lib/agents/proactive-governed-case-learning-service.ts'
      - 'scripts/test-proactive-governed-case-learning-persistence.mjs'
      - 'supabase/migrations/20260920012000_proactive_governed_case_learning.sql'
      - 'lib/agents/proactive-governed-case-learning.ts'
      - 'scripts/test-proactive-governed-case-learning.mjs'
      - 'lib/agents/governed-learning-benchmarks.ts'
      - 'lib/agents/governed-learning-benchmark-service.ts'
      - 'scripts/test-governed-learning-benchmarks.mjs'
      - 'supabase/migrations/20260920011000_governed_learning_candidate_benchmarks.sql'
      - 'lib/agents/governed-learning-candidates.ts'
      - 'lib/agents/governed-learning-candidate-service.ts'
      - 'scripts/test-governed-learning-candidates.mjs'
      - 'supabase/migrations/20260920010000_governed_learning_candidates.sql'
      - 'lib/ai/continuous-learning-governance.ts'
      - 'scripts/test-continuous-learning-governance.mjs'
      - 'scripts/audit-continuous-learning-governance-adversarial.mjs'
      - '.github/workflows/continuous-learning-governance.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run proactive governed case learning tests
        run: node --experimental-strip-types scripts/test-proactive-governed-case-learning.mjs
      - name: Run PGCL persistence tests
        run: node --experimental-strip-types scripts/test-proactive-governed-case-learning-persistence.mjs
      - name: Run PGCL admin review UI tests
        run: node scripts/test-proactive-governed-case-learning-ui.mjs
      - name: Run governed learning candidate tests
        run: node --experimental-strip-types scripts/test-governed-learning-candidates.mjs
      - name: Run governed learning benchmark tests
        run: node --experimental-strip-types scripts/test-governed-learning-benchmarks.mjs
      - name: Run continuous learning governance tests
        run: node --experimental-strip-types --test scripts/test-continuous-learning-governance.mjs
      - name: Run independent continuous learning governance adversarial audit
        run: node scripts/audit-continuous-learning-governance-adversarial.mjs
