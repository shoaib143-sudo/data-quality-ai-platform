permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run proactive governed case learning tests
        run: node --experimental-strip-types scripts/test-proactive-governed-case-learning.mjs
      - name: Run governed learning golden journey
        run: node scripts/verify-governed-learning-golden-journey.mjs
      - name: Run Phase 11 governed learning adversarial audit
        run: node scripts/audit-governed-learning-phase11-adversarial.mjs
      - name: Run governed learning production readiness tests
        run: node --experimental-strip-types scripts/test-governed-learning-production-readiness.mjs
      - name: Run eight-agent PGCL conformance
        run: node --experimental-strip-types scripts/test-proactive-governed-case-learning-eight-agent-conformance.mjs
      - name: Run PGCL persistence tests
        run: node --experimental-strip-types scripts/test-proactive-governed-case-learning-persistence.mjs
      - name: Run PGCL production-learning provenance tests
        run: node scripts/test-pgcl-production-learning-provenance.mjs
      - name: Run PGCL admin review UI tests
        run: node scripts/test-proactive-governed-case-learning-ui.mjs
      - name: Run PGCL approved-case retrieval tests
        run: node scripts/test-proactive-governed-case-learning-retrieval.mjs
      - name: Run PGCL execution attribution tests
        run: node scripts/test-proactive-governed-case-learning-execution.mjs
      - name: Run PGCL supervisor proposal tests
        run: node --experimental-strip-types scripts/test-proactive-governed-case-learning-supervisor.mjs
      - name: Run priority-agent PGCL hook tests
        run: node --experimental-strip-types scripts/test-proactive-governed-case-learning-priority-agents.mjs
      - name: Run paired experiment runner behavior and invocation tests
        run: node --experimental-strip-types scripts/test-learning-experiment-runner.mjs && node --experimental-strip-types scripts/test-learning-experiment-runner-service.mjs && node scripts/test-learning-runner-schema-boundary.mjs
      - name: Run learning experiment runtime budget tests
        run: node --experimental-strip-types scripts/test-learning-experiment-budget-runtime.mjs
      - name: Run paired experiment runner orchestration tests
        run: node --experimental-strip-types scripts/test-learning-paired-experiment-runner.mjs
      - name: Run prospective evaluation policy behavior tests
        run: node --experimental-strip-types scripts/test-learning-evaluation-policy.mjs
      - name: Run prospective evaluation release admission tests
        run: node --experimental-strip-types scripts/test-learning-evaluation-release-admission.mjs
      - name: Run release admission behavior tests
        run: node --experimental-strip-types scripts/test-learning-evaluation-admission-behavior.mjs
      - name: Run prospective evaluation Command Center tests
        run: node --experimental-strip-types scripts/test-learning-evaluation-command-center.mjs
      - name: Run governed learning candidate tests
        run: node --experimental-strip-types scripts/test-governed-learning-candidates.mjs
      - name: Run governed learning benchmark tests
        run: node --experimental-strip-types scripts/test-governed-learning-benchmarks.mjs
      - name: Run governed learning paired benchmark tests
        run: node --experimental-strip-types scripts/test-governed-learning-paired-benchmark.mjs
      - name: Run governed learning evaluation ledger tests
        run: node --experimental-strip-types scripts/test-governed-learning-evaluation-ledger.mjs
      - name: Run governed benchmark dataset manifest tests
        run: node scripts/test-learning-benchmark-dataset-manifest.mjs
      - name: Run governed self-improvement adversarial tests
        run: node scripts/test-learning-self-improvement-adversarial.mjs
      - name: Run prospective learning outcome tests
        run: node scripts/test-governed-learning-prospective-outcomes.mjs
      - name: Check isolated prospective outcome SQL fixture contract
        run: node scripts/test-learning-prospective-outcome-fixture-contract.mjs
      - name: Run terminal learning outcome coverage tests
        run: node scripts/test-agent-run-outcome-coverage.mjs
      - name: Run prospective learning Command Center tests
        run: node scripts/test-prospective-learning-command-center.mjs
      - name: Run governed learning release approval tests
        run: node --experimental-strip-types scripts/test-governed-learning-release-approval.mjs
      - name: Run governed learning controlled release tests
        run: node --experimental-strip-types scripts/test-governed-learning-controlled-release.mjs
      - name: Run governed learning Command Center tests
        run: node --experimental-strip-types scripts/test-governed-learning-command-center.mjs
      - name: Run PGCL Command Center observability tests
        run: node scripts/test-pgcl-command-center-observability.mjs
      - name: Run continuous learning governance tests
        run: node --experimental-strip-types --test scripts/test-continuous-learning-governance.mjs
      - name: Run independent continuous learning governance adversarial audit
        run: node scripts/audit-continuous-learning-governance-adversarial.mjs

  database-fixture:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Execute isolated benchmark manifest fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-learning-benchmark-dataset-manifest.sql

  learning-runner-database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Execute isolated paired experiment runner fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-learning-paired-experiment-runner.sql

  learning-budget-database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Create disposable learning budget fixture database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: createdb datanexus_fixture_learning_budget
      - name: Execute isolated learning budget admission and concurrency fixture
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: datanexus_fixture_learning_budget
          PGPASSWORD: postgres
          DATANEXUS_DISPOSABLE_FIXTURE_CONFIRM: I_ACCEPT_DESTRUCTIVE_FIXTURE
        run: bash scripts/run-learning-experiment-budget-fixture.sh

  learning-runner-database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Create disposable learning runner fixture database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: createdb datanexus_fixture_learning_runner
      - name: Execute isolated learning runner evidence and dispatch concurrency fixture
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: datanexus_fixture_learning_runner
          PGPASSWORD: postgres
          DATANEXUS_DISPOSABLE_FIXTURE_CONFIRM: I_ACCEPT_DESTRUCTIVE_FIXTURE
        run: bash scripts/run-learning-experiment-runner-fixture.sh
