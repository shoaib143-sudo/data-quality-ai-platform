name: Governance Intelligence

on:
  push:
    branches: [main, governed-governance-intelligence]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-governance-intelligence.mjs'
      - '.github/workflows/governance-intelligence.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-governance-intelligence.mjs'
      - '.github/workflows/governance-intelligence.yml'

permissions:
  contents: read

jobs:
  module13-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify transparent governed governance intelligence
        run: node scripts/verify-governance-intelligence.mjs
