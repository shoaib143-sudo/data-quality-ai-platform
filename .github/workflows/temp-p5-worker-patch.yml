name: Temporary P5 Worker Patch

on:
  push:
    branches:
      - implementation/p0-p5-revalidation-20260910

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p5-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: implementation/p0-p5-revalidation-20260910
      - name: Apply worker pool runtime patch
        run: node scripts/patch-p5-worker-pools.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/orchestration/queue.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(orchestration): route workers through isolated pools [p5-patched]"
          git push origin HEAD:implementation/p0-p5-revalidation-20260910
