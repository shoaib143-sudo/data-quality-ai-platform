name: V6 Operational Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Exact-main certification trigger contract
        run: node --test tests/exact-main-certification-contract.test.mjs
      - name: PR fast-path certification preflight
        if: github.event_name == 'pull_request'
        run: |
          node scripts/audit-user-facing-admin-routes.mjs
          node scripts/verify-migration-version-uniqueness.mjs
          node scripts/verify-clean-membership-helper-acl-replay.mjs
          node scripts/verify-clean-synthetic-rollback-replay.mjs
          pnpm run verify:worker-runtime
          pnpm run verify:provider-fallback
          pnpm run verify:model-gateway
      - name: Full post-merge operational certification
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/verify-v0-trusted-governance-baseline.mjs
          node scripts/verify-journey-sensitive-governance.mjs
          node scripts/verify-journey-dq-incident.mjs
          node scripts/verify-journey-change-governance.mjs
          node scripts/verify-journey-governed-investigation.mjs
          node scripts/verify-journey-governed-outcome-learning.mjs
          node scripts/audit-user-facing-admin-routes.mjs
          pnpm run verify:worker-runtime
          pnpm run verify:provider-fallback
          pnpm run verify:model-gateway
          pnpm run verify:execution-controller
          pnpm run verify:retrieval-provider
          pnpm run verify:evaluation-engine
          node scripts/verify-migration-version-uniqueness.mjs
          node scripts/verify-clean-membership-helper-acl-replay.mjs
          node scripts/verify-clean-synthetic-rollback-replay.mjs
          node scripts/verify-journey-operational-certification.mjs
          pnpm run build
      - name: Authenticated live database contracts
        if: github.event_name != 'pull_request'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            {
              echo '## Live governance database verification'
              echo 'Status: NOT_MEASURED in CI because the required Supabase credentials are not configured for this workflow.'
              echo 'This is not a PASS. Release evidence must include a separate authenticated live database validation.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'Live governance database credentials are available; authenticated database verification will run.'
          pnpm run verify:database

  runtime-slo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: PR runtime SLO contract preflight
        if: github.event_name == 'pull_request'
        run: pnpm run verify:readiness
      - name: Production concurrency and latency SLO
        if: github.event_name != 'pull_request'
        env:
          PRODUCTION_URL: https://data-quality-ai-platform.vercel.app
          BENCHMARK_PATH: /login
          BENCHMARK_REQUESTS: '50'
          BENCHMARK_CONCURRENCY: '10'
          BENCHMARK_MAX_P95_MS: '1500'
          BENCHMARK_MAX_P99_MS: '3000'
          BENCHMARK_MAX_ERROR_RATE: '0.01'
          BENCHMARK_MIN_SUCCESSFUL_REQUESTS: '45'
        shell: bash
        run: |
          set -o pipefail
          pnpm run benchmark:production | tee "$RUNNER_TEMP/v6-runtime-slo.json"
          {
            echo '## V6 production runtime SLO'
            echo '```json'
            cat "$RUNNER_TEMP/v6-runtime-slo.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  clean-database-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: PR database reconstruction preflight
        if: github.event_name == 'pull_request'
        run: |
          node scripts/verify-migration-version-uniqueness.mjs
          node scripts/verify-clean-membership-helper-acl-replay.mjs
          node scripts/verify-clean-synthetic-rollback-replay.mjs
          node scripts/verify-p0-p4-revalidation.mjs
      - name: Reconstruct clean Supabase database from migrations
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-migration-version-uniqueness.mjs
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/datanexus-clean-reconstruction"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          pnpm dlx supabase@2.117.0 init
          SOURCE_MIGRATION_DIR="$ROOT/supabase/migrations" TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-migration-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-agent-status-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-audit-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-jdbc-fixture-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-observability-incident-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-lineage-legacy-constraint-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-remediation-knowledge-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-governance-intelligence-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-governance-policy-boundary-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-governance-operational-policy-boundary-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-control-evidence-syntax-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-catalog-reconcile-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-membership-helper-acl-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-synthetic-suite-rollback-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-analysis-evidence-envelope-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-security-definer-acl-replay.mjs"
          pnpm dlx supabase@2.117.0 start
          trap 'pnpm dlx supabase@2.117.0 stop --no-backup || true' EXIT
          pnpm dlx supabase@2.117.0 db reset --local
          DB_URL="$(pnpm dlx supabase@2.117.0 status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$ROOT/scripts/assert-synthetic-governance-suite.sql"
          pnpm dlx supabase@2.117.0 migration list --local
