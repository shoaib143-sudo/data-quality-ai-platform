name: Project Profile Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Verify project profile readiness contract
        run: node scripts/verify-project-profile-readiness.mjs

      - name: Verify governed AI remediation contract
        run: node scripts/verify-profile-readiness-ai-remediation.mjs

      - name: Unit test remediation policy
        run: node --experimental-strip-types scripts/test-profile-readiness-remediation-policy.mjs

      - name: Test human remediation UX contract
        run: node scripts/test-profile-readiness-human-remediation-ux.mjs

      - name: Audit human remediation UX adversarially
        run: node scripts/audit-profile-readiness-human-remediation-ux-adversarial.mjs

      - name: Run independent adversarial audit
        run: node scripts/audit-project-profile-readiness-adversarial.mjs

      - name: Install PostgreSQL for isolated readiness tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql

      - name: Execute dynamic readiness failure matrix
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -f scripts/test-project-profile-readiness.sql

      - name: Execute profile-run admission tests
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -f scripts/test-project-profile-readiness-admission.sql

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript revalidation
        run: pnpm exec tsc --noEmit
