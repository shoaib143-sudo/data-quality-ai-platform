name: Persona workspace link composition

on:
  pull_request:
    paths:
      - 'app/lineage/layout.tsx'
      - 'app/datasets/layout.tsx'
      - 'app/catalog/page.tsx'
      - 'lib/governance/workspace-policy.ts'
      - 'scripts/test-persona-workspace-link-composition.mjs'
      - 'scripts/audit-persona-workspace-link-composition-adversarial.mjs'
      - '.github/workflows/persona-workspace-link-composition.yml'

permissions:
  contents: read

jobs:
  persona-workspace-link-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Contract and negative cases
        run: node scripts/test-persona-workspace-link-composition.mjs
      - name: Independent adversarial audit
        run: node scripts/audit-persona-workspace-link-composition-adversarial.mjs
