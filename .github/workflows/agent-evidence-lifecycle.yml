name: Agent Evidence Lifecycle

on:
  pull_request:
    paths:
      - 'lib/agents/evidence-lifecycle.ts'
      - 'supabase/migrations/20260915025000_agent_evidence_retention_and_legal_hold.sql'
      - 'scripts/verify-agent-evidence-lifecycle.mjs'
      - '.github/workflows/agent-evidence-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'lib/agents/evidence-lifecycle.ts'
      - 'supabase/migrations/20260915025000_agent_evidence_retention_and_legal_hold.sql'
      - 'scripts/verify-agent-evidence-lifecycle.mjs'
      - '.github/workflows/agent-evidence-lifecycle.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify governed evidence lifecycle
        run: node scripts/verify-agent-evidence-lifecycle.mjs
