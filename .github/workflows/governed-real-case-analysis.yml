name: Governed Real Case Analysis

on:
  pull_request:
    paths:
      - 'app/api/analytics/governed-real-cases/route.ts'
      - 'lib/data-quality/governed-real-case-analysis.ts'
      - 'lib/data-quality/governed-real-case-analysis-service.ts'
      - 'lib/data-quality/production-evidence-eligibility.ts'
      - 'supabase/migrations/20260915111000_governed_real_case_analysis_hardening.sql'
      - 'scripts/verify-governed-real-case-analysis.mjs'
      - 'scripts/test-production-evidence-eligibility.mjs'
      - '.github/workflows/governed-real-case-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/analytics/governed-real-cases/route.ts'
      - 'lib/data-quality/governed-real-case-analysis.ts'
      - 'lib/data-quality/governed-real-case-analysis-service.ts'
      - 'lib/data-quality/production-evidence-eligibility.ts'
      - 'supabase/migrations/20260915111000_governed_real_case_analysis_hardening.sql'
      - 'scripts/verify-governed-real-case-analysis.mjs'
      - 'scripts/test-production-evidence-eligibility.mjs'
      - '.github/workflows/governed-real-case-analysis.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify governed real-case analysis contracts
        run: node scripts/verify-governed-real-case-analysis.mjs
      - name: Test production evidence eligibility
        run: node --experimental-strip-types scripts/test-production-evidence-eligibility.mjs
