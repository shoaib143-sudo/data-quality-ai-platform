name: Governed Real Case Analysis

on:
  pull_request:
    paths:
      - 'lib/data-quality/governed-real-case-analysis.ts'
      - 'lib/data-quality/governed-real-case-analysis-service.ts'
      - 'supabase/migrations/20260915111000_governed_real_case_analysis_hardening.sql'
      - 'scripts/verify-governed-real-case-analysis.mjs'
      - '.github/workflows/governed-real-case-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'lib/data-quality/governed-real-case-analysis.ts'
      - 'lib/data-quality/governed-real-case-analysis-service.ts'
      - 'supabase/migrations/20260915111000_governed_real_case_analysis_hardening.sql'
      - 'scripts/verify-governed-real-case-analysis.mjs'
      - '.github/workflows/governed-real-case-analysis.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify governed real-case analysis contracts
        run: node scripts/verify-governed-real-case-analysis.mjs
