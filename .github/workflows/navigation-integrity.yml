name: Navigation Integrity

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/governance/**'
      - 'lib/governance/personas.ts'
      - 'lib/governance/workspace-access.ts'
      - 'lib/governance/workspace-policy.ts'
      - 'lib/platform/canonical-routes.ts'
      - 'lib/platform/resource-route-contracts.mjs'
      - 'scripts/verify-agent-detail-route.mjs'
      - 'scripts/verify-navigation-integrity.mjs'
      - 'scripts/verify-persona-workspace-policy.mjs'
      - 'scripts/test-canonical-routes.mjs'
      - '.github/workflows/navigation-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/governance/**'
      - 'lib/governance/personas.ts'
      - 'lib/governance/workspace-access.ts'
      - 'lib/governance/workspace-policy.ts'
      - 'lib/platform/canonical-routes.ts'
      - 'lib/platform/resource-route-contracts.mjs'
      - 'scripts/verify-agent-detail-route.mjs'
      - 'scripts/verify-navigation-integrity.mjs'
      - 'scripts/verify-persona-workspace-policy.mjs'
      - 'scripts/test-canonical-routes.mjs'
      - '.github/workflows/navigation-integrity.yml'

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify agent detail navigation
        run: node scripts/verify-agent-detail-route.mjs
      - name: Verify platform resource route contracts
        run: node scripts/verify-navigation-integrity.mjs
      - name: Verify persona workspace policy
        run: node --experimental-strip-types scripts/verify-persona-workspace-policy.mjs
      - name: Test canonical route builder
        run: node --experimental-strip-types scripts/test-canonical-routes.mjs
      - name: Test Product Shell UI and CTA contract
        run: node scripts/test-product-shell-ux.mjs
      - name: Test Dataset 360 UI and CTA contract
        run: node scripts/test-dataset-360-ux.mjs
      - name: Test Governance Run UI and failure-state contract
        run: node scripts/test-governance-run-ux.mjs
      - name: Test Golden Path profiling handoff
        run: node --experimental-strip-types scripts/test-golden-path-handoff.mjs
      - name: Test remediation verified-closure UX
        run: node --experimental-strip-types scripts/test-remediation-closure-ux.mjs
      - name: Run independent UX closure adversarial audit
        run: node --experimental-strip-types scripts/audit-ux-closure-wave-adversarial.mjs
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Revalidate profiling lifecycle
        run: node scripts/verify-profiling-lifecycle-contracts.mjs
      - name: Revalidate remediation lifecycle
        run: node scripts/verify-profiling-remediation.mjs
      - name: Exact-head TypeScript revalidation
        run: pnpm exec tsc --noEmit
      - name: Exact-head production build
        run: pnpm run build