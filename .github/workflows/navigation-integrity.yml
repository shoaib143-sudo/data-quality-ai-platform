jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify agent detail navigation
        run: node scripts/verify-agent-detail-route.mjs
      - name: Verify platform resource route contracts
        run: node scripts/verify-navigation-integrity.mjs
      - name: Verify persona workspace policy
        run: node --experimental-strip-types scripts/verify-persona-workspace-policy.mjs
      - name: Test canonical route builder
        run: node --experimental-strip-types scripts/test-canonical-routes.mjs
      - name: Test Product Shell UI and CTA contract
        run: node scripts/test-product-shell-ux.mjs
      - name: Test Dataset 360 UI and CTA contract
        run: node scripts/test-dataset-360-ux.mjs
      - name: Test Governance Run UI and failure-state contract
        run: node scripts/test-governance-run-ux.mjs
      - name: Test Golden Path profiling handoff
        run: node --experimental-strip-types scripts/test-golden-path-handoff.mjs
      - name: Test remediation verified-closure UX
        run: node --experimental-strip-types scripts/test-remediation-closure-ux.mjs
      - name: Test UX closure CTA inventory and accessibility
        run: node scripts/test-ux-closure-cta-inventory.mjs
      - name: Run independent UX closure adversarial audit
