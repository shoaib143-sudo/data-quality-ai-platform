name: Navigation Integrity

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/governance/**'
      - 'components/app-shell/**'
      - 'lib/governance/remediation-closure-state.ts'
      - 'lib/governance/remediation-sla.ts'
      - 'scripts/test-ux-wave2-shell-contract.mjs'
      - 'scripts/test-source-onboarding-continuation.mjs'
      - 'scripts/test-dataset360-profile-history.mjs'
      - 'scripts/test-remediation-sla-unit.mjs'
      - 'scripts/test-governance-run-observability-sla.mjs'
      - 'scripts/audit-ux-wave2-adversarial.mjs'
      - 'scripts/test-ux-wave2-cta-inventory.mjs'
      - 'lib/monitoring/monitor-route.ts'
      - 'lib/governance/approval-inbox.ts'
      - 'lib/governance/governed-incident-view.ts'
      - 'scripts/test-ux-wave3-shell-approvals-workflows.mjs'
      - 'scripts/test-approval-monitor-route.mjs'
      - 'scripts/test-governance-run-inline-decisions-recovery.mjs'
      - 'scripts/test-dataset360-version-history.mjs'
      - 'scripts/test-governed-incident-evidence-timeline.mjs'
      - 'scripts/test-ux-wave3-cta-inventory.mjs'
      - 'scripts/audit-ux-wave3-adversarial.mjs'
      - 'lib/profiling/profiling-run-handoff.ts'
      - 'scripts/test-product-shell-ux.mjs'
      - 'scripts/test-dataset-360-ux.mjs'
      - 'scripts/test-governance-run-ux.mjs'
      - 'scripts/test-golden-path-handoff.mjs'
      - 'scripts/test-remediation-closure-ux.mjs'
      - 'scripts/test-ux-closure-cta-inventory.mjs'
      - 'scripts/audit-ux-closure-wave-adversarial.mjs'
      - 'lib/governance/personas.ts'
      - 'lib/governance/workspace-access.ts'
      - 'lib/governance/workspace-policy.ts'
      - 'lib/platform/canonical-routes.ts'
      - 'lib/platform/resource-route-contracts.mjs'
      - 'scripts/verify-agent-detail-route.mjs'
      - 'scripts/verify-navigation-integrity.mjs'
      - 'scripts/verify-persona-workspace-policy.mjs'
      - 'scripts/test-canonical-routes.mjs'
      - '.github/workflows/navigation-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/governance/**'
      - 'components/app-shell/**'
      - 'lib/governance/remediation-closure-state.ts'
      - 'lib/governance/remediation-sla.ts'
      - 'scripts/test-ux-wave2-shell-contract.mjs'
      - 'scripts/test-source-onboarding-continuation.mjs'
      - 'scripts/test-dataset360-profile-history.mjs'
      - 'scripts/test-remediation-sla-unit.mjs'
      - 'scripts/test-governance-run-observability-sla.mjs'
      - 'scripts/audit-ux-wave2-adversarial.mjs'
      - 'scripts/test-ux-wave2-cta-inventory.mjs'
      - 'lib/monitoring/monitor-route.ts'
      - 'lib/governance/approval-inbox.ts'
      - 'lib/governance/governed-incident-view.ts'
      - 'scripts/test-ux-wave3-shell-approvals-workflows.mjs'
      - 'scripts/test-approval-monitor-route.mjs'
      - 'scripts/test-governance-run-inline-decisions-recovery.mjs'
      - 'scripts/test-dataset360-version-history.mjs'
      - 'scripts/test-governed-incident-evidence-timeline.mjs'
      - 'scripts/test-ux-wave3-cta-inventory.mjs'
      - 'scripts/audit-ux-wave3-adversarial.mjs'
      - 'lib/profiling/profiling-run-handoff.ts'
      - 'scripts/test-product-shell-ux.mjs'
      - 'scripts/test-dataset-360-ux.mjs'
      - 'scripts/test-governance-run-ux.mjs'
      - 'scripts/test-golden-path-handoff.mjs'
      - 'scripts/test-remediation-closure-ux.mjs'
      - 'scripts/test-ux-closure-cta-inventory.mjs'
      - 'scripts/audit-ux-closure-wave-adversarial.mjs'
      - 'lib/governance/personas.ts'
      - 'lib/governance/workspace-access.ts'
      - 'lib/governance/workspace-policy.ts'
      - 'lib/platform/canonical-routes.ts'
      - 'lib/platform/resource-route-contracts.mjs'
      - 'scripts/verify-agent-detail-route.mjs'
      - 'scripts/verify-navigation-integrity.mjs'
      - 'scripts/verify-persona-workspace-policy.mjs'
      - 'scripts/test-canonical-routes.mjs'
      - '.github/workflows/navigation-integrity.yml'

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify agent detail navigation
        run: node scripts/verify-agent-detail-route.mjs
      - name: Verify platform resource route contracts
        run: node scripts/verify-navigation-integrity.mjs
      - name: Verify persona workspace policy
        run: node --experimental-strip-types scripts/verify-persona-workspace-policy.mjs
      - name: Test canonical route builder
        run: node --experimental-strip-types scripts/test-canonical-routes.mjs
      - name: Test Product Shell UI and CTA contract
        run: node scripts/test-product-shell-ux.mjs
      - name: Test Dataset 360 UI and CTA contract
        run: node scripts/test-dataset-360-ux.mjs
      - name: Test Governance Run UI and failure-state contract
        run: node scripts/test-governance-run-ux.mjs
      - name: Test Golden Path profiling handoff
        run: node --experimental-strip-types scripts/test-golden-path-handoff.mjs
      - name: Test remediation verified-closure UX
        run: node --experimental-strip-types scripts/test-remediation-closure-ux.mjs
      - name: Test UX closure CTA inventory and accessibility
        run: node scripts/test-ux-closure-cta-inventory.mjs
      - name: Run independent UX closure adversarial audit
        run: node --experimental-strip-types scripts/audit-ux-closure-wave-adversarial.mjs
      - name: Test Wave 2 Product Shell journey surfaces
        run: node scripts/test-ux-wave2-shell-contract.mjs
      - name: Test source onboarding continuation
        run: node scripts/test-source-onboarding-continuation.mjs
      - name: Test Dataset 360 profile history
        run: node scripts/test-dataset360-profile-history.mjs
      - name: Test remediation SLA unit and negative cases
        run: node --experimental-strip-types scripts/test-remediation-sla-unit.mjs
      - name: Test Governance Run observability and SLA
        run: node scripts/test-governance-run-observability-sla.mjs
      - name: Test Wave 2 CTA inventory and interaction states
        run: node scripts/test-ux-wave2-cta-inventory.mjs
      - name: Run independent Wave 2 adversarial audit
        run: node --experimental-strip-types scripts/audit-ux-wave2-adversarial.mjs
      - name: Test Wave 3 Approvals and Workflows Product Shell
        run: node scripts/test-ux-wave3-shell-approvals-workflows.mjs
      - name: Test approval monitor route and negative cases
        run: node --experimental-strip-types scripts/test-approval-monitor-route.mjs
      - name: Test Governance Run inline decisions and failure recovery
        run: node scripts/test-governance-run-inline-decisions-recovery.mjs
      - name: Test Dataset 360 version history
        run: node scripts/test-dataset360-version-history.mjs
      - name: Test governed incident evidence timeline
        run: node scripts/test-governed-incident-evidence-timeline.mjs
      - name: Test Wave 3 CTA inventory and interaction states
        run: node scripts/test-ux-wave3-cta-inventory.mjs
      - name: Run independent Wave 3 adversarial audit
        run: node --experimental-strip-types scripts/audit-ux-wave3-adversarial.mjs
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Revalidate profiling lifecycle
        run: node scripts/verify-profiling-lifecycle-contracts.mjs
      - name: Revalidate remediation lifecycle
        run: node scripts/verify-profiling-remediation.mjs
      - name: Exact-head TypeScript revalidation
        run: pnpm exec tsc --noEmit
      - name: Exact-head production build
        run: pnpm run build