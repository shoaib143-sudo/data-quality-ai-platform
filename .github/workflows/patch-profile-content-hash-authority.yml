name: Patch profile content hash authority

on:
  push:
    branches: [fix/profile-content-hash-authority-evidence]
    paths:
      - '.github/workflows/patch-profile-content-hash-authority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-content-hash-authority-evidence
      - name: Preserve source byte hash authority
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/profiling/metric-engine.ts')
          s = p.read_text()
          old = """        source_type: sourceType === 'csv' ? 'CSV' : 'FILE',\n        source_uri: loaded.sourceUri,\n        content_hash: loaded.contentHash,\n        warnings: loaded.warnings,"""
          new = """        source_type: sourceType === 'csv' ? 'CSV' : 'FILE',\n        source_uri: loaded.sourceUri,\n        content_hash: loaded.contentHash,\n        content_hash_authority: 'SOURCE_BYTES_SHA256',\n        warnings: loaded.warnings,"""
          if old not in s:
              raise SystemExit('metric-engine FILE source access patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('scripts/verify-profile-evidence-reuse.mjs')
          s = p.read_text()
          needle = "requireText(fileProfile, \"content_hash_authority: 'SOURCE_BYTES_SHA256'\", 'FILE byte-hash authority evidence')\n"
          addition = needle + "requireText(fs.readFileSync('lib/profiling/metric-engine.ts', 'utf8'), \"content_hash_authority: 'SOURCE_BYTES_SHA256'\", 'metric execution preserves FILE byte-hash authority')\n"
          if needle not in s:
              raise SystemExit('reuse verifier insertion target not found')
          p.write_text(s.replace(needle, addition, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/profiling/metric-engine.ts scripts/verify-profile-evidence-reuse.mjs
          git commit -m "Preserve profile source byte hash authority"
          git push origin HEAD:fix/profile-content-hash-authority-evidence
