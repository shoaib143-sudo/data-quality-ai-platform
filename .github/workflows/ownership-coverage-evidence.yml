name: Ownership Coverage Evidence

on:
  pull_request:
    paths:
      - 'app/home/[persona]/page.tsx'
      - 'scripts/verify-ownership-coverage-evidence.mjs'
      - '.github/workflows/ownership-coverage-evidence.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify ownership evidence contract
        run: node scripts/verify-ownership-coverage-evidence.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
