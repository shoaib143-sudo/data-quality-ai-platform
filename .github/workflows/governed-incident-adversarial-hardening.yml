name: Governed Incident Adversarial Hardening

on:
  pull_request:
    paths:
      - 'app/api/issues/**'
      - 'lib/governance/governed-incident*.ts'
      - 'lib/governance/incident-resolution-integrity.ts'
      - 'lib/governance/issue-reference-integrity.ts'
      - 'supabase/migrations/20260912043500_governance_issue_resolution_timestamp_integrity.sql'
      - 'scripts/test-governed-incident-adversarial-hardening.mjs'
      - '.github/workflows/governed-incident-adversarial-hardening.yml'

permissions:
  contents: read

jobs:
  adversarial-incident:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Governed incident adversarial lifecycle tests
        run: node --experimental-strip-types scripts/test-governed-incident-adversarial-hardening.mjs
      - name: Canonical governed incident lifecycle regression
        run: node --experimental-strip-types scripts/test-governed-incident-foundation.mjs
      - name: 13-persona truth invariance regression
        run: node --experimental-strip-types --experimental-loader ./scripts/ts-extension-loader.mjs scripts/test-governed-incident-13-persona-certification.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
