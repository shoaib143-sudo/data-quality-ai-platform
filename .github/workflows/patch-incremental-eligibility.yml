name: Patch incremental eligibility integration

on:
  push:
    branches: [feat/truth-aware-incremental-eligibility]
    paths:
      - '.github/workflows/patch-incremental-eligibility.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/truth-aware-incremental-eligibility
      - name: Integrate planner telemetry
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/orchestration/adaptive-dispatch.ts')
          s = p.read_text()
          old = """import {\n  resolveAdaptiveSourceLimits,\n  resolveJobSourceResources,\n  type JobSourceResource,\n} from '@/lib/orchestration/source-concurrency'\n"""
          new = old + """import {\n  recordIncrementalEligibilityTelemetry,\n  resolveIncrementalEligibility,\n} from '@/lib/orchestration/incremental-eligibility'\n"""
          if old not in s:
              raise SystemExit('adaptive dispatch import target not found')
          s = s.replace(old, new, 1)

          old = """    const [concurrency, resources, workload] = await Promise.all([\n      resolveCoreConcurrency(jobs, requestedConcurrency),\n      resolveJobSourceResources(jobs),\n      characterizeDurableJobs(jobs),\n    ])\n"""
          new = """    const [concurrency, resources, workload, incrementalEligibility] = await Promise.all([\n      resolveCoreConcurrency(jobs, requestedConcurrency),\n      resolveJobSourceResources(jobs),\n      characterizeDurableJobs(jobs),\n      resolveIncrementalEligibility(jobs),\n    ])\n"""
          if old not in s:
              raise SystemExit('adaptive dispatch enrichment target not found')
          s = s.replace(old, new, 1)

          old = """    await Promise.all([\n      recordWorkloadTelemetry(jobs, workload),\n      recordCriticalPathTelemetry(jobs, criticalPath),\n    ])\n"""
          new = """    await Promise.all([\n      recordWorkloadTelemetry(jobs, workload),\n      recordCriticalPathTelemetry(jobs, criticalPath),\n      recordIncrementalEligibilityTelemetry(jobs, incrementalEligibility),\n    ])\n"""
          if old not in s:
              raise SystemExit('adaptive dispatch telemetry target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('.github/workflows/adaptive-scheduler-v1.yml')
          s = p.read_text()
          s = s.replace("      - 'lib/orchestration/**'\n", "      - 'lib/orchestration/**'\n", 1)
          old = """      - 'scripts/verify-profile-evidence-reuse.mjs'\n      - '.github/workflows/adaptive-scheduler-v1.yml'\n"""
          new = """      - 'scripts/verify-profile-evidence-reuse.mjs'\n      - 'scripts/verify-incremental-eligibility.mjs'\n      - '.github/workflows/adaptive-scheduler-v1.yml'\n"""
          if s.count(old) != 2:
              raise SystemExit(f'adaptive scheduler workflow path target count was {s.count(old)}, expected 2')
          s = s.replace(old, new)
          old = """      - run: node scripts/verify-profile-evidence-reuse.mjs\n      - run: pnpm run build\n"""
          new = """      - run: node scripts/verify-profile-evidence-reuse.mjs\n      - run: node scripts/verify-incremental-eligibility.mjs\n      - run: pnpm run build\n"""
          if old not in s:
              raise SystemExit('adaptive scheduler workflow step target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/orchestration/adaptive-dispatch.ts .github/workflows/adaptive-scheduler-v1.yml
          git commit -m "Integrate incremental eligibility telemetry"
          git push origin HEAD:feat/truth-aware-incremental-eligibility
