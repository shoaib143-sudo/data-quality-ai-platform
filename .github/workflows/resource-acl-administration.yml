name: Resource ACL Administration

on:
  pull_request:
    paths:
      - 'lib/platform/resource-route-contracts.mjs'
      - 'app/api/agents/runs/[runId]/evaluation/route.ts'
      - 'app/agents/runs/[runId]/page.tsx'
      - 'lib/governance/resource-authorization.ts'
      - 'tests/agent-run-detail-resource-acl.test.mjs'
      - 'app/resource-access/**'
      - 'app/api/resource-access/**'
      - 'lib/governance/resource-access-admin-service.ts'
      - 'scripts/verify-resource-acl-administration.mjs'
      - '.github/workflows/resource-acl-administration.yml'
  push:
    branches: [main]
    paths:
      - 'app/agents/runs/[runId]/page.tsx'
      - 'app/api/agents/runs/[runId]/evaluation/route.ts'
      - 'lib/platform/resource-route-contracts.mjs'
      - 'lib/governance/resource-authorization.ts'
      - 'tests/agent-run-detail-resource-acl.test.mjs'
      - 'app/resource-access/**'
      - 'app/api/resource-access/**'
      - 'lib/governance/resource-access-admin-service.ts'
      - 'scripts/verify-resource-acl-administration.mjs'
      - '.github/workflows/resource-acl-administration.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify resource ACL administration
        run: node scripts/verify-resource-acl-administration.mjs
      - name: Verify direct Agent Run resource ACL
        run: node --test tests/agent-run-detail-resource-acl.test.mjs
