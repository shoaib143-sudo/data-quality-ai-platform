name: Governance Specialist Replay

on:
  push:
    branches: [main]
    paths:
      - 'lib/agents/governance-specialist-agent.ts'
      - 'lib/agents/governed-agent-registry.ts'
      - 'app/api/agents/governance/run/route.ts'
      - 'supabase/migrations/**governance_specialist**'
      - 'scripts/verify-governance-specialist-replay.mjs'
      - '.github/workflows/governance-specialist-replay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/agents/governance-specialist-agent.ts'
      - 'lib/agents/governed-agent-registry.ts'
      - 'app/api/agents/governance/run/route.ts'
      - 'supabase/migrations/**governance_specialist**'
      - 'scripts/verify-governance-specialist-replay.mjs'
      - '.github/workflows/governance-specialist-replay.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify governance specialist replay certification
        run: node scripts/verify-governance-specialist-replay.mjs
