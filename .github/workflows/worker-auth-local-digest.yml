name: Worker Auth Local Digest

on:
  push:
    branches: [main]
    paths:
      - 'app/api/jobs/worker/route.ts'
      - 'lib/orchestration/worker-auth.ts'
      - 'scripts/test-worker-auth-local-digest.mjs'
      - 'scripts/verify-worker-auth-local-digest.mjs'
      - '.github/workflows/worker-auth-local-digest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/api/jobs/worker/route.ts'
      - 'lib/orchestration/worker-auth.ts'
      - 'scripts/test-worker-auth-local-digest.mjs'
      - 'scripts/verify-worker-auth-local-digest.mjs'
      - '.github/workflows/worker-auth-local-digest.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit test local worker bearer verification
        run: node --experimental-strip-types scripts/test-worker-auth-local-digest.mjs
      - name: Verify worker auth boundary
        run: node scripts/verify-worker-auth-local-digest.mjs
      - name: TypeScript revalidation
        run: pnpm exec tsc --noEmit
