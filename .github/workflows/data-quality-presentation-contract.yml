name: Data quality presentation contract

on:
  pull_request:
    paths:
      - 'app/data-quality/page.tsx'
      - 'scripts/test-data-quality-presentation-contract.mjs'
      - 'scripts/audit-data-quality-presentation-adversarial.mjs'
      - '.github/workflows/data-quality-presentation-contract.yml'

permissions:
  contents: read

jobs:
  data-quality-presentation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Presentation contract and negative cases
        run: node scripts/test-data-quality-presentation-contract.mjs
      - name: Independent adversarial audit
        run: node scripts/audit-data-quality-presentation-adversarial.mjs
