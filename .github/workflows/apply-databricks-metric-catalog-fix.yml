name: Apply Databricks Metric Catalog Fix
on:
  push:
    branches:
      - fix/jdbc-promotion-runtime-config
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jdbc-promotion-runtime-config
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Apply fix
        run: python .github/scripts/apply_databricks_metric_catalog_fix.py
      - name: Verify catalog propagation
        run: node scripts/verify-databricks-metric-catalog.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/profiling/metric-engine.ts
          git commit -m 'Preserve Databricks catalog in profiling row loads'
          git push origin HEAD:fix/jdbc-promotion-runtime-config
