name: AI Governance Recommendations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*governance_recommendation*.sql'
      - 'scripts/verify-ai-governance-recommendations.mjs'
      - '.github/workflows/ai-governance-recommendations.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*governance_recommendation*.sql'
      - 'scripts/verify-ai-governance-recommendations.mjs'
      - '.github/workflows/ai-governance-recommendations.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-ai-governance-recommendations.mjs
      - run: node scripts/verify-ai-capability-matrix.mjs
      - run: pnpm run build
