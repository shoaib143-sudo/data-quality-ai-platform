name: Persona Governance Hardening

on:
  pull_request:
    paths:
      - 'app/issues/**'
      - 'app/api/issues/**'
      - 'lib/governance/issue-reference-integrity.ts'
      - 'lib/governance/persona-findings-issues-presentation.ts'
      - 'lib/governance/persona-presentation-view.ts'
      - 'scripts/verify-persona-governance-hardening.mjs'
      - '.github/workflows/persona-governance-hardening.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify persona governance hardening
        run: node scripts/verify-persona-governance-hardening.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
