name: Persona Workspace Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify all persona landing and workspace routes
        run: node --experimental-strip-types scripts/verify-persona-workspace-policy.mjs
      - name: Verify Agent Policy v2 foundation
        run: node --experimental-strip-types scripts/verify-agent-policy-v2.mjs
      - name: Run Agent Policy v2 unit tests
        run: node --experimental-strip-types scripts/test-agent-policy-v2-unit.mjs
      - name: Run independent Agent Policy v2 adversarial audit
        run: node --experimental-strip-types scripts/audit-agent-policy-v2-adversarial.mjs
      - name: Verify real-life persona acceptance task contract
        run: node --experimental-strip-types scripts/verify-persona-real-life-task-contract.mjs
      - name: Verify persona mutation visibility matches server authorization
        run: node scripts/verify-persona-mutation-visibility.mjs
      - name: Verify shared DataNexus UX foundation
        run: node scripts/verify-ux-foundation.mjs
      - name: Verify shared DataNexus theme contract
        run: node scripts/verify-datanexus-theme-contract.mjs
      - name: Verify persona landing scope integrity
        run: node scripts/verify-persona-landing-scope-integrity.mjs
      - name: Verify 13 persona landing content parity
        run: node --experimental-strip-types scripts/verify-persona-landing-content-parity.mjs
      - name: Verify floating DataNexus AI Agent
        run: node scripts/verify-floating-ai-agent.mjs
      - name: Verify whole-product DataNexus theme
        run: node scripts/verify-whole-product-theme.mjs
      - name: Verify UX product telemetry contract
        run: node scripts/verify-ux-product-telemetry.mjs
      - name: Verify policy-denied UX contract
        run: node scripts/verify-ux-policy-denied-state.mjs
