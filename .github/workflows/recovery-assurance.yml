name: Recovery Assurance

on:
  pull_request:
    paths:
      - 'scripts/recovery-drill.mjs'
      - 'scripts/recovery/**'
      - 'scripts/verify-recovery-assurance.mjs'
      - 'scripts/verify-recovery-source-authority.mjs'
      - 'scripts/verify-portable-recovery.mjs'
      - 'scripts/verify-full-platform-recovery-scopes.mjs'
      - 'scripts/verify-governance-runtime-wiring.mjs'
      - 'scripts/verify-certification-best-practice-hardening-v2.mjs'
      - 'scripts/test-certification-best-practice-hardening-v2.mjs'
      - 'scripts/evaluate-post-implementation-certification.mjs'
      - 'scripts/test-post-implementation-certification-decision.mjs'
      - 'scripts/test-governance-*.mjs'
      - 'scripts/test-governed-handoff.mjs'
      - 'scripts/audit-governance-orchestrator-final-assurance.mjs'
      - 'app/api/agents/governance-orchestrator/**'
      - 'lib/agents/runtime/governed-handoff*.ts'
      - 'lib/orchestration/governance-outcome-report*.ts'
      - 'lib/orchestration/governance-report-*.ts'
      - 'lib/orchestration/governance-recovery*.ts'
      - 'lib/orchestration/execution-recovery*.ts'
      - 'scripts/test-execution-recovery-*.mjs'
      - 'scripts/assert-execution-recovery-runtime.sql'
      - 'scripts/verify-execution-recovery-agent.mjs'
      - 'lib/orchestration/governance-orchestrator-approval-service.ts'
      - 'app/agents/autonomous-governance/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'docs/recovery-assurance-v2.md'
      - 'docs/recovery-business-impact-analysis.md'
      - 'docs/recovery-portable-backup-and-local-restore.md'
      - 'docs/recovery-full-platform-scopes.md'
      - '.github/workflows/recovery-assurance.yml'
      - '.github/workflows/repository-governance.yml'
      - 'infra/**'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      run_restore_drill:
        description: 'Run the destructive isolated recovery rehearsal (requires recovery secrets)'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

jobs:
  contract:
    name: Recovery assurance contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify repository governance after consolidation
        run: |
          node scripts/verify-github-governance.mjs
          node scripts/verify-fast-path-ci.mjs
          node scripts/verify-workflow-action-pinning.mjs
          node scripts/verify-workflow-security-posture.mjs
      - name: Verify post-implementation certification contract
        run: |
          node scripts/verify-post-implementation-certification-contract.mjs
          node --test scripts/test-post-implementation-certification-contract.mjs
      - name: Verify certification best-practice hardening profile
        run: |
          node scripts/verify-certification-best-practice-hardening-v2.mjs
          node --test scripts/test-certification-best-practice-hardening-v2.mjs
      - name: Exercise fail-closed certification decision engine
        run: node --test scripts/test-post-implementation-certification-decision.mjs
      - name: Verify platform recovery assurance
        run: pnpm run verify:recovery-assurance
      - name: Verify governance orchestrator runtime wiring
        run: node scripts/verify-governance-runtime-wiring.mjs
      - name: Verify closed-loop Execution Recovery Agent
        run: pnpm run verify:execution-recovery
      - name: Re-run deterministic orchestrator contracts
        run: |
          node --experimental-strip-types scripts/test-governance-orchestrator.mjs
          node --experimental-strip-types scripts/test-governance-outcome-report.mjs
          node --experimental-strip-types scripts/test-governance-report-export.mjs
          node --experimental-strip-types scripts/test-governance-recovery.mjs
          node --experimental-strip-types scripts/test-governance-orchestrator-approval.mjs
          node --experimental-strip-types scripts/test-governed-handoff.mjs
      - name: Run independent orchestrator adversarial concurrency and chaos audit
        run: node --experimental-strip-types scripts/audit-governance-orchestrator-final-assurance.mjs
      - name: Write independent recovery evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p recovery-evidence
          cat > recovery-evidence/contract-evidence.json <<EOF
          {
            "schemaVersion": 1,
            "kind": "RECOVERY_ASSURANCE_CONTRACT",
            "repository": "${GITHUB_REPOSITORY}",
            "commitSha": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload recovery contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-assurance-contract-${{ github.run_id }}
          path: recovery-evidence/
          retention-days: 90


  closed-loop-runtime:
    name: Closed-loop recovery database acceptance
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Reconstruct disposable Supabase and execute recovery acceptance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/execution-recovery-runtime"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          pnpm dlx supabase@2.117.0 init
          SOURCE_MIGRATION_DIR="$ROOT/supabase/migrations" TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-migration-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-agent-status-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-audit-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-jdbc-fixture-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-observability-incident-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-lineage-legacy-constraint-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-remediation-knowledge-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-governance-intelligence-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-governance-policy-boundary-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-governance-operational-policy-boundary-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-control-evidence-syntax-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-catalog-reconcile-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-membership-helper-acl-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-synthetic-suite-rollback-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-analysis-evidence-envelope-replay.mjs"
          TARGET_MIGRATION_DIR="$WORK/supabase/migrations" node "$ROOT/scripts/prepare-clean-security-definer-acl-replay.mjs"
          pnpm dlx supabase@2.117.0 start
          trap 'pnpm dlx supabase@2.117.0 stop --no-backup || true' EXIT
          pnpm dlx supabase@2.117.0 db reset --local
          eval "$(pnpm dlx supabase@2.117.0 status -o env)"
          test -n "${DB_URL:-}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$ROOT/scripts/assert-execution-recovery-runtime.sql"

  isolated-restore-drill:
    name: Isolated database recovery rehearsal
    if: github.event_name == 'workflow_dispatch' && inputs.run_restore_drill == true
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALLOW_RECOVERY_TARGET: YES_I_UNDERSTAND_THIS_REPLACES_RECOVERY_DATA
      RECOVERY_EXTERNAL_EVIDENCE_REF: github-actions://${{ github.repository }}/actions/runs/${{ github.run_id }}
      RECOVERY_COMMIT_SHA: ${{ github.sha }}
      RECOVERY_WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Run isolated recovery rehearsal
        env:
          SOURCE_DATABASE_URL: ${{ secrets.RECOVERY_SOURCE_DATABASE_URL }}
          RECOVERY_DATABASE_URL: ${{ secrets.RECOVERY_TARGET_DATABASE_URL }}
          RECOVERY_PROJECT_ID: ${{ secrets.RECOVERY_PROJECT_ID }}
        shell: bash
        run: |
          mkdir -p recovery-evidence
          set -o pipefail
          pnpm run recovery:drill | tee recovery-evidence/restore-drill.json
      - name: Upload independent recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-restore-drill-${{ github.run_id }}
          path: recovery-evidence/
          retention-days: 90
