name: Recovery Assurance

on:
  pull_request:
    paths:
      - 'scripts/recovery-drill.mjs'
      - 'scripts/recovery/**'
      - 'scripts/verify-recovery-assurance.mjs'
      - 'scripts/verify-recovery-source-authority.mjs'
      - 'scripts/verify-portable-recovery.mjs'
      - 'scripts/verify-full-platform-recovery-scopes.mjs'
      - 'scripts/verify-governance-runtime-wiring.mjs'
      - 'scripts/verify-certification-best-practice-hardening-v2.mjs'
      - 'scripts/test-certification-best-practice-hardening-v2.mjs'
      - 'scripts/evaluate-post-implementation-certification.mjs'
      - 'scripts/test-post-implementation-certification-decision.mjs'
      - 'scripts/test-governance-*.mjs'
      - 'scripts/test-governed-handoff.mjs'
      - 'scripts/audit-governance-orchestrator-final-assurance.mjs'
      - 'app/api/agents/governance-orchestrator/**'
      - 'lib/agents/runtime/governed-handoff*.ts'
      - 'lib/orchestration/governance-outcome-report*.ts'
      - 'lib/orchestration/governance-report-*.ts'
      - 'lib/orchestration/governance-recovery*.ts'
      - 'lib/orchestration/execution-recovery*.ts'
      - 'lib/orchestration/worker.ts'
      - 'lib/agents/profiling-checkpoint.ts'
      - 'lib/agents/run-profiling-job.ts'
      - 'lib/profiling/readiness-remediation-*.ts'
      - 'lib/profiling/source-readiness-repair.ts'
      - 'scripts/test-execution-recovery-*.mjs'
      - 'scripts/setup-execution-recovery-persistence-test.sql'
      - 'scripts/test-execution-recovery-persistence.sql'
      - 'scripts/setup-execution-recovery-concurrency.sql'
      - 'scripts/assert-execution-recovery-concurrency.sql'
      - 'scripts/test-profiling-checkpoint-resume.mjs'
      - 'scripts/test-profile-readiness-remediation-policy.mjs'
      - 'package.json'
      - 'lib/orchestration/governance-orchestrator-approval-service.ts'
      - 'app/agents/autonomous-governance/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'docs/recovery-assurance-v2.md'
      - 'docs/recovery-business-impact-analysis.md'
      - 'docs/recovery-portable-backup-and-local-restore.md'
      - 'docs/recovery-full-platform-scopes.md'
      - '.github/workflows/recovery-assurance.yml'
      - '.github/workflows/repository-governance.yml'
      - 'infra/**'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      run_restore_drill:
        description: 'Run the destructive isolated recovery rehearsal (requires recovery secrets)'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

jobs:
  contract:
    name: Recovery assurance contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL for isolated recovery persistence tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql
      - name: Execute isolated recovery persistence acceptance
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f scripts/setup-execution-recovery-persistence-test.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260918022000_execution_recovery_closed_loop_contract.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260918023000_execution_recovery_atomic_claim.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260918023500_execution_recovery_action_evidence.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260918025000_execution_recovery_validated_resume.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f scripts/test-execution-recovery-persistence.sql
      - name: Exercise concurrent autonomous recovery claims
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f scripts/setup-execution-recovery-concurrency.sql

          sudo -u postgres psql -At -v ON_ERROR_STOP=1 -c "select orchestration.claim_execution_recovery_auto_repair('30000000-0000-4000-8000-000000000011',0,'lease_reconcile','project-a/job-race');" > /tmp/recovery-race-a.out &
          race_a=$!
          sudo -u postgres psql -At -v ON_ERROR_STOP=1 -c "select orchestration.claim_execution_recovery_auto_repair('30000000-0000-4000-8000-000000000011',0,'lease_reconcile','project-a/job-race');" > /tmp/recovery-race-b.out &
          race_b=$!
          wait "$race_a"
          wait "$race_b"

          claimed="$(cat /tmp/recovery-race-a.out /tmp/recovery-race-b.out | grep -c '"claimed": true' || true)"
          if [ "$claimed" -ne 1 ]; then
            echo "Expected exactly one concurrent repair claim; got $claimed"
            cat /tmp/recovery-race-a.out /tmp/recovery-race-b.out
            exit 1
          fi

          sudo -u postgres psql -At -v ON_ERROR_STOP=1 -c "select orchestration.claim_execution_recovery_auto_repair('30000000-0000-4000-8000-000000000021',0,'profile_reconcile','project-a/run-a');" > /tmp/recovery-isolation-a.out &
          isolation_a=$!
          sudo -u postgres psql -At -v ON_ERROR_STOP=1 -c "select orchestration.claim_execution_recovery_auto_repair('30000000-0000-4000-8000-000000000031',0,'profile_reconcile','project-b/run-b');" > /tmp/recovery-isolation-b.out &
          isolation_b=$!
          wait "$isolation_a"
          wait "$isolation_b"

          independent="$(cat /tmp/recovery-isolation-a.out /tmp/recovery-isolation-b.out | grep -c '"claimed": true' || true)"
          if [ "$independent" -ne 2 ]; then
            echo "Expected independent concurrent cases to both claim repair; got $independent"
            cat /tmp/recovery-isolation-a.out /tmp/recovery-isolation-b.out
            exit 1
          fi

          sudo -u postgres psql -v ON_ERROR_STOP=1 -f scripts/assert-execution-recovery-concurrency.sql
      - name: Verify repository governance after consolidation
        run: |
          node scripts/verify-github-governance.mjs
          node scripts/verify-fast-path-ci.mjs
          node scripts/verify-workflow-action-pinning.mjs
          node scripts/verify-workflow-security-posture.mjs
      - name: Verify post-implementation certification contract
        run: |
          node scripts/verify-post-implementation-certification-contract.mjs
          node --test scripts/test-post-implementation-certification-contract.mjs
      - name: Verify certification best-practice hardening profile
        run: |
          node scripts/verify-certification-best-practice-hardening-v2.mjs
          node --test scripts/test-certification-best-practice-hardening-v2.mjs
      - name: Exercise fail-closed certification decision engine
        run: node --test scripts/test-post-implementation-certification-decision.mjs
      - name: Verify platform recovery assurance
        run: pnpm run verify:recovery-assurance
      - name: Verify closed-loop Execution Recovery Agent
        run: pnpm run verify:execution-recovery
      - name: Verify profiling recovery checkpoint contracts
        run: pnpm run verify:profiling-lifecycle
      - name: Verify deterministic readiness remediation
        run: pnpm run verify:remediation
      - name: Verify governance orchestrator runtime wiring
        run: node scripts/verify-governance-runtime-wiring.mjs
      - name: Re-run deterministic orchestrator contracts
        run: |
          node --experimental-strip-types scripts/test-governance-orchestrator.mjs
          node --experimental-strip-types scripts/test-governance-outcome-report.mjs
          node --experimental-strip-types scripts/test-governance-report-export.mjs
          node --experimental-strip-types scripts/test-governance-recovery.mjs
          node --experimental-strip-types scripts/test-governance-orchestrator-approval.mjs
          node --experimental-strip-types scripts/test-governed-handoff.mjs
      - name: Run independent orchestrator adversarial concurrency and chaos audit
        run: node --experimental-strip-types scripts/audit-governance-orchestrator-final-assurance.mjs
      - name: Write independent recovery evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p recovery-evidence
          cat > recovery-evidence/contract-evidence.json <<EOF
          {
            "schemaVersion": 1,
            "kind": "RECOVERY_ASSURANCE_CONTRACT",
            "repository": "${GITHUB_REPOSITORY}",
            "commitSha": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload recovery contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-assurance-contract-${{ github.run_id }}
          path: recovery-evidence/
          retention-days: 90

  isolated-restore-drill:
    name: Isolated database recovery rehearsal
    if: github.event_name == 'workflow_dispatch' && inputs.run_restore_drill == true
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALLOW_RECOVERY_TARGET: YES_I_UNDERSTAND_THIS_REPLACES_RECOVERY_DATA
      RECOVERY_EXTERNAL_EVIDENCE_REF: github-actions://${{ github.repository }}/actions/runs/${{ github.run_id }}
      RECOVERY_COMMIT_SHA: ${{ github.sha }}
      RECOVERY_WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Run isolated recovery rehearsal
        env:
          SOURCE_DATABASE_URL: ${{ secrets.RECOVERY_SOURCE_DATABASE_URL }}
          RECOVERY_DATABASE_URL: ${{ secrets.RECOVERY_TARGET_DATABASE_URL }}
          RECOVERY_PROJECT_ID: ${{ secrets.RECOVERY_PROJECT_ID }}
        shell: bash
        run: |
          mkdir -p recovery-evidence
          set -o pipefail
          pnpm run recovery:drill | tee recovery-evidence/restore-drill.json
      - name: Upload independent recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-restore-drill-${{ github.run_id }}
          path: recovery-evidence/
          retention-days: 90
