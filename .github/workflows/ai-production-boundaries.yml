name: AI Production Boundaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify universal inference and embedding boundaries
        run: node scripts/verify-ai-production-boundaries.mjs
      - name: Test task output and RAG generation evaluation behavior
        run: node --experimental-strip-types scripts/test-ai-production-boundaries.mjs
      - name: Verify governed model gateway
        run: pnpm run verify:model-gateway
      - name: Verify governed embedding provider
        run: pnpm run verify:embedding-provider
      - name: Verify governed retrieval provider
        run: pnpm run verify:retrieval-provider
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm run build
