name: Synthetic Governance Readiness Fixture

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260915130000_fix_synthetic_governance_readiness_fixture.sql'
      - 'supabase/migrations/20260915131000_reconcile_synthetic_governance_readiness_fixture.sql'
      - 'supabase/migrations/20260915185000_harden_synthetic_readiness_hash_resolution.sql'
      - 'scripts/verify-synthetic-governance-readiness-fixture.mjs'
      - 'tests/synthetic-governance-readiness-fixture.test.mjs'
      - '.github/workflows/synthetic-governance-readiness-fixture.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260915130000_fix_synthetic_governance_readiness_fixture.sql'
      - 'supabase/migrations/20260915131000_reconcile_synthetic_governance_readiness_fixture.sql'
      - 'supabase/migrations/20260915185000_harden_synthetic_readiness_hash_resolution.sql'
      - 'scripts/verify-synthetic-governance-readiness-fixture.mjs'
      - 'tests/synthetic-governance-readiness-fixture.test.mjs'
      - '.github/workflows/synthetic-governance-readiness-fixture.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Verify governed JDBC readiness fixture and reconciliation contracts
        run: node scripts/verify-synthetic-governance-readiness-fixture.mjs
      - name: Exercise readiness fixture negative cases
        run: node --test tests/synthetic-governance-readiness-fixture.test.mjs
