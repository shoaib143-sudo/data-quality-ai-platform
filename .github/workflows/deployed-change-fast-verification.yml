name: Deployed Change Fast Verification
on:
  pull_request:
    paths-ignore:
      - 'Testing/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
  pull-requests: read
concurrency:
  group: deployed-change-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fast exact-head contract verification
        run: |
          pnpm exec tsc --noEmit
          node --experimental-strip-types scripts/test-governance-orchestrator-approval.mjs
      - name: Wait for exact Vercel Preview deployment
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN secret is required}"
          : "${VERCEL_TEAM_ID:?VERCEL_TEAM_ID secret is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID secret is required}"
          deadline=$((SECONDS+600))
          while (( SECONDS < deadline )); do
            json="$(curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=100")"
            row="$(node -e 'const j=JSON.parse(process.argv[1]);const d=(j.deployments||[]).find(x=>x.meta&&x.meta.githubCommitSha===process.env.EXPECTED_SHA&&x.target!=="production");if(d)process.stdout.write(JSON.stringify({state:d.readyState||d.state,url:d.url}));' "$json")"
            if [[ -n "$row" ]]; then
              state="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).state||"")' "$row")"
              if [[ "$state" == "READY" ]]; then
                url="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).url)' "$row")"
                echo "url=https://$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              [[ "$state" != "ERROR" && "$state" != "CANCELED" ]] || exit 1
            fi
            sleep 10
          done
          exit 1
      - name: Deployed preview smoke
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$BASE_URL/" >/dev/null
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$BASE_URL/approvals" >/dev/null
