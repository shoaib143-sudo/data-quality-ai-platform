name: Derived State Rebuild

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/data-plane/derived-state-rebuild.ts'
      - 'lib/data-plane/derived-state-rebuild-runtime.ts'
      - 'app/api/operations/derived-state/rebuild/route.ts'
      - 'tests/derived-state-rebuild.test.mjs'
      - '.github/workflows/derived-state-rebuild.yml'
  push:
    branches: [main]
    paths:
      - 'lib/data-plane/derived-state-rebuild.ts'
      - 'lib/data-plane/derived-state-rebuild-runtime.ts'
      - 'app/api/operations/derived-state/rebuild/route.ts'
      - 'tests/derived-state-rebuild.test.mjs'
      - '.github/workflows/derived-state-rebuild.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Derived-state rebuild behavior
        run: node --experimental-strip-types --test tests/derived-state-rebuild.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
