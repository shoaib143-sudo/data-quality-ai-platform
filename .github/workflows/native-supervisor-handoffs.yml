name: Native Supervisor Handoffs

on:
  push:
    branches: [main]
    paths:
      - 'lib/agents/runtime/native-supervisor-service.ts'
      - 'lib/agents/governance-specialist-agent.ts'
      - 'app/api/agents/supervisor/run/route.ts'
      - 'supabase/migrations/**handoff**'
      - 'scripts/verify-native-supervisor-handoffs.mjs'
      - '.github/workflows/native-supervisor-handoffs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/agents/runtime/native-supervisor-service.ts'
      - 'lib/agents/governance-specialist-agent.ts'
      - 'app/api/agents/supervisor/run/route.ts'
      - 'supabase/migrations/**handoff**'
      - 'scripts/verify-native-supervisor-handoffs.mjs'
      - '.github/workflows/native-supervisor-handoffs.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node scripts/verify-native-supervisor-handoffs.mjs
