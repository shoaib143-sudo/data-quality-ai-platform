name: Production Verification Backbone

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'Testing/**'
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - 'infra/release-assurance/**'
      - 'lib/release-assurance/**'
      - 'supabase/migrations/20260912060000_release_assurance_evidence.sql'
      - 'scripts/verify-release-assurance-contract.mjs'
      - 'scripts/test-release-assurance-evaluator.mjs'
      - 'scripts/classify-production-preview-change.mjs'
      - 'scripts/test-production-preview-change-classifier.mjs'
      - '.github/workflows/production-verification-backbone.yml'

permissions:
  contents: read

jobs:
  deployed-change-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Classify whether the PR requires an exact Vercel Preview
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          files_file="$RUNNER_TEMP/pr-files.txt"
          : > "$files_file"
          page=1
          while :; do
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100&page=$page")"
            count="$(node -e 'const a=JSON.parse(process.argv[1]); process.stdout.write(String(a.length))' "$payload")"
            node -e 'const a=JSON.parse(process.argv[1]); for (const f of a) console.log(f.filename)' "$payload" >> "$files_file"
            [[ "$count" -eq 100 ]] || break
            page=$((page+1))
          done
          mapfile -t files < "$files_file"
          deployable="$(node scripts/classify-production-preview-change.mjs "${files[@]}")"
          required="$(node scripts/classify-production-preview-change.mjs --branch "$HEAD_REF" "${files[@]}")"
          echo "deployable=$deployable" >> "$GITHUB_OUTPUT"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [[ "$required" == "false" && "$deployable" == "true" ]]; then
            echo "Deployable files changed, but branch '$HEAD_REF' is outside the preview-enabled branch policy. GitHub build/type checks remain required; Vercel Preview is intentionally suppressed to conserve Hobby deployment capacity."
          elif [[ "$required" == "false" ]]; then
            echo "No deployable application files changed; exact Vercel Preview is not required."
          fi

      - name: Wait for exact Vercel Preview deployment through GitHub Deployments
        if: steps.classify.outputs.required == 'true'
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS+600))
          while (( SECONDS < deadline )); do
            deployments="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/deployments?sha=$EXPECTED_SHA&per_page=100")"
            found="$(node -e 'const a=JSON.parse(process.argv[1]);const d=a.find(x=>x.environment&&x.environment.toLowerCase().includes("preview"));if(d)process.stdout.write(JSON.stringify({id:d.id}));' "$deployments")"
            if [[ -n "$found" ]]; then
              id="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).id))' "$found")"
              statuses="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/deployments/$id/statuses?per_page=20")"
              state="$(node -e 'const a=JSON.parse(process.argv[1]);process.stdout.write(a[0]?.state||"")' "$statuses")"
              url="$(node -e 'const a=JSON.parse(process.argv[1]);process.stdout.write(a[0]?.environment_url||"")' "$statuses")"
              if [[ "$state" == "success" && -n "$url" ]]; then
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              [[ "$state" != "failure" && "$state" != "error" ]] || exit 1
            fi
            sleep 10
          done
          echo "Exact-SHA Vercel Preview did not become ready within 10 minutes" >&2
          exit 1

      - name: Smoke exact deployed Preview
        if: steps.classify.outputs.required == 'true'
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$BASE_URL/" >/dev/null
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$BASE_URL/approvals" >/dev/null

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release assurance contract
        run: node scripts/verify-release-assurance-contract.mjs
      - name: Unit and adversarial tests
        run: |
          node --experimental-strip-types scripts/test-release-assurance-evaluator.mjs
          node scripts/test-production-preview-change-classifier.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
