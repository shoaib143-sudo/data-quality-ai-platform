name: SQLite Chinook implementation

on:
  push:
    branches:
      - sqlite-chinook-e2e-20260907

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sqlite-chinook-e2e-20260907
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply source-observed structural lineage change set
        run: python .github/scripts/apply_sqlite_structural_lineage.py

      - name: Typecheck structural lineage change
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit verified structural lineage implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/catalog/lineage-enrichment.ts
          git diff --cached --check
          git commit -m 'Persist source-observed JDBC foreign key lineage'
          git push origin HEAD:sqlite-chinook-e2e-20260907
