          .andExpect(status().isOk()).andReturn().getResponse().getContentAsString();
      var validateJson = new com.fasterxml.jackson.databind.ObjectMapper().readTree(validateBody);
      assertEquals(1, validateJson.path("rowCount").asInt());
      assertEquals("SQLite", validateJson.path("details").path("database_product").asText());

