name: Governed DQ Verification Timeline

on:
  pull_request:
    paths:
      - 'lib/data-quality/governed-dq-verification-timeline.ts'
      - 'lib/data-quality/governed-dq-verification-timeline-service.ts'
      - 'app/api/analytics/governed-dq-verification-timeline/route.ts'
      - 'scripts/verify-governed-dq-verification-timeline.mjs'
      - '.github/workflows/governed-dq-verification-timeline.yml'
  push:
    branches: [main]
    paths:
      - 'lib/data-quality/governed-dq-verification-timeline.ts'
      - 'lib/data-quality/governed-dq-verification-timeline-service.ts'
      - 'app/api/analytics/governed-dq-verification-timeline/route.ts'
      - 'scripts/verify-governed-dq-verification-timeline.mjs'
      - '.github/workflows/governed-dq-verification-timeline.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/verify-governed-dq-verification-timeline.mjs
