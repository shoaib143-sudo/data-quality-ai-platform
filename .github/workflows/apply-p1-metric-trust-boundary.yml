name: Apply P1 Metric Trust Boundary

on:
  push:
    branches:
      - fix/p0-p4-revalidation-20260910

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply P1 metric trust-boundary patch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/p0-p4-revalidation-20260910
      - name: Apply patch
        run: node scripts/patch-p1-metric-trust-boundary.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/profiling/metric-engine.ts lib/agents/executors/profiling-executor.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(profiling): enforce trusted metric evidence at engine boundary"
          git push origin HEAD:fix/p0-p4-revalidation-20260910
