name: Runtime v2 Tool Contract Validation

on:
  pull_request:
    paths:
      - 'lib/agents/runtime/native-tool-contracts.ts'
      - 'lib/agents/executors/**'
      - 'scripts/verify-runtime-v2-tool-contract-validation.mjs'
      - '.github/workflows/runtime-v2-tool-contract-validation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/agents/runtime/native-tool-contracts.ts'
      - 'lib/agents/executors/**'
      - 'scripts/verify-runtime-v2-tool-contract-validation.mjs'
      - '.github/workflows/runtime-v2-tool-contract-validation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify Runtime v2 tool contract validation
        run: node scripts/verify-runtime-v2-tool-contract-validation.mjs
