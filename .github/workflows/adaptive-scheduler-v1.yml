name: Adaptive Scheduler v1

on:
  push:
    branches: [main]
    paths:
      - 'lib/orchestration/**'
      - 'lib/profiling/sampling.ts'
      - 'lib/profiling/metric-engine.ts'
      - 'lib/profiling/evidence-reuse.ts'
      - 'lib/profiling/file-profile.ts'
      - 'lib/agents/run-profiling-job.ts'
      - 'supabase/migrations/20260907115000_truth_aware_profile_evidence_reuse.sql'
      - 'app/api/jobs/worker/route.ts'
      - 'app/api/agents/run/route.ts'
      - 'scripts/verify-adaptive-scheduler-v1.mjs'
      - 'scripts/verify-adaptive-sampling.mjs'
      - 'scripts/verify-profile-evidence-reuse.mjs'
      - 'scripts/test-durable-pool-claim-isolation.mjs'
      - 'scripts/verify-durable-pool-claim-isolation.mjs'
      - 'scripts/audit-durable-pool-claim-adversarial.mjs'
      - 'scripts/test-outbox-lane-isolation.mjs'
      - 'scripts/verify-outbox-lane-isolation.mjs'
      - 'scripts/audit-outbox-lane-adversarial.mjs'
      - '.github/workflows/adaptive-scheduler-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/orchestration/**'
      - 'lib/profiling/sampling.ts'
      - 'lib/profiling/metric-engine.ts'
      - 'lib/profiling/evidence-reuse.ts'
      - 'lib/profiling/file-profile.ts'
      - 'lib/agents/run-profiling-job.ts'
      - 'supabase/migrations/20260907115000_truth_aware_profile_evidence_reuse.sql'
      - 'app/api/jobs/worker/route.ts'
      - 'app/api/agents/run/route.ts'
      - 'scripts/verify-adaptive-scheduler-v1.mjs'
      - 'scripts/verify-adaptive-sampling.mjs'
      - 'scripts/verify-profile-evidence-reuse.mjs'
      - 'scripts/test-durable-pool-claim-isolation.mjs'
      - 'scripts/verify-durable-pool-claim-isolation.mjs'
      - 'scripts/audit-durable-pool-claim-adversarial.mjs'
      - 'scripts/test-outbox-lane-isolation.mjs'
      - 'scripts/verify-outbox-lane-isolation.mjs'
      - 'scripts/audit-outbox-lane-adversarial.mjs'
      - '.github/workflows/adaptive-scheduler-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit test workload-pool claim isolation
        run: node --experimental-strip-types scripts/test-durable-pool-claim-isolation.mjs
      - name: Verify workload-pool claim isolation contract
        run: node scripts/verify-durable-pool-claim-isolation.mjs
      - name: Independent adversarial workload-pool audit
        run: node --experimental-strip-types scripts/audit-durable-pool-claim-adversarial.mjs
      - name: Unit and failure test outbox lane isolation
        run: node --experimental-strip-types scripts/test-outbox-lane-isolation.mjs
      - name: Verify outbox lane isolation contract
        run: node scripts/verify-outbox-lane-isolation.mjs
      - name: Independent adversarial outbox lane audit
        run: node --experimental-strip-types scripts/audit-outbox-lane-adversarial.mjs
      - run: node scripts/verify-adaptive-scheduler-v1.mjs
      - run: node scripts/verify-adaptive-sampling.mjs
      - run: node scripts/verify-profile-evidence-reuse.mjs
      - run: pnpm run build
