name: SQLite metric schemaless fix
on:
  push:
    branches:
      - sqlite-metric-schemaless-fix-20260907
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sqlite-metric-schemaless-fix-20260907
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Apply fix
        run: python .github/scripts/apply_sqlite_metric_schemaless_fix.py
      - name: Verify namespace contract
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const text = fs.readFileSync('lib/profiling/metric-engine.ts','utf8')
          if (!text.includes("jdbcEngineFromUrl(jdbcUrl) === 'SQLITE' ? null : 'public'")) throw new Error('SQLite metric namespace fallback is not schemaless')
          if (!text.includes("import { jdbcEngineFromUrl, loadJdbcRows, parseJdbcTableReference } from '@/lib/connectors/jdbc'")) throw new Error('JDBC engine resolver import missing')
          NODE
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/profiling/metric-engine.ts
          git commit -m 'Support schemaless SQLite metric execution'
          git push origin HEAD:sqlite-metric-schemaless-fix-20260907
