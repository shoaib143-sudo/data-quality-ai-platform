name: Patch duplicate metric sampling basis

on:
  push:
    branches: [fix/duplicate-metric-sampling-basis]
    paths:
      - '.github/workflows/patch-duplicate-metric-basis.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/duplicate-metric-sampling-basis
      - name: Patch duplicate metric evidence basis
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/profiling/metric-engine.ts')
          s = p.read_text()
          old = "  const duplicateRows = duplicateRowCount(rows)\n  const duplicateMetricBasis = rows.length < loaded.rowCount ? 'SAMPLE' : 'FULL_DATASET'"
          new = "  const duplicateRows = duplicateRowCount(rows)\n  const sourceAccess = 'sourceAccess' in loaded && loaded.sourceAccess && typeof loaded.sourceAccess === 'object' && !Array.isArray(loaded.sourceAccess)\n    ? loaded.sourceAccess as Record<string, unknown>\n    : {}\n  const samplingPolicy = sourceAccess.sampling_policy && typeof sourceAccess.sampling_policy === 'object' && !Array.isArray(sourceAccess.sampling_policy)\n    ? sourceAccess.sampling_policy as Record<string, unknown>\n    : {}\n  const duplicateMetricBasis = samplingPolicy.full_source_coverage_claimed === true ? 'FULL_DATASET' : 'SAMPLE'"
          if old not in s:
              raise SystemExit('Expected duplicate metric basis expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/profiling/metric-engine.ts
          git diff --cached --quiet && exit 0
          git commit -m "Use sampling coverage for duplicate metric basis"
          git push origin HEAD:fix/duplicate-metric-sampling-basis
