name: Data Governance Super Admin Cleanup

on:
  pull_request:
    paths:
      - 'app/admin/cleanup/**'
      - 'app/api/admin/cleanup/**'
      - 'app/api/datasets/create-project/**'
      - 'app/admin/layout.tsx'
      - 'app/datasets/page.tsx'
      - 'lib/auth/**'
      - 'supabase/migrations/20260914184500_data_governance_admin_super_admin.sql'
      - 'scripts/test-data-governance-super-admin-cleanup.mjs'
  push:
    branches: [main]
    paths:
      - 'app/admin/cleanup/**'
      - 'app/api/admin/cleanup/**'
      - 'lib/auth/**'
      - 'supabase/migrations/20260914184500_data_governance_admin_super_admin.sql'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-data-governance-super-admin-cleanup.mjs
      - run: pnpm build
