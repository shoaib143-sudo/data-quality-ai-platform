name: Native supervisor durable resume

on:
  pull_request:
    paths:
      - 'lib/agents/runtime/native-supervisor-resume.ts'
      - 'lib/agents/runtime/native-autonomy-runtime.ts'
      - 'supabase/migrations/20260912043000_native_supervisor_durable_resume.sql'
      - 'scripts/verify-native-supervisor-durable-resume.mjs'
      - '.github/workflows/native-supervisor-durable-resume.yml'
  push:
    branches: [main]
    paths:
      - 'lib/agents/runtime/native-supervisor-resume.ts'
      - 'lib/agents/runtime/native-autonomy-runtime.ts'
      - 'supabase/migrations/20260912043000_native_supervisor_durable_resume.sql'
      - 'scripts/verify-native-supervisor-durable-resume.mjs'
      - '.github/workflows/native-supervisor-durable-resume.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-native-supervisor-durable-resume.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
