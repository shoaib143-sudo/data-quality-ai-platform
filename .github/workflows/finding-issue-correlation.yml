name: Finding Issue Correlation

on:
  pull_request:
    paths:
      - 'app/api/issues/route.ts'
      - 'lib/governance/finding-issue-correlation.ts'
      - 'lib/governance/issue-reference-integrity.ts'
      - 'supabase/migrations/20260912031000_governance_issue_finding_identity.sql'
      - 'scripts/verify-finding-issue-correlation.mjs'
      - '.github/workflows/finding-issue-correlation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify finding issue correlation
        run: node scripts/verify-finding-issue-correlation.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
