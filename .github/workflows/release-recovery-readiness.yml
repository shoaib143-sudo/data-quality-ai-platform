name: Release Recovery Readiness

on:
  pull_request:
    paths:
      - 'lib/recovery/recovery-readiness.ts'
      - 'scripts/test-recovery-readiness.mjs'
      - 'scripts/verify-release-recovery-readiness.mjs'
      - 'infra/recovery/full-platform-recovery-contract.json'
      - 'scripts/recovery-drill.mjs'
      - '.github/workflows/release-recovery-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'lib/recovery/recovery-readiness.ts'
      - 'scripts/test-recovery-readiness.mjs'
      - 'scripts/verify-release-recovery-readiness.mjs'
      - 'infra/recovery/full-platform-recovery-contract.json'
      - 'scripts/recovery-drill.mjs'
      - '.github/workflows/release-recovery-readiness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify canonical recovery readiness contract
        run: node scripts/verify-release-recovery-readiness.mjs
      - name: Unit and failure-mode tests
        run: node --experimental-strip-types scripts/test-recovery-readiness.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
