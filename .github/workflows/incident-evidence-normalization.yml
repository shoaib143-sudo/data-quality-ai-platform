name: Incident Evidence Normalization

on:
  pull_request:
    paths:
      - 'lib/governance/governed-incident-reader.ts'
      - 'lib/governance/incident-evidence-normalization.ts'
      - 'scripts/test-incident-evidence-normalization.mjs'
      - 'scripts/verify-incident-evidence-normalization.mjs'
      - '.github/workflows/incident-evidence-normalization.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify incident evidence normalization
        run: node scripts/verify-incident-evidence-normalization.mjs
      - name: Unit test incident evidence normalization
        run: node --experimental-strip-types scripts/test-incident-evidence-normalization.mjs
      - name: Re-run governed incident lifecycle tests
        run: node --experimental-strip-types scripts/test-governed-incident-foundation.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
