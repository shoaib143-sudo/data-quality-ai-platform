name: Apply SQLite Parser Fix
on:
  push:
    branches:
      - fix/sqlite-parser-default-schema
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sqlite-parser-default-schema
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Apply fix
        run: python .github/scripts/apply_sqlite_parser_default_schema_fix.py
      - name: Verify namespace contract
        run: node scripts/verify-sqlite-metric-namespace.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/profiling/metric-engine.ts
          git commit -m 'Fix SQLite metric parser default schema'
          git push origin HEAD:fix/sqlite-parser-default-schema
