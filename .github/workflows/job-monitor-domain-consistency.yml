name: Job Monitor Domain Consistency

on:
  pull_request:
    paths:
      - 'app/monitoring/**'
      - 'app/api/monitoring/runs/route.ts'
      - 'lib/monitoring/run-window.ts'
      - 'scripts/test-job-monitor-domain-consistency.mjs'
      - '.github/workflows/job-monitor-domain-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify domain consistency contract
        run: node scripts/test-job-monitor-domain-consistency.mjs
