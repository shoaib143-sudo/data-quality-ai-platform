name: OTLP Telemetry Export

on:
  push:
    branches: [main]
    paths:
      - 'lib/ai/otlp-telemetry-exporter.ts'
      - 'lib/ai/governance-telemetry-provider.ts'
      - 'lib/observability/otlp-ingest-auth.ts'
      - 'app/api/internal/observability/otlp-auth/route.ts'
      - 'infra/otel/**'
      - 'scripts/verify-otlp-telemetry-exporter.mjs'
      - 'scripts/test-otlp-telemetry-exporter.mjs'
      - '.github/workflows/otlp-telemetry-export.yml'
  pull_request:
    paths:
      - 'lib/ai/otlp-telemetry-exporter.ts'
      - 'lib/ai/governance-telemetry-provider.ts'
      - 'lib/observability/otlp-ingest-auth.ts'
      - 'app/api/internal/observability/otlp-auth/route.ts'
      - 'infra/otel/**'
      - 'scripts/verify-otlp-telemetry-exporter.mjs'
      - 'scripts/test-otlp-telemetry-exporter.mjs'
      - '.github/workflows/otlp-telemetry-export.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-otlp-telemetry-exporter.mjs
      - run: node --experimental-strip-types scripts/test-otlp-telemetry-exporter.mjs
      - run: bash infra/otel/render-build.sh
      - run: bash infra/otel/test-runtime.sh
      - run: pnpm exec tsc --noEmit
