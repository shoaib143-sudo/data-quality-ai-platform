name: OTLP Telemetry Export

on:
  push:
    branches: [main]
    paths:
      - 'lib/ai/otlp-telemetry-exporter.ts'
      - 'lib/ai/governance-telemetry-provider.ts'
      - 'scripts/verify-otlp-telemetry-exporter.mjs'
      - 'scripts/test-otlp-telemetry-exporter.mjs'
      - '.github/workflows/otlp-telemetry-export.yml'
  pull_request:
    paths:
      - 'lib/ai/otlp-telemetry-exporter.ts'
      - 'lib/ai/governance-telemetry-provider.ts'
      - 'scripts/verify-otlp-telemetry-exporter.mjs'
      - 'scripts/test-otlp-telemetry-exporter.mjs'
      - '.github/workflows/otlp-telemetry-export.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-otlp-telemetry-exporter.mjs
      - run: node --experimental-strip-types scripts/test-otlp-telemetry-exporter.mjs
      - run: pnpm exec tsc --noEmit
