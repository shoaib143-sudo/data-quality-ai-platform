name: AI Red Team Measured Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify evidence ledger authority
        run: node scripts/verify-ai-red-team-evidence-ledger.mjs
      - name: Negative authority tests
        run: node scripts/test-ai-red-team-evidence-ledger.mjs
