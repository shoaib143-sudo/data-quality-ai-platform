name: Living Tree Job Monitor

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/monitoring/**'
      - 'app/api/monitoring/**'
      - 'lib/monitoring/**'
      - 'scripts/test-execution-monitor*.mjs'
      - 'tests/fixtures/execution-monitor/**'
      - '.github/workflows/living-tree-job-monitor.yml'
  push:
    branches: [main]
    paths:
      - 'app/monitoring/**'
      - 'app/api/monitoring/**'
      - 'lib/monitoring/**'
      - 'scripts/test-execution-monitor*.mjs'
      - 'tests/fixtures/execution-monitor/**'
      - '.github/workflows/living-tree-job-monitor.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Living Tree unit and state tests
        run: node scripts/test-execution-monitor.mjs
      - name: Monitoring API authorization and negative cases
        run: node scripts/test-execution-monitor-api.mjs
      - name: Evidence idempotency and failure cases
        run: node scripts/test-execution-monitor-evidence.mjs
      - name: Production build
        run: pnpm run build
