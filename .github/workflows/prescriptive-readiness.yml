name: Prescriptive Readiness Gate

on:
  pull_request:
    paths:
      - 'lib/ai/prescriptive-readiness.ts'
      - 'scripts/test-prescriptive-readiness.mjs'
      - 'scripts/test-prescriptive-readiness-provenance.mjs'
      - 'scripts/audit-prescriptive-readiness-adversarial.mjs'
      - '.github/workflows/prescriptive-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'lib/ai/prescriptive-readiness.ts'
      - 'scripts/test-prescriptive-readiness.mjs'
      - 'scripts/test-prescriptive-readiness-provenance.mjs'
      - 'scripts/audit-prescriptive-readiness-adversarial.mjs'
      - '.github/workflows/prescriptive-readiness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Run prescriptive readiness tests
        run: node --experimental-strip-types --test scripts/test-prescriptive-readiness.mjs scripts/test-prescriptive-readiness-provenance.mjs
      - name: Run independent prescriptive readiness adversarial audit
        run: node scripts/audit-prescriptive-readiness-adversarial.mjs
