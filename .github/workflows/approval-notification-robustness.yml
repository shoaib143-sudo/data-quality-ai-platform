name: Approval Notification Robustness

on:
  pull_request:
    paths:
      - 'lib/governance/approval-notifications.ts'
      - 'lib/governance/approval-notification-worker.ts'
      - 'supabase/migrations/20260915022000_harden_approval_notification_delivery.sql'
      - 'scripts/verify-approval-notification-robustness.mjs'
      - '.github/workflows/approval-notification-robustness.yml'
  push:
    branches: [main]
    paths:
      - 'lib/governance/approval-notifications.ts'
      - 'lib/governance/approval-notification-worker.ts'
      - 'supabase/migrations/20260915022000_harden_approval_notification_delivery.sql'
      - 'scripts/verify-approval-notification-robustness.mjs'
      - '.github/workflows/approval-notification-robustness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify approval notification robustness
        run: node scripts/verify-approval-notification-robustness.mjs
