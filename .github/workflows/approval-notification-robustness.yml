name: Approval Notification Robustness

on:
  pull_request:
    paths:
      - 'lib/governance/approval-inbox.ts'
      - 'app/approvals/approval-inbox.tsx'
      - 'tests/approval-notification-status-ux.test.mjs'
      - 'lib/governance/approval-sla.ts'
      - 'app/api/internal/governance/approval-automation/route.ts'
      - 'tests/approval-sla-automation.test.mjs'
      - 'vercel.json'
      - 'lib/governance/approval-notifications.ts'
      - 'lib/governance/approval-notification-worker.ts'
      - 'supabase/migrations/20260915022000_harden_approval_notification_delivery.sql'
      - 'scripts/verify-approval-notification-robustness.mjs'
      - '.github/workflows/approval-notification-robustness.yml'
  push:
    branches: [main]
    paths:
      - 'lib/governance/approval-inbox.ts'
      - 'app/approvals/approval-inbox.tsx'
      - 'tests/approval-notification-status-ux.test.mjs'
      - 'lib/governance/approval-sla.ts'
      - 'app/api/internal/governance/approval-automation/route.ts'
      - 'tests/approval-sla-automation.test.mjs'
      - 'vercel.json'
      - 'lib/governance/approval-notifications.ts'
      - 'lib/governance/approval-notification-worker.ts'
      - 'supabase/migrations/20260915022000_harden_approval_notification_delivery.sql'
      - 'scripts/verify-approval-notification-robustness.mjs'
      - '.github/workflows/approval-notification-robustness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify approval notification robustness
        run: node scripts/verify-approval-notification-robustness.mjs
      - name: Verify approval notification status UX
        run: node --test tests/approval-notification-status-ux.test.mjs
      - name: Verify approval SLA automation boundaries
        run: node --test tests/approval-sla-automation.test.mjs
