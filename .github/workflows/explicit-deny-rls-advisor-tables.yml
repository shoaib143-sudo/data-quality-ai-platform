name: Explicit RLS Advisor Table Hardening

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260915072214_explicit_deny_rls_no_policy_tables.sql'
      - 'supabase/migrations/20260915072330_make_explicit_deny_rls_no_policy_tables_restrictive.sql'
      - 'scripts/verify-explicit-deny-rls-advisor-tables.mjs'
      - '.github/workflows/explicit-deny-rls-advisor-tables.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260915072214_explicit_deny_rls_no_policy_tables.sql'
      - 'supabase/migrations/20260915072330_make_explicit_deny_rls_no_policy_tables_restrictive.sql'
      - 'scripts/verify-explicit-deny-rls-advisor-tables.mjs'
      - '.github/workflows/explicit-deny-rls-advisor-tables.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify explicit RLS deny contract
        run: node scripts/verify-explicit-deny-rls-advisor-tables.mjs
