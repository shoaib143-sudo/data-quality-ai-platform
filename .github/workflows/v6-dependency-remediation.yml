name: V6 Dependency Remediation

on:
  push:
    branches:
      - implementation/v6-operational-certification-final-20260910

permissions:
  contents: write

jobs:
  remediate:
    if: "github.event.head_commit.message != 'chore(security): remediate audited dependencies'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: implementation/v6-operational-certification-final-20260910
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Upgrade production framework and classify CLI dev-only
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm add next@16.3.3 --save-exact
          pnpm add -D shadcn@4.21.0
          pnpm audit --fix --prod || true
          pnpm install --lockfile-only
          pnpm audit --prod --audit-level high
      - name: Commit generated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'chore(security): remediate audited dependencies'
          git push origin HEAD:implementation/v6-operational-certification-final-20260910
