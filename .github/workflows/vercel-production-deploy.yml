name: Governed Vercel Production Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character protected main SHA to deploy
        required: true
        type: string
      confirm_deploy:
        description: Confirm this exact SHA should be deployed to Vercel Production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: datanexus-vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: exact-sha-production-deploy
    if: inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_ORG_ID: team_qVinlzIY0FqhWavLWzBd8HhT
      VERCEL_PROJECT_ID: prj_Wg1fgyXWUN99I4zlWrtlU9si6yfR
      VERCEL_SCOPE: data-nexus3
      PRODUCTION_URL: https://data-quality-ai-platform.vercel.app
      VERCEL_CLI_VERSION: 59.19.1

    steps:
      - name: Checkout exact requested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify exact current protected main identity
        id: identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$REQUESTED_SHA"
          git fetch --no-tags origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$REQUESTED_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "::error::Requested Vercel deployment SHA is not the current protected main SHA"
            echo "requested=$REQUESTED_SHA"
            echo "current_main=$CURRENT_MAIN_SHA"
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel credential is available
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || {
            echo "::error::VERCEL_TOKEN is not configured for the production deployment environment"
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          test "$(vercel --version | awk '{print $2}')" = "$VERCEL_CLI_VERSION"

      - name: Bind runner to the pinned Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull             --yes             --environment=production             --token "$VERCEL_TOKEN"             --scope "$VERCEL_SCOPE"

          node <<'NODE'
          const fs = require('node:fs')
          const link = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'))
          const expectedOrg = process.env.VERCEL_ORG_ID
          const expectedProject = process.env.VERCEL_PROJECT_ID
          if (link.orgId !== expectedOrg || link.projectId !== expectedProject) {
            console.error('Vercel project binding mismatch')
            process.exit(1)
          }
          NODE

      - name: Deploy exact SHA to Vercel Production
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXACT_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_ID="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          vercel deploy             --prod             --yes             --force             --token "$VERCEL_TOKEN"             --scope "$VERCEL_SCOPE"             --env "DATANEXUS_COMMIT_SHA=$EXACT_SHA"             --env "DATANEXUS_ENV=production"             --env "DATANEXUS_PLATFORM=vercel"             --env "DATANEXUS_RELEASE_ID=$RELEASE_ID"             --env "DATANEXUS_BUILD_TIMESTAMP=$BUILD_TIMESTAMP"             --build-env "DATANEXUS_COMMIT_SHA=$EXACT_SHA"             --build-env "DATANEXUS_ENV=production"             --build-env "DATANEXUS_PLATFORM=vercel"             --build-env "DATANEXUS_RELEASE_ID=$RELEASE_ID"             --build-env "DATANEXUS_BUILD_TIMESTAMP=$BUILD_TIMESTAMP"             2>&1 | tee /tmp/vercel-deploy.log

          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n1 | tr -d '\r')"
          test -n "$DEPLOYMENT_URL" || {
            echo "::error::Vercel CLI did not return a deployment URL"
            exit 1
          }
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify exact deployed identity
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXACT_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          BASE_URL="${DEPLOYMENT_URL%/}"
          ok=0
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --connect-timeout 5 --max-time 15               --output /tmp/build-info.json --write-out '%{http_code}'               "$BASE_URL/api/build-info" || true)"
            if [ "$code" = "200" ] && node - "$EXACT_SHA" /tmp/build-info.json <<'NODE'
          const fs = require('node:fs')
          const expected = process.argv[2]
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          if (
            body.commitSha !== expected ||
            body.environment !== 'production' ||
            body.platform !== 'vercel' ||
            typeof body.releaseId !== 'string' ||
            !body.releaseId.startsWith('github-')
          ) process.exit(1)
          NODE
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1" || {
            echo "::error::Exact deployment identity verification failed"
            exit 1
          }

      - name: Verify production alias and health contracts
        shell: bash
        env:
          EXACT_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          BASE_URL="${PRODUCTION_URL%/}"

          verify_json() {
            local path="$1"
            local output="$2"
            local attempts="${3:-12}"
            local code
            for attempt in $(seq 1 "$attempts"); do
              code="$(curl --silent --show-error --connect-timeout 5 --max-time 20                 --output "$output" --write-out '%{http_code}'                 "$BASE_URL$path" || true)"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 10
            done
            echo "::error::$path did not become HTTP 200"
            cat "$output" 2>/dev/null || true
            return 1
          }

          verify_json "/api/build-info" /tmp/production-build.json
          node - "$EXACT_SHA" /tmp/production-build.json <<'NODE'
          const fs = require('node:fs')
          const expected = process.argv[2]
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          if (body.commitSha !== expected || body.environment !== 'production' || body.platform !== 'vercel') process.exit(1)
          NODE

          verify_json "/api/health/live" /tmp/production-live.json
          node - /tmp/production-live.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'ALIVE') process.exit(1)
          NODE

          verify_json "/api/health/supabase" /tmp/production-supabase.json
          node - /tmp/production-supabase.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY' || body.provider !== 'supabase' || body.boundary !== 'public-data-api') process.exit(1)
          NODE

          verify_json "/api/health/release-schema" /tmp/production-release-schema.json
          node - /tmp/production-release-schema.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY' || body.contract !== 'cloudflare-supabase-release-v1') process.exit(1)
          if (!body.checks || Object.values(body.checks).some((check) => check?.status !== 'READY')) process.exit(1)
          NODE

          verify_json "/api/health/ready" /tmp/production-ready.json 18
          node - /tmp/production-ready.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY') process.exit(1)
          NODE

      - name: Record release summary
        shell: bash
        env:
          EXACT_SHA: ${{ steps.identity.outputs.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Vercel production release"
            echo ""
            echo "- Exact SHA: `$EXACT_SHA`"
            echo "- Deployment URL: `$DEPLOYMENT_URL`"
            echo "- Production URL: `$PRODUCTION_URL`"
            echo "- Build identity: PASS"
            echo "- Liveness: PASS"
            echo "- Supabase public Data API: PASS"
            echo "- Release schema: PASS"
            echo "- Full readiness: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
