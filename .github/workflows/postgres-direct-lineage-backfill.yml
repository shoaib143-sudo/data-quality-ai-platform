name: PostgreSQL Direct Lineage Backfill

on:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill-postgres-direct-lineage.ts'
      - 'lib/catalog/lineage-enrichment.ts'
      - 'lib/connectors/jdbc.ts'
      - 'supabase/functions/dgp-postgres-connector/**'
      - 'supabase/functions/_shared/postgres-view-column-lineage.ts'
      - '.github/workflows/postgres-direct-lineage-backfill.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backfill-postgres-direct-lineage.ts'
      - 'lib/catalog/lineage-enrichment.ts'
      - 'lib/connectors/jdbc.ts'
      - 'supabase/functions/dgp-postgres-connector/**'
      - 'supabase/functions/_shared/postgres-view-column-lineage.ts'
      - '.github/workflows/postgres-direct-lineage-backfill.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: PostgreSQL direct field-lineage parser
        run: node --experimental-strip-types --test scripts/test-postgres-view-column-lineage.mjs
      - name: PostgreSQL connector authorization boundary
        run: node --test tests/postgres-connector-service-role-boundary.test.mjs

  live-backfill:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Re-enrich PostgreSQL field lineage from published discovery evidence
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POSTGRES_DIRECT_LINEAGE_BACKFILL_REQUIRED: 'true'
        run: pnpm dlx tsx@4.20.6 scripts/backfill-postgres-direct-lineage.ts
