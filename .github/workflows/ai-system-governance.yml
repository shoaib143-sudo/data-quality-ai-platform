name: AI System Governance

on:
  push:
    branches: [main, govern-ai-systems]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-ai-system-governance.mjs'
      - '.github/workflows/ai-system-governance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-ai-system-governance.mjs'
      - '.github/workflows/ai-system-governance.yml'

permissions:
  contents: read

jobs:
  module15-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify AI system governance authority and immutable evidence
        run: node scripts/verify-ai-system-governance.mjs
