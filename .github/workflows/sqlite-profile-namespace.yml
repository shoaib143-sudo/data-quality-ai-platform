name: SQLite profiling namespace patch

on:
  push:
    branches:
      - sqlite-chinook-e2e-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sqlite-chinook-e2e-20260907
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Apply SQLite profiling namespace patch
        run: python .github/scripts/apply_sqlite_profile_namespace.py
      - name: Verify TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
      - name: Commit verified profiling patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/connectors/jdbc.ts lib/profiling/jdbc-profile.ts
          git diff --cached --check
          git commit -m 'Support schemaless SQLite profiling'
          git push origin HEAD:sqlite-chinook-e2e-20260907
