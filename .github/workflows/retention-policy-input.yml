name: Retention Policy Input Contract

on:
  pull_request:
    paths:
      - 'lib/governance/retention-policy-input.ts'
      - 'app/api/retention/[projectId]/route.ts'
      - 'tests/retention-policy-input.test.mjs'
      - '.github/workflows/retention-policy-input.yml'
  push:
    branches: [main]
    paths:
      - 'lib/governance/retention-policy-input.ts'
      - 'app/api/retention/[projectId]/route.ts'
      - 'tests/retention-policy-input.test.mjs'
      - '.github/workflows/retention-policy-input.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --experimental-strip-types --test tests/retention-policy-input.test.mjs
