name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fast-path pull request gate
        if: github.event_name == 'pull_request'
        run: bash scripts/ci-fast-path.sh
      - name: Full post-merge quality certification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/ci-full-quality-gate.sh
      - name: Production HTTP SLO smoke benchmark
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BENCHMARK_REQUESTS: '25'
          BENCHMARK_CONCURRENCY: '5'
          BENCHMARK_PATH: '/login'
          BENCHMARK_MAX_P95_MS: '2500'
          BENCHMARK_MAX_P99_MS: '4000'
          BENCHMARK_MAX_ERROR_RATE: '0'
          BENCHMARK_MIN_SUCCESSFUL_REQUESTS: '25'
        run: pnpm run benchmark:production
      - name: Setup Java
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate JDBC bridge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: services/jdbc-bridge
        run: mvn -B test package
