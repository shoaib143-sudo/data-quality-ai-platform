name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify data plane provider configuration
        run: pnpm run verify:data-plane-config
      - name: Verify data plane projection operations
        run: pnpm run verify:data-plane-operations
      - name: Verify governed agent portfolio
        run: pnpm run verify:agent-portfolio
      - name: Verify governed agent specialization
        run: pnpm run verify:agent-specialization
      - name: Verify specialist governance intelligence consumption
        run: node scripts/verify-specialist-governance-intelligence.mjs
      - name: Verify agent memory and learning
        run: pnpm run verify:agent-memory-learning
      - name: Verify investigation and prediction
        run: pnpm run verify:investigation-prediction
      - name: Verify governed autonomy safety
        run: pnpm run verify:governed-autonomy
      - name: Verify AI governance due diligence contracts
        run: pnpm run verify:ai-due-diligence
      - name: Verify AI system governance lifecycle authority
        run: node scripts/verify-ai-system-governance.mjs
      - name: Verify evidence backed 75 capability matrix
        run: node scripts/verify-ai-capability-matrix.mjs
      - name: Verify governance document semantic refresh
        run: node scripts/verify-governance-document-semantic-refresh.mjs
      - name: Verify governance reference corpus and embedding readiness
        run: node scripts/verify-governance-reference-readiness.mjs
      - name: Verify governed human review boundaries
        run: pnpm run verify:governance-reviews
      - name: Verify governance control intelligence
        run: pnpm run verify:control-intelligence
      - name: Verify governance control operability
        run: node scripts/verify-governance-control-operability.mjs
      - name: Verify governance intelligence brief truth contract
        run: node scripts/verify-governance-intelligence-brief.mjs
      - name: Verify production readiness contracts
        run: pnpm run verify:readiness
      - name: Verify provider read fallback behavior
        run: pnpm run verify:provider-fallback
      - name: Verify governance knowledge model
        run: pnpm run verify:knowledge-model
      - name: Verify quality intelligence
        run: pnpm run verify:quality-intelligence
      - name: Verify FILE onboarding contracts
        run: pnpm run verify:file-onboarding
      - name: Verify provider-native database hierarchy
        run: node scripts/verify-native-hierarchy-connectors.mjs
      - name: Verify catalog identity, versioning and change detection
        run: node scripts/verify-catalog-identity-versioning.mjs
      - name: Verify Generic JDBC production acceptance contract
        run: node scripts/verify-generic-jdbc-acceptance.mjs
      - name: Verify Supabase security advisor hardening contract
        run: node scripts/verify-security-advisor-hardening.mjs
      - name: Verify Databricks Web UI connection flow
        run: node scripts/verify-databricks-web-ui-flow.mjs
      - name: Verify Databricks multiple schema scope
        run: node --experimental-strip-types scripts/test-databricks-schema-scope.mjs
      - name: Verify profiling lifecycle contracts
        run: pnpm run verify:profiling-lifecycle
      - name: Verify profiling explorer evidence contracts
        run: pnpm run verify:profiling-explorer
      - name: Verify governance architecture contracts
        run: pnpm run verify:governance
      - name: Verify semantic governance contracts
        run: pnpm run verify:semantic
      - name: Verify governed business glossary semantics
        run: node scripts/verify-business-glossary-semantics.mjs
      - name: Verify governed ownership and stewardship
        run: node scripts/verify-ownership-stewardship.mjs
      - name: Verify governed classification and privacy
        run: node scripts/verify-classification-privacy.mjs
      - name: Verify profiling remediation contracts
        run: pnpm run verify:remediation
      - name: Verify profiling recommendation learning contracts
        run: pnpm run verify:learning
      - name: Verify automatic remediation reprofile contracts
        run: pnpm run verify:reprofile
      - name: Verify autonomous governance operations contracts
        run: pnpm run verify:autonomous
      - name: Verify lineage change governance contracts
        run: pnpm run verify:lineage-governance
      - name: Verify atomic lineage ingestion
        run: node scripts/verify-lineage-atomic-ingestion.mjs
      - name: Verify lineage scoped extraction and catalog identity
        run: node scripts/verify-lineage-source-identity.mjs
      - name: Verify governed manual lineage writes
        run: node scripts/verify-lineage-manual-write-boundary.mjs
      - name: Verify lineage explorer overlay contracts
        run: pnpm run verify:lineage-explorer
      - name: Verify live governance database contracts
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: pnpm run verify:database
      - name: Production build
        run: pnpm run build
      - name: Production HTTP SLO smoke benchmark
        env:
          BENCHMARK_REQUESTS: '25'
          BENCHMARK_CONCURRENCY: '5'
          BENCHMARK_PATH: '/login'
          BENCHMARK_MAX_P95_MS: '2500'
          BENCHMARK_MAX_P99_MS: '4000'
          BENCHMARK_MAX_ERROR_RATE: '0'
          BENCHMARK_MIN_SUCCESSFUL_REQUESTS: '25'
        run: pnpm run benchmark:production
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate JDBC bridge
        working-directory: services/jdbc-bridge
        run: mvn -B test package
