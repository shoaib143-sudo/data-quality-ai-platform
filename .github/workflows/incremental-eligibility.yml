name: Incremental Eligibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/orchestration/incremental-eligibility.ts'
      - 'lib/orchestration/adaptive-dispatch.ts'
      - 'scripts/verify-incremental-eligibility.mjs'
      - '.github/workflows/incremental-eligibility.yml'
  push:
    branches: [main]
    paths:
      - 'lib/orchestration/incremental-eligibility.ts'
      - 'lib/orchestration/adaptive-dispatch.ts'
      - 'scripts/verify-incremental-eligibility.mjs'
      - '.github/workflows/incremental-eligibility.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-incremental-eligibility.mjs
      - run: pnpm run build
