name: Incremental Eligibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/orchestration/incremental-eligibility.ts'
      - 'lib/orchestration/adaptive-dispatch.ts'
      - 'scripts/verify-incremental-eligibility.mjs'
      - '.github/workflows/incremental-eligibility.yml'
  push:
    branches: [main]
    paths:
      - 'lib/orchestration/incremental-eligibility.ts'
      - 'lib/orchestration/adaptive-dispatch.ts'
      - 'scripts/verify-incremental-eligibility.mjs'
      - '.github/workflows/incremental-eligibility.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-incremental-eligibility.mjs
      - run: pnpm run build
