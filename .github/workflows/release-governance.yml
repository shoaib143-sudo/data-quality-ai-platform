name: Release Governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Governed release operation
        required: true
        type: choice
        default: verify
        options:
          - verify
          - cloudflare-canary-preflight
          - cloudflare-worker-preflight
          - cloudflare-worker-canary-readiness
          - cloudflare-canary-deploy
          - cloudflare-worker-deploy
          - cloudflare-worker-canary-enable
          - cloudflare-worker-canary-disable
          - vercel-production-deploy
          - vercel-production-certify
      commit_sha:
        description: Exact 40-character Git commit SHA already validated by GitHub CI
        required: false
        type: string
      confirm_paid_activation:
        description: Confirm explicit owner approval for Workers Paid activation/deployment
        required: false
        default: false
        type: boolean
      confirm_worker_execution:
        description: Confirm explicit owner approval for narrow Cloudflare OBSERVABILITY execution
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  release-governance:
    name: release-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify governance files
        run: |
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f docs/release-governance.md

      - name: Enforce forward-only released migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          violations="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'supabase/migrations/*.sql' | awk '$1 != "A" {print}')"
          if [ -n "$violations" ]; then
            echo "Released Supabase migrations are immutable. Add a new forward migration instead of modifying, deleting, or renaming an existing migration."
            echo "$violations"
            exit 1
          fi

      - name: Verify protected release policy contract
        run: |
          grep -q '^# Release Governance' docs/release-governance.md
          grep -q 'Release Governance / release-governance' docs/release-governance.md
          grep -q 'Quality Gate / build' docs/release-governance.md
          grep -q 'CodeQL Security / analyze' docs/release-governance.md
          grep -q 'P0-P5 Revalidation / revalidate' docs/release-governance.md
          grep -q 'V6 Operational Certification / certify' docs/release-governance.md
          node --test tests/release-schema-live-contract.test.mjs


  certify-cloudflare-container:
    name: cloudflare-container-certification
    if: github.event_name == 'pull_request'
    needs: release-governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare runtime contracts
        run: |
          set -euo pipefail
          pnpm run verify:provider-neutral-runtime
          pnpm run verify:container-runtime
          pnpm run verify:worker-runtime
          pnpm exec tsc --noEmit
          pnpm build

      - name: Build governed container image
        run: |
          set -euo pipefail
          node scripts/build-cloudflare-container.mjs \
            --config infra/cloudflare/runtime/wrangler.jsonc \
            --tag "datanexus-cloudflare-ci:${GITHUB_SHA}"

      - name: Smoke-test standalone container
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker run --detach \
            --name datanexus-cloudflare-ci \
            --publish 127.0.0.1:3000:3000 \
            --env DATANEXUS_ENV=canary \
            --env DATANEXUS_PLATFORM=cloudflare \
            --env DATANEXUS_COMMIT_SHA="$GITHUB_SHA" \
            --env DATANEXUS_RELEASE_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --env DATANEXUS_BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            "datanexus-cloudflare-ci:${GITHUB_SHA}"
          trap 'docker logs datanexus-cloudflare-ci >/tmp/datanexus-cloudflare-ci.log 2>&1 || true; docker rm --force datanexus-cloudflare-ci >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if ! docker inspect --format '{{.State.Running}}' datanexus-cloudflare-ci 2>/dev/null | grep -qx true; then
              echo "::error::DataNexus container exited before readiness"
              docker logs datanexus-cloudflare-ci || true
              exit 1
            fi

            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                http://127.0.0.1:3000/api/health/live >/tmp/cloudflare-live.json 2>/tmp/cloudflare-live.err \
              && curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                http://127.0.0.1:3000/api/build-info >/tmp/cloudflare-build.json 2>/tmp/cloudflare-build.err \
              && node - "$GITHUB_SHA" /tmp/cloudflare-build.json <<'NODE'
          const fs = require('node:fs')
          const expected = process.argv[2]
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          if (body.commitSha !== expected || body.environment !== 'canary' || body.platform !== 'cloudflare') process.exit(1)
          NODE
            then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::DataNexus container did not become healthy with valid build identity"
            cat /tmp/cloudflare-live.err 2>/dev/null || true
            cat /tmp/cloudflare-build.err 2>/dev/null || true
            docker logs datanexus-cloudflare-ci || true
            exit 1
          fi


      - name: Validate Wrangler canary and worker bundles without deployment
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-tooling.mjs
          "$RUNNER_TEMP/datanexus-cloudflare-tools/node_modules/.bin/wrangler" deploy --dry-run \
            --config infra/cloudflare/runtime/wrangler.jsonc \
            --outdir /tmp/datanexus-canary-dry-run
          "$RUNNER_TEMP/datanexus-cloudflare-tools/node_modules/.bin/wrangler" deploy --dry-run \
            --config infra/cloudflare/worker-runtime/wrangler.jsonc \
            --outdir /tmp/datanexus-worker-dry-run



  preflight-cloudflare-canary:
    name: cloudflare-canary-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cloudflare-canary-preflight'
    needs: release-governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify immutable candidate identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main || {
            echo "::error::Cloudflare candidate SHA is not reachable from protected main"
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify canary repository and container readiness without deployment
        run: |
          set -euo pipefail
          pnpm run verify:provider-neutral-runtime
          pnpm run verify:container-runtime
          pnpm exec tsc --noEmit
          pnpm build
          node scripts/build-cloudflare-container.mjs \
            --config infra/cloudflare/runtime/wrangler.jsonc \
            --tag "datanexus-canary-preflight:${{ inputs.commit_sha }}"


      - name: Validate canary Wrangler bundle without deployment
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-tooling.mjs
          "$RUNNER_TEMP/datanexus-cloudflare-tools/node_modules/.bin/wrangler" deploy --dry-run \
            --config infra/cloudflare/runtime/wrangler.jsonc \
            --outdir /tmp/datanexus-canary-preflight

  preflight-cloudflare-worker:
    name: cloudflare-worker-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cloudflare-worker-preflight'
    needs: release-governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify immutable candidate identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main || {
            echo "::error::Cloudflare candidate SHA is not reachable from protected main"
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify worker repository and container readiness without deployment
        run: |
          set -euo pipefail
          pnpm run verify:provider-neutral-runtime
          pnpm run verify:worker-runtime
          pnpm exec tsc --noEmit
          pnpm build
          node scripts/build-cloudflare-container.mjs \
            --config infra/cloudflare/worker-runtime/wrangler.jsonc \
            --tag "datanexus-worker-preflight:${{ inputs.commit_sha }}"


      - name: Validate worker Wrangler bundle without deployment
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-tooling.mjs
          "$RUNNER_TEMP/datanexus-cloudflare-tools/node_modules/.bin/wrangler" deploy --dry-run \
            --config infra/cloudflare/worker-runtime/wrangler.jsonc \
            --outdir /tmp/datanexus-worker-preflight

  deploy-cloudflare-canary:
    name: cloudflare-canary-deploy
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cloudflare-canary-deploy' && inputs.confirm_paid_activation == true
    needs: release-governance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-canary
    permissions:
      contents: read
    steps:
      - name: Checkout exact certified SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify immutable release identity
        id: identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$REQUESTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main || {
            echo "::error::Cloudflare release SHA is not reachable from protected main"
            exit 1
          }
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Revalidate canary and container contracts
        run: |
          set -euo pipefail
          pnpm run verify:provider-neutral-runtime
          pnpm run verify:container-runtime
          pnpm exec tsc --noEmit
          pnpm build

      - name: Build standalone container locally
        env:
          EXACT_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          node scripts/build-cloudflare-container.mjs \
            --config infra/cloudflare/runtime/wrangler.jsonc \
            --tag "datanexus-canary:$EXACT_SHA"

      - name: Verify primary Vercel release and Supabase schema parity
        env:
          DATANEXUS_VERCEL_PRODUCTION_URL: https://data-quality-ai-platform.vercel.app
          EXACT_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          set -euo pipefail
          BASE_URL="${DATANEXUS_VERCEL_PRODUCTION_URL%/}"

          build_code="$(curl --silent --show-error --output /tmp/vercel-primary-build.json --write-out '%{http_code}' "$BASE_URL/api/build-info")"
          test "$build_code" = "200"
          node - "$EXACT_SHA" /tmp/vercel-primary-build.json <<'NODE'
          const fs = require('node:fs')
          const expected = process.argv[2]
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          if (body.commitSha !== expected || body.environment !== 'production' || body.platform !== 'vercel') process.exit(1)
          NODE

          schema_code="$(curl --silent --show-error --output /tmp/vercel-release-schema.json --write-out '%{http_code}' "$BASE_URL/api/health/release-schema")"
          test "$schema_code" = "200"
          node - /tmp/vercel-release-schema.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY' || body.contract !== 'cloudflare-supabase-release-v1') process.exit(1)
          if (!body.checks || Object.values(body.checks).some((check) => check?.status !== 'READY')) process.exit(1)
          NODE

      - name: Deploy exact-SHA Cloudflare canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          DATANEXUS_CLOUDFLARE_CANARY_URL: ${{ vars.DATANEXUS_CLOUDFLARE_CANARY_URL }}
          EXACT_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-tooling.mjs
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$DATANEXUS_CLOUDFLARE_CANARY_URL"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_ID="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/datanexus-cloudflare-tools/node_modules/.bin/wrangler" deploy --config infra/cloudflare/runtime/wrangler.jsonc \
            --var "DATANEXUS_ENV:canary" \
            --var "DATANEXUS_PLATFORM:cloudflare" \
            --var "DATANEXUS_COMMIT_SHA:$EXACT_SHA" \
            --var "DATANEXUS_RELEASE_ID:$RELEASE_ID" \
            --var "DATANEXUS_BUILD_TIMESTAMP:$BUILD_TIMESTAMP" \
            --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" \
            --var "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

      - name: Verify deployed canary exact SHA and fail-closed mutation boundary
        env:
          DATANEXUS_CLOUDFLARE_CANARY_URL: ${{ vars.DATANEXUS_CLOUDFLARE_CANARY_URL }}
          EXACT_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          set -euo pipefail
          BASE_URL="${DATANEXUS_CLOUDFLARE_CANARY_URL%/}"
          live_code="$(curl --silent --show-error --output /tmp/canary-live.json --write-out '%{http_code}' "$BASE_URL/api/health/live")"
          test "$live_code" = "200"
          build_code="$(curl --silent --show-error --output /tmp/canary-build.json --write-out '%{http_code}' "$BASE_URL/api/build-info")"
          test "$build_code" = "200"
          node - "$EXACT_SHA" /tmp/canary-build.json <<'NODE'
          const fs = require('node:fs')
          const expected = process.argv[2]
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          if (body.commitSha !== expected || body.environment !== 'canary' || body.platform !== 'cloudflare') process.exit(1)
          NODE
          supabase_code="$(curl --silent --show-error --output /tmp/canary-supabase.json --write-out '%{http_code}' "$BASE_URL/api/health/supabase")"
          test "$supabase_code" = "200"
          node - /tmp/canary-supabase.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY' || body.provider !== 'supabase' || body.boundary !== 'public-data-api') process.exit(1)
          NODE
          mutation_code="$(curl --silent --show-error --output /tmp/canary-mutation.json --write-out '%{http_code}' -X POST "$BASE_URL/api/internal/governance/approval-automation")"
          test "$mutation_code" = "403"


  deploy-cloudflare-worker:
    name: cloudflare-worker-deploy
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cloudflare-worker-deploy' && inputs.confirm_paid_activation == true
    needs: release-governance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-worker
    permissions:
      contents: read
    steps:
      - name: Checkout exact certified SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify immutable worker release identity
        id: identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$REQUESTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main || {
            echo "::error::Cloudflare release SHA is not reachable from protected main"
            exit 1
          }
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Revalidate worker runtime contracts
        run: |
          set -euo pipefail
          pnpm run verify:provider-neutral-runtime
          pnpm run verify:worker-runtime
          pnpm exec tsc --noEmit
          pnpm build

      - name: Build worker container locally
        env:
          EXACT_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          node scripts/build-cloudflare-container.mjs \
            --config infra/cloudflare/worker-runtime/wrangler.jsonc \
            --tag "datanexus-worker:$EXACT_SHA"


      - name: Deploy disabled exact-SHA worker runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATANEXUS_CLOUDFLARE_WORKER_URL: ${{ vars.DATANEXUS_CLOUDFLARE_WORKER_URL }}
          EXACT_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-tooling.mjs
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DATANEXUS_CLOUDFLARE_WORKER_URL"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_ID="github-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/datanexus-cloudflare-tools/node_modules/.bin/wrangler" deploy --config infra/cloudflare/worker-runtime/wrangler.jsonc \
            --var "DATANEXUS_ENV:canary" \
            --var "DATANEXUS_PLATFORM:cloudflare" \
            --var "DATANEXUS_WORKER_EXECUTION_ENABLED:false" \
            --var "DATANEXUS_COMMIT_SHA:$EXACT_SHA" \
            --var "DATANEXUS_RELEASE_ID:$RELEASE_ID" \
            --var "DATANEXUS_BUILD_TIMESTAMP:$BUILD_TIMESTAMP"


      - name: Verify deployed worker exact SHA and disabled execution boundary
        env:
          DATANEXUS_CLOUDFLARE_WORKER_URL: ${{ vars.DATANEXUS_CLOUDFLARE_WORKER_URL }}
          EXACT_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          set -euo pipefail
          BASE_URL="${DATANEXUS_CLOUDFLARE_WORKER_URL%/}"
          ready=0
          for attempt in $(seq 1 30); do
            live_code="$(curl --silent --show-error --output /tmp/worker-live.json --write-out '%{http_code}' "$BASE_URL/api/health/live" || true)"
            build_code="$(curl --silent --show-error --output /tmp/worker-build.json --write-out '%{http_code}' "$BASE_URL/api/build-info" || true)"
            if [ "$live_code" = "200" ] && [ "$build_code" = "200" ] && node -e "const fs=require('node:fs'); const expected=process.argv[1]; const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); if(body.commitSha!==expected||body.environment!=='canary'||body.platform!=='cloudflare') process.exit(1)" "$EXACT_SHA" /tmp/worker-build.json
            then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          disabled_code="$(curl --silent --show-error --output /tmp/worker-disabled.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"mode":"ADAPTIVE_DISPATCH"}' "$BASE_URL/api/jobs/worker")"
          test "$disabled_code" = "503"

  verify-cloudflare-worker-canary-readiness:
    name: cloudflare-worker-canary-readiness
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cloudflare-worker-canary-readiness'
    needs: release-governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-worker
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify immutable candidate identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main || {
            echo "::error::Cloudflare worker canary readiness SHA is not reachable from protected main"
            exit 1
          }

      - name: Verify activation prerequisites without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATANEXUS_WORKER_SECRET: ${{ secrets.DATANEXUS_WORKER_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATANEXUS_CLOUDFLARE_WORKER_URL: ${{ vars.DATANEXUS_CLOUDFLARE_WORKER_URL }}
          SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "${DATANEXUS_WORKER_SECRET:-}" ] || missing+=("DATANEXUS_WORKER_SECRET")
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -n "${DATANEXUS_CLOUDFLARE_WORKER_URL:-}" ] || missing+=("DATANEXUS_CLOUDFLARE_WORKER_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing protected cloudflare-worker environment input: %s\n' "${missing[@]}"
            exit 1
          fi
          printf '%s' "$DATANEXUS_CLOUDFLARE_WORKER_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$' || {
            echo "::error::DATANEXUS_CLOUDFLARE_WORKER_URL must be the HTTPS worker origin with no path"
            exit 1
          }
          SUPABASE_AUTH_ARGS=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          if [[ "$SUPABASE_SERVICE_ROLE_KEY" == *.*.* ]]; then
            SUPABASE_AUTH_ARGS+=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_cloudflare_observability_canary_release_status" \
            "${SUPABASE_AUTH_ARGS[@]}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --output /tmp/canary-readiness-status.json
          node -e "const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('/tmp/canary-readiness-status.json','utf8')); if(body.enabled!==false||body.cron_active!==true||body.cron_schedule!=='*/5 * * * *'||body.allowed_job_type!=='OBSERVABILITY'||body.scheduler_authority!=='Supabase'||body.single_flight_limit!==1) process.exit(1)"

  enable-cloudflare-worker-canary:
    name: cloudflare-worker-canary-enable
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cloudflare-worker-canary-enable' && inputs.confirm_paid_activation == true && inputs.confirm_worker_execution == true
    needs: release-governance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-worker
    permissions:
      contents: read
    steps:
      - name: Checkout exact certified SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify immutable worker release identity
        id: identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$REQUESTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main || {
            echo "::error::Cloudflare worker canary SHA is not reachable from protected main"
            exit 1
          }
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Revalidate narrow worker execution contracts
        run: |
          set -euo pipefail
          pnpm run verify:provider-neutral-runtime
          pnpm run verify:worker-runtime
          pnpm exec tsc --noEmit
          pnpm build

      - name: Configure privileged worker secrets and disabled Supabase canary state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATANEXUS_WORKER_SECRET: ${{ secrets.DATANEXUS_WORKER_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
          DATANEXUS_CLOUDFLARE_WORKER_URL: ${{ vars.DATANEXUS_CLOUDFLARE_WORKER_URL }}
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-tooling.mjs
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DATANEXUS_WORKER_SECRET"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_URL"
          test -n "$DATANEXUS_CLOUDFLARE_WORKER_URL"
          printf '%s' "$DATANEXUS_WORKER_SECRET" | "$RUNNER_TEMP/datanexus-cloudflare-tools/node_modules/.bin/wrangler" secret put DATANEXUS_WORKER_SECRET --config infra/cloudflare/worker-runtime/wrangler.jsonc
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | "$RUNNER_TEMP/datanexus-cloudflare-tools/node_modules/.bin/wrangler" secret put SUPABASE_SERVICE_ROLE_KEY --config infra/cloudflare/worker-runtime/wrangler.jsonc
          SUPABASE_AUTH_ARGS=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          if [[ "$SUPABASE_SERVICE_ROLE_KEY" == *.*.* ]]; then
            SUPABASE_AUTH_ARGS+=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/rpc/configure_cloudflare_observability_canary_release" \
            "${SUPABASE_AUTH_ARGS[@]}" \
            -H "Content-Type: application/json" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({p_worker_url:process.argv[1],p_worker_secret:process.argv[2],p_enabled:false}))' "${DATANEXUS_CLOUDFLARE_WORKER_URL%/}/api/jobs/worker" "$DATANEXUS_WORKER_SECRET")"

      - name: Deploy observability-only worker canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATANEXUS_CLOUDFLARE_WORKER_URL: ${{ vars.DATANEXUS_CLOUDFLARE_WORKER_URL }}
          EXACT_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-tooling.mjs
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DATANEXUS_CLOUDFLARE_WORKER_URL"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_ID="github-worker-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/datanexus-cloudflare-tools/node_modules/.bin/wrangler" deploy --config infra/cloudflare/worker-runtime/wrangler.jsonc \
            --var "DATANEXUS_ENV:canary" \
            --var "DATANEXUS_PLATFORM:cloudflare" \
            --var "DATANEXUS_WORKER_EXECUTION_ENABLED:true" \
            --var "DATANEXUS_WORKER_CANARY_JOB_TYPE:OBSERVABILITY" \
            --var "DATANEXUS_COMMIT_SHA:$EXACT_SHA" \
            --var "DATANEXUS_RELEASE_ID:$RELEASE_ID" \
            --var "DATANEXUS_BUILD_TIMESTAMP:$BUILD_TIMESTAMP"

      - name: Verify exact SHA and narrow execution boundary
        env:
          DATANEXUS_CLOUDFLARE_WORKER_URL: ${{ vars.DATANEXUS_CLOUDFLARE_WORKER_URL }}
          DATANEXUS_WORKER_SECRET: ${{ secrets.DATANEXUS_WORKER_SECRET }}
          EXACT_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          set -euo pipefail
          BASE_URL="${DATANEXUS_CLOUDFLARE_WORKER_URL%/}"
          ready=0
          for attempt in $(seq 1 30); do
            live_code="$(curl --silent --show-error --output /tmp/worker-live.json --write-out '%{http_code}' "$BASE_URL/api/health/live" || true)"
            build_code="$(curl --silent --show-error --output /tmp/worker-build.json --write-out '%{http_code}' "$BASE_URL/api/build-info" || true)"
            if [ "$live_code" = "200" ] && [ "$build_code" = "200" ] && node -e "const fs=require('node:fs'); const expected=process.argv[1]; const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); if(body.commitSha!==expected||body.environment!=='canary'||body.platform!=='cloudflare') process.exit(1)" "$EXACT_SHA" /tmp/worker-build.json
            then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"

          summarize_boundary_response() {
            local label="$1"
            local file="$2"
            node -e "const fs=require('node:fs'); const label=process.argv[1]; const file=process.argv[2]; let body={}; try { body=JSON.parse(fs.readFileSync(file,'utf8')) } catch {} const allowed={}; for (const key of ['error','status','environment','accepted','mode','jobType','claimed']) if (Object.prototype.hasOwnProperty.call(body,key)) allowed[key]=body[key]; console.error(label + ': ' + JSON.stringify(allowed))" "$label" "$file"
          }

          unauthorized_code="$(curl --silent --show-error --output /tmp/worker-unauthorized.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"mode":"CLOUDFLARE_OBSERVABILITY_CANARY"}' "$BASE_URL/api/jobs/worker")"
          if [ "$unauthorized_code" != "403" ]; then
            echo "::error::Unauthorized canary boundary returned HTTP $unauthorized_code, expected 403"
            summarize_boundary_response "unauthorized canary response" /tmp/worker-unauthorized.json
            exit 1
          fi

          forbidden_code="$(curl --silent --show-error --output /tmp/worker-forbidden.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $DATANEXUS_WORKER_SECRET" -H 'Content-Type: application/json' --data '{"mode":"ADAPTIVE_DISPATCH"}' "$BASE_URL/api/jobs/worker")"
          if [ "$forbidden_code" != "403" ]; then
            echo "::error::Broad adaptive-dispatch boundary returned HTTP $forbidden_code, expected 403"
            summarize_boundary_response "broad adaptive-dispatch response" /tmp/worker-forbidden.json
            exit 1
          fi

          canary_code="$(curl --silent --show-error --output /tmp/worker-canary.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $DATANEXUS_WORKER_SECRET" -H 'Content-Type: application/json' --data '{"mode":"CLOUDFLARE_OBSERVABILITY_CANARY"}' "$BASE_URL/api/jobs/worker")"
          if [ "$canary_code" != "200" ]; then
            echo "::error::Authenticated canary boundary returned HTTP $canary_code, expected 200"
            summarize_boundary_response "authenticated canary response" /tmp/worker-canary.json
            exit 1
          fi
          echo "Canary boundary status: unauth=$unauthorized_code broad=$forbidden_code canary=$canary_code"
          node -e "const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const invalid=body.accepted!==true||body.mode!=='CLOUDFLARE_OBSERVABILITY_CANARY'||body.jobType!=='OBSERVABILITY'||!Number.isInteger(body.claimed)||body.claimed<0||body.claimed>1; if(invalid){const safe={}; for(const key of ['error','status','environment','accepted','mode','jobType','claimed']) if(Object.prototype.hasOwnProperty.call(body,key)) safe[key]=body[key]; console.error('::error::Authenticated canary response contract mismatch ' + JSON.stringify(safe)); process.exit(1)}" /tmp/worker-canary.json

      - name: Enable Supabase canary scheduler only after live verification
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
          DATANEXUS_CLOUDFLARE_WORKER_URL: ${{ vars.DATANEXUS_CLOUDFLARE_WORKER_URL }}
          DATANEXUS_WORKER_SECRET: ${{ secrets.DATANEXUS_WORKER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_URL"
          test -n "$DATANEXUS_CLOUDFLARE_WORKER_URL"
          test -n "$DATANEXUS_WORKER_SECRET"
          SUPABASE_AUTH_ARGS=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          if [[ "$SUPABASE_SERVICE_ROLE_KEY" == *.*.* ]]; then
            SUPABASE_AUTH_ARGS+=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/rpc/configure_cloudflare_observability_canary_release" \
            "${SUPABASE_AUTH_ARGS[@]}" \
            -H "Content-Type: application/json" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({p_worker_url:process.argv[1],p_worker_secret:process.argv[2],p_enabled:true}))' "${DATANEXUS_CLOUDFLARE_WORKER_URL%/}/api/jobs/worker" "$DATANEXUS_WORKER_SECRET")"

      - name: Verify enabled Supabase canary state
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
        run: |
          set -euo pipefail
          SUPABASE_AUTH_ARGS=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          if [[ "$SUPABASE_SERVICE_ROLE_KEY" == *.*.* ]]; then
            SUPABASE_AUTH_ARGS+=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_cloudflare_observability_canary_release_status" \
            "${SUPABASE_AUTH_ARGS[@]}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --output /tmp/canary-enabled-status.json
          node -e "const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('/tmp/canary-enabled-status.json','utf8')); if(body.enabled!==true||body.runtime_configured!==true||body.cron_active!==true||body.cron_schedule!=='*/5 * * * *'||body.allowed_job_type!=='OBSERVABILITY'||body.scheduler_authority!=='Supabase'||body.single_flight_limit!==1) process.exit(1)"

      - name: Fail closed after activation error
        if: ${{ failure() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATANEXUS_CLOUDFLARE_WORKER_URL: ${{ vars.DATANEXUS_CLOUDFLARE_WORKER_URL }}
          DATANEXUS_WORKER_SECRET: ${{ secrets.DATANEXUS_WORKER_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
          EXACT_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          set +e
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -n "${DATANEXUS_CLOUDFLARE_WORKER_URL:-}" ] && [ -n "${DATANEXUS_WORKER_SECRET:-}" ]; then
            SUPABASE_AUTH_ARGS=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
            if [[ "$SUPABASE_SERVICE_ROLE_KEY" == *.*.* ]]; then
              SUPABASE_AUTH_ARGS+=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
            fi
            curl --fail-with-body --silent --show-error \
              -X POST "$SUPABASE_URL/rest/v1/rpc/configure_cloudflare_observability_canary_release" \
              "${SUPABASE_AUTH_ARGS[@]}" \
              -H "Content-Type: application/json" \
              --data "$(node -e 'process.stdout.write(JSON.stringify({p_worker_url:process.argv[1],p_worker_secret:process.argv[2],p_enabled:false}))' "${DATANEXUS_CLOUDFLARE_WORKER_URL%/}/api/jobs/worker" "$DATANEXUS_WORKER_SECRET")" \
              || echo "::warning::Unable to disable Supabase Cloudflare canary scheduler during failure cleanup"
          fi
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${EXACT_SHA:-}" ]; then
            node scripts/prepare-cloudflare-tooling.mjs
            BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            RELEASE_ID="github-worker-canary-failclosed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            "$RUNNER_TEMP/datanexus-cloudflare-tools/node_modules/.bin/wrangler" deploy --config infra/cloudflare/worker-runtime/wrangler.jsonc \
              --var "DATANEXUS_ENV:canary" \
              --var "DATANEXUS_PLATFORM:cloudflare" \
              --var "DATANEXUS_WORKER_EXECUTION_ENABLED:false" \
              --var "DATANEXUS_WORKER_CANARY_JOB_TYPE:OBSERVABILITY" \
              --var "DATANEXUS_COMMIT_SHA:$EXACT_SHA" \
              --var "DATANEXUS_RELEASE_ID:$RELEASE_ID" \
              --var "DATANEXUS_BUILD_TIMESTAMP:$BUILD_TIMESTAMP" \
              || echo "::warning::Unable to redeploy Cloudflare worker with execution disabled during failure cleanup"
          fi


  disable-cloudflare-worker-canary:
    name: cloudflare-worker-canary-disable
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cloudflare-worker-canary-disable' && inputs.confirm_worker_execution == true
    needs: release-governance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-worker
    permissions:
      contents: read
    steps:
      - name: Checkout exact certified SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify immutable worker release identity
        id: identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$REQUESTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main || {
            echo "::error::Cloudflare worker canary disable SHA is not reachable from protected main"
            exit 1
          }
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Disable Supabase canary scheduler first
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
          DATANEXUS_CLOUDFLARE_WORKER_URL: ${{ vars.DATANEXUS_CLOUDFLARE_WORKER_URL }}
          DATANEXUS_WORKER_SECRET: ${{ secrets.DATANEXUS_WORKER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_URL"
          test -n "$DATANEXUS_CLOUDFLARE_WORKER_URL"
          test -n "$DATANEXUS_WORKER_SECRET"
          SUPABASE_AUTH_ARGS=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          if [[ "$SUPABASE_SERVICE_ROLE_KEY" == *.*.* ]]; then
            SUPABASE_AUTH_ARGS+=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/rpc/configure_cloudflare_observability_canary_release" \
            "${SUPABASE_AUTH_ARGS[@]}" \
            -H "Content-Type: application/json" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({p_worker_url:process.argv[1],p_worker_secret:process.argv[2],p_enabled:false}))' "${DATANEXUS_CLOUDFLARE_WORKER_URL%/}/api/jobs/worker" "$DATANEXUS_WORKER_SECRET")"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Revalidate worker kill-switch contracts
        run: |
          set -euo pipefail
          pnpm run verify:worker-runtime
          pnpm exec tsc --noEmit

      - name: Redeploy worker with execution disabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATANEXUS_CLOUDFLARE_WORKER_URL: ${{ vars.DATANEXUS_CLOUDFLARE_WORKER_URL }}
