            fi
            sleep 2
          done
          test "$ready" = "1"
          disabled_code="$(curl --silent --show-error --output /tmp/worker-disabled.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"mode":"CLOUDFLARE_OBSERVABILITY_CANARY"}' "$BASE_URL/api/jobs/worker")"
          test "$disabled_code" = "503"

      - name: Verify Supabase canary scheduler disabled
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
        run: |
          set -euo pipefail
          SUPABASE_AUTH_ARGS=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          if [[ "$SUPABASE_SERVICE_ROLE_KEY" == *.*.* ]]; then
            SUPABASE_AUTH_ARGS+=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_cloudflare_observability_canary_release_status" \
            "${SUPABASE_AUTH_ARGS[@]}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --output /tmp/canary-disabled-status.json
          node -e "const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('/tmp/canary-disabled-status.json','utf8')); if(body.enabled!==false||body.cron_active!==true||body.allowed_job_type!=='OBSERVABILITY'||body.scheduler_authority!=='Supabase'||body.single_flight_limit!==1) process.exit(1)"



  deploy-vercel-production:
    name: vercel-production-deploy
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'vercel-production-deploy'
    needs: release-governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: datanexus-vercel-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_qVinlzIY0FqhWavLWzBd8HhT
      VERCEL_PROJECT_ID: prj_Wg1fgyXWUN99I4zlWrtlU9si6yfR
      VERCEL_SCOPE: data-nexus3
      DATANEXUS_VERCEL_PRODUCTION_URL: https://data-quality-ai-platform.vercel.app
      VERCEL_CLI_VERSION: 59.19.1
      EXPECTED_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Validate requested immutable SHA is current main
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          CURRENT_MAIN_SHA="$(git rev-parse HEAD)"
          if [ "$EXPECTED_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "::error::Requested Vercel deployment SHA is stale. Expected current main $CURRENT_MAIN_SHA but received $EXPECTED_SHA"
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo "sha=$CURRENT_MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel credential is available
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || {
            echo "::error::Required Vercel production credential is not configured"
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel --version | grep -F "$VERCEL_CLI_VERSION"

      - name: Bind runner to pinned Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull             --yes             --environment=production             --token "$VERCEL_TOKEN"             --scope "$VERCEL_SCOPE"

          node <<'NODE'
          const fs = require('node:fs')
          const link = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'))
          if (
            link.orgId !== process.env.VERCEL_ORG_ID ||
            link.projectId !== process.env.VERCEL_PROJECT_ID
          ) {
            console.error('Vercel project binding mismatch')
            process.exit(1)
          }
          NODE

      - name: Deploy exact current main to Vercel Production
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXACT_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_ID="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          vercel deploy             --prod             --yes             --force             --token "$VERCEL_TOKEN"             --scope "$VERCEL_SCOPE"             --env "DATANEXUS_COMMIT_SHA=$EXACT_SHA"             --env "DATANEXUS_ENV=production"             --env "DATANEXUS_PLATFORM=vercel"             --env "DATANEXUS_RELEASE_ID=$RELEASE_ID"             --env "DATANEXUS_BUILD_TIMESTAMP=$BUILD_TIMESTAMP"             --build-env "DATANEXUS_COMMIT_SHA=$EXACT_SHA"             --build-env "DATANEXUS_ENV=production"             --build-env "DATANEXUS_PLATFORM=vercel"             --build-env "DATANEXUS_RELEASE_ID=$RELEASE_ID"             --build-env "DATANEXUS_BUILD_TIMESTAMP=$BUILD_TIMESTAMP"             2>&1 | tee /tmp/vercel-deploy.log

          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n1 | tr -d '\r')"
          test -n "$DEPLOYMENT_URL" || {
            echo "::error::Vercel CLI did not return a deployment URL"
            exit 1
          }
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify exact deployed identity
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXACT_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          BASE_URL="${DEPLOYMENT_URL%/}"
          ok=0
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --connect-timeout 5 --max-time 15               --output /tmp/vercel-deployed-build.json --write-out '%{http_code}'               "$BASE_URL/api/build-info" || true)"
            if [ "$code" = "200" ] && node - "$EXACT_SHA" /tmp/vercel-deployed-build.json <<'NODE'
          const fs = require('node:fs')
          const expected = process.argv[2]
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          if (
            body.commitSha !== expected ||
            body.environment !== 'production' ||
            body.platform !== 'vercel' ||
            typeof body.releaseId !== 'string' ||
            !body.releaseId.startsWith('github-')
          ) process.exit(1)
          NODE
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1" || {
            echo "::error::Exact deployment identity verification failed"
            exit 1
          }

      - name: Verify production alias and critical health contracts
        shell: bash
        env:
          EXACT_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          BASE_URL="${DATANEXUS_VERCEL_PRODUCTION_URL%/}"

          fetch_ready() {
            local path="$1"
            local output="$2"
            local attempts="${3:-12}"
            local code
            for attempt in $(seq 1 "$attempts"); do
              code="$(curl --silent --show-error --connect-timeout 5 --max-time 20                 --output "$output" --write-out '%{http_code}'                 "$BASE_URL$path" || true)"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 10
            done
            echo "::error::$path did not become HTTP 200"
            cat "$output" 2>/dev/null || true
            return 1
          }

          fetch_ready "/api/build-info" /tmp/vercel-production-build.json
          node - "$EXACT_SHA" /tmp/vercel-production-build.json <<'NODE'
          const fs = require('node:fs')
          const expected = process.argv[2]
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          if (body.commitSha !== expected || body.environment !== 'production' || body.platform !== 'vercel') process.exit(1)
          NODE

          fetch_ready "/api/health/live" /tmp/vercel-production-live.json
          node - /tmp/vercel-production-live.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'ALIVE') process.exit(1)
          NODE

          fetch_ready "/api/health/supabase" /tmp/vercel-production-supabase.json
          node - /tmp/vercel-production-supabase.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY' || body.provider !== 'supabase' || body.boundary !== 'public-data-api') process.exit(1)
          NODE

          fetch_ready "/api/health/release-schema" /tmp/vercel-production-release-schema.json
          node - /tmp/vercel-production-release-schema.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY' || body.contract !== 'cloudflare-supabase-release-v1') process.exit(1)
          if (!body.checks || Object.values(body.checks).some((check) => check?.status !== 'READY')) process.exit(1)
          NODE

          fetch_ready "/api/health/ready" /tmp/vercel-production-ready.json 18
          node - /tmp/vercel-production-ready.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY') process.exit(1)
          NODE

      - name: Record production release summary
        shell: bash
        env:
          EXACT_SHA: ${{ steps.identity.outputs.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Vercel production release"
            echo ""
            echo "- Exact SHA: `$EXACT_SHA`"
            echo "- Deployment URL: `$DEPLOYMENT_URL`"
            echo "- Production URL: `$DATANEXUS_VERCEL_PRODUCTION_URL`"
            echo "- Build identity: PASS"
            echo "- Liveness: PASS"
            echo "- Supabase public Data API: PASS"
            echo "- Release schema: PASS"
            echo "- Full readiness: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  certify-vercel-production:
    name: vercel-production-certify
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'vercel-production-certify'
    needs: release-governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      DATANEXUS_VERCEL_PRODUCTION_URL: https://data-quality-ai-platform.vercel.app
      EXPECTED_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Validate requested immutable SHA is current main
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          CURRENT_MAIN_SHA="$(git rev-parse HEAD)"
          test "$EXPECTED_SHA" = "$CURRENT_MAIN_SHA" || {
            echo "::error::Requested Vercel certification SHA is stale. Expected current main $CURRENT_MAIN_SHA but received $EXPECTED_SHA"
            exit 1
          }

      - name: Verify production liveness and exact release identity
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${DATANEXUS_VERCEL_PRODUCTION_URL%/}"

          live_code="$(curl --silent --show-error --output /tmp/vercel-live.json --write-out '%{http_code}' "$BASE_URL/api/health/live")"
          test "$live_code" = "200"
          node - /tmp/vercel-live.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'ALIVE') process.exit(1)
          NODE

          build_code="$(curl --silent --show-error --output /tmp/vercel-build.json --write-out '%{http_code}' "$BASE_URL/api/build-info")"
          test "$build_code" = "200"
          node - "$EXPECTED_SHA" /tmp/vercel-build.json <<'NODE'
          const fs = require('node:fs')
          const expected = process.argv[2]
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          if (body.commitSha !== expected || body.environment !== 'production' || body.platform !== 'vercel') process.exit(1)
          NODE

      - name: Verify production readiness remains fail closed
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${DATANEXUS_VERCEL_PRODUCTION_URL%/}"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            "$BASE_URL/api/health/ready" \
            --output /tmp/vercel-ready.json
          node - /tmp/vercel-ready.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY') process.exit(1)
          NODE

      - name: Verify production Supabase and release-schema contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${DATANEXUS_VERCEL_PRODUCTION_URL%/}"

          supabase_code="$(curl --silent --show-error --output /tmp/vercel-supabase.json --write-out '%{http_code}' "$BASE_URL/api/health/supabase")"
          test "$supabase_code" = "200"
          node - /tmp/vercel-supabase.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY' || body.provider !== 'supabase' || body.boundary !== 'public-data-api') process.exit(1)
          NODE

          schema_code="$(curl --silent --show-error --output /tmp/vercel-release-schema.json --write-out '%{http_code}' "$BASE_URL/api/health/release-schema")"
          test "$schema_code" = "200"
          node - /tmp/vercel-release-schema.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'READY' || body.contract !== 'cloudflare-supabase-release-v1') process.exit(1)
          if (!body.checks || Object.values(body.checks).some((check) => check?.status !== 'READY')) process.exit(1)
          NODE

      - name: Verify OIDC-enabled R2 certification route is deployed
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${DATANEXUS_VERCEL_PRODUCTION_URL%/}"
          code="$(curl --silent --show-error --output /tmp/r2-cert-auth.json --write-out '%{http_code}' "$BASE_URL/api/internal/storage/certify-r2")"
          test "$code" = "401"
          node - /tmp/r2-cert-auth.json <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.error !== 'Unauthorized.') process.exit(1)
          NODE
