name: Native Rollback Contracts Current

on:
  push:
    branches: [main]
    paths:
      - 'lib/agents/runtime/native-autonomy-kernel.ts'
      - 'lib/agents/runtime/native-recovery-v2.ts'
      - 'lib/agents/runtime/native-rollback-contract.ts'
      - 'scripts/test-native-autonomy-kernel.mjs'
      - 'scripts/test-native-rollback-contracts.mjs'
      - 'scripts/verify-native-autonomy-kernel.mjs'
      - 'scripts/verify-native-rollback-contracts-current.mjs'
      - 'supabase/migrations/**native_rollback_compensation_contracts.sql'
      - '.github/workflows/native-rollback-contracts-current.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/agents/runtime/native-autonomy-kernel.ts'
      - 'lib/agents/runtime/native-recovery-v2.ts'
      - 'lib/agents/runtime/native-rollback-contract.ts'
      - 'scripts/test-native-autonomy-kernel.mjs'
      - 'scripts/test-native-rollback-contracts.mjs'
      - 'scripts/verify-native-autonomy-kernel.mjs'
      - 'scripts/verify-native-rollback-contracts-current.mjs'
      - 'supabase/migrations/**native_rollback_compensation_contracts.sql'
      - '.github/workflows/native-rollback-contracts-current.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify rollback contracts
        run: node scripts/verify-native-rollback-contracts-current.mjs
      - name: Test rollback contract classifier
        run: node --experimental-strip-types scripts/test-native-rollback-contracts.mjs
