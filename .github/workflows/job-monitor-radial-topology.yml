name: Job Monitor Radial Topology

on:
  pull_request:
    paths:
      - 'app/monitoring/**'
      - 'scripts/test-job-monitor-radial-topology.mjs'
      - '.github/workflows/job-monitor-radial-topology.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify radial topology contract
        run: node scripts/test-job-monitor-radial-topology.mjs
