name: Job Monitor Radial Topology

on:
  pull_request:
    paths:
      - 'app/monitoring/**'
      - 'scripts/test-job-monitor-radial-topology.mjs'
      - '.github/workflows/job-monitor-radial-topology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify radial topology contract
        run: node scripts/test-job-monitor-radial-topology.mjs
