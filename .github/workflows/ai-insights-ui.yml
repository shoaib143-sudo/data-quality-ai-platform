name: AI Insights UI

on:
  push:
    branches: [main]
    paths:
      - 'app/ai-insights/**'
      - 'scripts/verify-ai-insights-ui.mjs'
      - '.github/workflows/ai-insights-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/ai-insights/**'
      - 'scripts/verify-ai-insights-ui.mjs'
      - '.github/workflows/ai-insights-ui.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-ai-insights-ui.mjs
      - run: pnpm run build
