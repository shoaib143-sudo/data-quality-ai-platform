name: Storage R2 Assurance

on:
  push:
    branches:
      - r2-prereq-hardening-20260916
      - r2-main-reconcile-20260917
    paths:
      - 'lib/storage/**'
      - 'lib/profiling/provider-neutral-file-source.ts'
      - 'lib/profiling/source-validation.ts'
      - 'lib/profiling/governed-file-source.ts'
      - 'app/api/datasets/register/route.ts'
      - 'app/api/datasets/source/upload-file/**'
      - 'app/api/internal/storage/**'
      - 'infra/cloudflare/**'
      - 'scripts/verify-r2-*.mjs'
      - 'supabase/migrations/*storage*.sql'
      - 'tests/storage-*.test.mjs'
      - '.github/workflows/storage-r2-assurance.yml'
  pull_request:
    paths:
      - 'lib/storage/**'
      - 'lib/profiling/provider-neutral-file-source.ts'
      - 'lib/profiling/source-validation.ts'
      - 'lib/profiling/governed-file-source.ts'
      - 'app/api/datasets/register/route.ts'
      - 'app/api/datasets/source/upload-file/**'
      - 'app/api/internal/storage/**'
      - 'infra/cloudflare/**'
      - 'scripts/verify-r2-*.mjs'
      - 'supabase/migrations/*storage*.sql'
      - 'tests/storage-*.test.mjs'
      - '.github/workflows/storage-r2-assurance.yml'
  workflow_dispatch:

concurrency:
  group: storage-r2-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  storage-contract-and-adversarial-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax-check storage TypeScript without executing it
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --experimental-strip-types --check "$file"
          done < <(find lib/storage app/api/internal/storage app/api/datasets/source/upload-file -type f -name '*.ts' -print0)
      - name: Run storage contract, negative, adversarial, and cutover guards
        run: node --test tests/storage-*.test.mjs

  live-production-certification:
    if: github.event_name == 'workflow_dispatch'
    needs: storage-contract-and-adversarial-guards
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DATANEXUS_CERTIFICATION_TARGET_URL: ${{ vars.DATANEXUS_CERTIFICATION_TARGET_URL }}
      OIDC_AUDIENCE: datanexus-r2-production
    steps:
      - name: Require governed certification target and GitHub OIDC runtime
        run: |
          set -euo pipefail
          test -n "${DATANEXUS_CERTIFICATION_TARGET_URL:-}" || { echo "::error::DATANEXUS_CERTIFICATION_TARGET_URL must be configured in the protected production environment"; exit 1; }
          case "$DATANEXUS_CERTIFICATION_TARGET_URL" in
            https://data-quality-ai-platform.vercel.app|https://canary.datanexus.invalid) ;;
            *) echo "::error::Certification target is not an approved governed endpoint"; exit 1 ;;
          esac
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "::error::GitHub OIDC request URL is unavailable"; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "::error::GitHub OIDC request token is unavailable"; exit 1; }

      - name: Verify or apply approved R2 CORS policy
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail-with-body --silent --show-error \\
            --connect-timeout 10 --max-time 30 \\
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \\
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(printf '%s' "$oidc_response" | node -e '
            let body="";
            process.stdin.on("data", c => body += c);
            process.stdin.on("end", () => {
              const result=JSON.parse(body);
              if (typeof result.value !== "string" || result.value.split(".").length !== 3) process.exit(2);
              process.stdout.write(result.value);
            });
          ')"
          if current="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$DATANEXUS_CERTIFICATION_TARGET_URL/api/internal/storage/configure-r2-cors")" \
            && printf '%s' "$current" | node -e '
              let body="";
              process.stdin.on("data", c => body += c);
              process.stdin.on("end", () => {
                const result=JSON.parse(body);
                if (result.configured !== true || result.matchesDesiredPolicy !== true || result.wildcardOriginDetected === true) process.exit(2);
              });
            '; then
            echo "R2 CORS policy already matches the governed desired state."
          else
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              "$DATANEXUS_CERTIFICATION_TARGET_URL/api/internal/storage/configure-r2-cors" \
              | node -e '
                let body="";
                process.stdin.on("data", c => body += c);
                process.stdin.on("end", () => {
                  const result=JSON.parse(body);
                  if (result.applied !== true || result.matchesDesiredPolicy !== true || result.wildcardOriginDetected === true) process.exit(2);
                  console.log(JSON.stringify({configured:result.configured,applied:result.applied,matchesDesiredPolicy:result.matchesDesiredPolicy,wildcardOriginDetected:result.wildcardOriginDetected},null,2));
                });
              '
          fi

      - name: Copy and verify Supabase objects into R2
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail-with-body --silent --show-error \\
            --connect-timeout 10 --max-time 30 \\
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \\
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(printf '%s' "$oidc_response" | node -e '
            let body="";
            process.stdin.on("data", c => body += c);
            process.stdin.on("end", () => {
              const result=JSON.parse(body);
              if (typeof result.value !== "string" || result.value.split(".").length !== 3) process.exit(2);
              process.stdout.write(result.value);
            });
          ')"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$DATANEXUS_CERTIFICATION_TARGET_URL/api/internal/storage/migrate-to-r2")"
          printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", c => body += c);
            process.stdin.on("end", () => {
              const result=JSON.parse(body);
              const rows=Array.isArray(result.results) ? result.results : [];
              const bad=rows.filter(r => !["COPIED_AND_VERIFIED","SKIPPED_ALREADY_READY"].includes(r.action));
              if (result.sourceObjectsDeleted !== 0 || result.datasetVersionReferencesChanged !== 0 || bad.length) process.exit(2);
              console.log(JSON.stringify({examined:result.examined,actions:rows.map(r=>r.action),sourceObjectsDeleted:result.sourceObjectsDeleted,datasetVersionReferencesChanged:result.datasetVersionReferencesChanged},null,2));
            });
          '

      - name: Production R2 certification
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail-with-body --silent --show-error \\
            --connect-timeout 10 --max-time 30 \\
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \\
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(printf '%s' "$oidc_response" | node -e '
            let body="";
            process.stdin.on("data", c => body += c);
            process.stdin.on("end", () => {
              const result=JSON.parse(body);
              if (typeof result.value !== "string" || result.value.split(".").length !== 3) process.exit(2);
              process.stdout.write(result.value);
            });
          ')"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$DATANEXUS_CERTIFICATION_TARGET_URL/api/internal/storage/certify-r2")"
          printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", c => body += c);
            process.stdin.on("end", () => {
              const result=JSON.parse(body);
              const unsafe=["error","secret","token","credential"];
              if (unsafe.some(k => Object.prototype.hasOwnProperty.call(result,k))) process.exit(2);
              if (result.certified !== true) process.exit(3);
              if (result.runtime?.productionCutoverActive === true) process.exit(4);
              console.log(JSON.stringify(result,null,2));
            });
          '

      - name: Verify R2 reference cutover dry run
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail-with-body --silent --show-error \\
            --connect-timeout 10 --max-time 30 \\
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \\
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(printf '%s' "$oidc_response" | node -e '
            let body="";
            process.stdin.on("data", c => body += c);
            process.stdin.on("end", () => {
              const result=JSON.parse(body);
              if (typeof result.value !== "string" || result.value.split(".").length !== 3) process.exit(2);
              process.stdout.write(result.value);
            });
          ')"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"mode":"dry-run"}' \
            "$DATANEXUS_CERTIFICATION_TARGET_URL/api/internal/storage/reference-cutover")"
          printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", c => body += c);
            process.stdin.on("end", () => {
              const result=JSON.parse(body);
              const rows=Array.isArray(result.results) ? result.results : [];
              if (result.mode !== "dry-run") process.exit(2);
              if ((result.examinedTargets ?? 0) < 1 || (result.eligibleReferences ?? 0) < 1) process.exit(3);
              if (result.changedReferences !== 0 || result.destructiveActions !== 0) process.exit(4);
              if (rows.some(r => r.action === "ERROR" || r.action === "SKIPPED_INTEGRITY_MISMATCH")) process.exit(5);
              console.log(JSON.stringify({
                mode: result.mode,
                examinedTargets: result.examinedTargets,
                eligibleReferences: result.eligibleReferences,
                changedReferences: result.changedReferences,
                destructiveActions: result.destructiveActions
              },null,2));
            });
          '

