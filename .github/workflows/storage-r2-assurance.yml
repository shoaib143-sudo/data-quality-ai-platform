name: Storage R2 Assurance

on:
  push:
    branches:
      - r2-prereq-hardening-20260916
    paths:
      - 'lib/storage/**'
      - 'app/api/datasets/source/upload-file/**'
      - 'app/api/internal/storage/r2-smoke/**'
      - 'supabase/migrations/*storage_registry*.sql'
      - 'tests/storage-contract.test.mjs'
      - '.github/workflows/storage-r2-assurance.yml'
  pull_request:
    paths:
      - 'lib/storage/**'
      - 'app/api/datasets/source/upload-file/**'
      - 'app/api/internal/storage/r2-smoke/**'
      - 'supabase/migrations/*storage_registry*.sql'
      - 'tests/storage-contract.test.mjs'
      - '.github/workflows/storage-r2-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-contract-and-adversarial-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run storage contract, negative, and adversarial guards
        run: node --test tests/storage-contract.test.mjs
