name: Semantic Reindex Completeness

on:
  pull_request:
    paths:
      - 'lib/governance/semantic-project-reindex.ts'
      - 'app/api/search/semantic/reindex/route.ts'
      - 'tests/semantic-project-reindex.test.mjs'
      - '.github/workflows/semantic-reindex-completeness.yml'
  push:
    branches: [main]
    paths:
      - 'lib/governance/semantic-project-reindex.ts'
      - 'app/api/search/semantic/reindex/route.ts'
      - 'tests/semantic-project-reindex.test.mjs'
      - '.github/workflows/semantic-reindex-completeness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/semantic-project-reindex.test.mjs
