name: Governed Backtesting Foundation

on:
  pull_request:
    paths:
      - 'lib/ai/evaluation-dataset.ts'
      - 'lib/ai/governed-backtesting.ts'
      - 'scripts/test-governed-backtesting.mjs'
      - 'scripts/audit-governed-backtesting-adversarial.mjs'
      - '.github/workflows/governed-backtesting-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/ai/evaluation-dataset.ts'
      - 'lib/ai/governed-backtesting.ts'
      - 'scripts/test-governed-backtesting.mjs'
      - 'scripts/audit-governed-backtesting-adversarial.mjs'
      - '.github/workflows/governed-backtesting-foundation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Run governed backtesting contracts
        run: node --experimental-strip-types --test scripts/test-governed-backtesting.mjs
      - name: Run independent governed backtesting adversarial audit
        run: node scripts/audit-governed-backtesting-adversarial.mjs
