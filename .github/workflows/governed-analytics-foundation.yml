name: Governed Analytics Foundation

on:
  pull_request:
    paths:
      - 'lib/data-quality/governed-analysis-foundation.ts'
      - 'supabase/migrations/20260915102000_governed_analytics_foundation.sql'
      - 'scripts/test-governed-analysis-foundation.mjs'
      - '.github/workflows/governed-analytics-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/data-quality/governed-analysis-foundation.ts'
      - 'supabase/migrations/20260915102000_governed_analytics_foundation.sql'
      - 'scripts/test-governed-analysis-foundation.mjs'
      - '.github/workflows/governed-analytics-foundation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify governed analytics foundation
        run: node --experimental-strip-types scripts/test-governed-analysis-foundation.mjs
