name: Governed Analytics Foundation

on:
  pull_request:
    paths:
      - 'lib/analytics/governance-history-contract.ts'
      - 'lib/analytics/governance-outcome-history.ts'
      - 'lib/analytics/audit-event-history.ts'
      - 'app/api/analytics/governance-outcome-trends/route.ts'
      - 'app/api/analytics/audit-event-trends/route.ts'
      - 'tests/governance-outcome-history.test.mjs'
      - 'tests/audit-event-history.test.mjs'
      - 'supabase/migrations/20260920043000_governance_audit_history_analytics.sql'
      - 'lib/analytics/profiling-history-trends.ts'
      - 'app/api/analytics/profiling-trends/route.ts'
      - 'tests/profiling-history-trends.test.mjs'
      - 'lib/analytics/data-quality-history.ts'
      - 'app/api/analytics/data-quality-trends/route.ts'
      - 'tests/data-quality-history.test.mjs'
      - 'lib/data-quality/governed-analysis-foundation.ts'
      - 'supabase/migrations/20260915102000_governed_analytics_foundation.sql'
      - 'scripts/test-governed-analysis-foundation.mjs'
      - '.github/workflows/governed-analytics-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/analytics/governance-history-contract.ts'
      - 'lib/analytics/governance-outcome-history.ts'
      - 'lib/analytics/audit-event-history.ts'
      - 'app/api/analytics/governance-outcome-trends/route.ts'
      - 'app/api/analytics/audit-event-trends/route.ts'
      - 'tests/governance-outcome-history.test.mjs'
      - 'tests/audit-event-history.test.mjs'
      - 'supabase/migrations/20260920043000_governance_audit_history_analytics.sql'
      - 'lib/analytics/profiling-history-trends.ts'
      - 'app/api/analytics/profiling-trends/route.ts'
      - 'tests/profiling-history-trends.test.mjs'
      - 'lib/analytics/data-quality-history.ts'
      - 'app/api/analytics/data-quality-trends/route.ts'
      - 'tests/data-quality-history.test.mjs'
      - 'lib/data-quality/governed-analysis-foundation.ts'
      - 'supabase/migrations/20260915102000_governed_analytics_foundation.sql'
      - 'scripts/test-governed-analysis-foundation.mjs'
      - '.github/workflows/governed-analytics-foundation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify governed analytics foundation
        run: node --experimental-strip-types scripts/test-governed-analysis-foundation.mjs
      - name: Verify profiling history trends
        run: node --experimental-strip-types --test tests/profiling-history-trends.test.mjs
      - name: Verify Data Quality history analysis
        run: node --experimental-strip-types --test tests/data-quality-history.test.mjs
      - name: Verify executive outcome history
        run: node --experimental-strip-types --test tests/governance-outcome-history.test.mjs
      - name: Verify immutable audit history analytics
        run: node --experimental-strip-types --test tests/audit-event-history.test.mjs
