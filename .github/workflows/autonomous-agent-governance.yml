name: Autonomous Agent Governance

on:
  push:
    branches: [main, governed-autonomy-evidence]
    paths:
      - 'supabase/migrations/**'
      - 'lib/agents/governed-agent-registry.ts'
      - 'lib/agents/governance-specialist-agent.ts'
      - 'lib/agents/run-result-artifact.ts'
      - 'lib/agents/run-profiling-job.ts'
      - 'lib/agents/executors/**'
      - 'lib/agents/runtime/**'
      - 'lib/data-quality/queue.ts'
      - 'lib/orchestration/worker.ts'
      - 'app/api/agents/governance/run/route.ts'
      - 'app/api/agents/runtime/**'
      - 'app/api/recovery/**'
      - 'app/agents/runs/**'
      - 'app/recovery/**'
      - 'scripts/verify-autonomous-agent-governance.mjs'
      - 'scripts/verify-agent-run-artifacts.mjs'
      - 'scripts/verify-execution-recovery-agent.mjs'
      - 'scripts/verify-native-agent-runtime-state.mjs'
      - 'scripts/verify-native-runtime-contract-pinning.mjs'
      - 'scripts/verify-native-autonomy-kernel.mjs'
      - 'scripts/verify-native-recovery-v2.mjs'
      - 'scripts/verify-all-agent-native-runtime-adoption.mjs'
      - 'scripts/test-native-autonomy-kernel.mjs'
      - 'package.json'
      - '.github/workflows/autonomous-agent-governance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'lib/agents/governed-agent-registry.ts'
      - 'lib/agents/governance-specialist-agent.ts'
      - 'lib/agents/run-result-artifact.ts'
      - 'lib/agents/run-profiling-job.ts'
      - 'lib/agents/executors/**'
      - 'lib/agents/runtime/**'
      - 'lib/data-quality/queue.ts'
      - 'lib/orchestration/worker.ts'
      - 'app/api/agents/governance/run/route.ts'
      - 'app/api/agents/runtime/**'
      - 'app/api/recovery/**'
      - 'app/agents/runs/**'
      - 'app/recovery/**'
      - 'scripts/verify-autonomous-agent-governance.mjs'
      - 'scripts/verify-agent-run-artifacts.mjs'
      - 'scripts/verify-execution-recovery-agent.mjs'
      - 'scripts/verify-native-agent-runtime-state.mjs'
      - 'scripts/verify-native-runtime-contract-pinning.mjs'
      - 'scripts/verify-native-autonomy-kernel.mjs'
      - 'scripts/verify-native-recovery-v2.mjs'
      - 'scripts/verify-all-agent-native-runtime-adoption.mjs'
      - 'scripts/test-native-autonomy-kernel.mjs'
      - 'package.json'
      - '.github/workflows/autonomous-agent-governance.yml'

permissions:
  contents: read

jobs:
  module14-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify autonomous action safety and immutable evidence
        run: node scripts/verify-autonomous-agent-governance.mjs
      - name: Verify durable agent run result artifacts
        run: node scripts/verify-agent-run-artifacts.mjs
      - name: Verify governed execution recovery
        run: node scripts/verify-execution-recovery-agent.mjs
      - name: Verify native agent runtime state
        run: node scripts/verify-native-agent-runtime-state.mjs
      - name: Verify native runtime contract pinning
        run: node scripts/verify-native-runtime-contract-pinning.mjs
      - name: Verify native autonomous execution kernel
        run: node scripts/verify-native-autonomy-kernel.mjs
      - name: Verify native Recovery V2
        run: node scripts/verify-native-recovery-v2.mjs
      - name: Verify shared native runtime adoption
        run: node scripts/verify-all-agent-native-runtime-adoption.mjs
