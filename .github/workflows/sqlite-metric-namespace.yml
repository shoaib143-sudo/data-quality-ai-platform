name: SQLite Metric Namespace

on:
  pull_request:
    paths:
      - 'lib/profiling/metric-engine.ts'
      - 'scripts/verify-sqlite-metric-namespace.mjs'
      - '.github/workflows/sqlite-metric-namespace.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/profiling/metric-engine.ts'
      - 'scripts/verify-sqlite-metric-namespace.mjs'
      - '.github/workflows/sqlite-metric-namespace.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - run: node scripts/verify-sqlite-metric-namespace.mjs
