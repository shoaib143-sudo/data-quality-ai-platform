name: SQLite Metric Namespace

on:
  pull_request:
    paths:
      - 'lib/profiling/metric-engine.ts'
      - 'scripts/verify-sqlite-metric-namespace.mjs'
      - '.github/workflows/sqlite-metric-namespace.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/profiling/metric-engine.ts'
      - 'scripts/verify-sqlite-metric-namespace.mjs'
      - '.github/workflows/sqlite-metric-namespace.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: node scripts/verify-sqlite-metric-namespace.mjs
