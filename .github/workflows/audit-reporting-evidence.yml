name: Audit Reporting Evidence

on:
  push:
    branches: [main, governed-audit-reporting]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-audit-reporting-evidence.mjs'
      - 'scripts/verify-governance-report-source-evidence.mjs'
      - 'app/api/reports/governance/route.ts'
      - 'app/reports/page.tsx'
      - 'app/reports/report-manager.tsx'
      - '.github/workflows/audit-reporting-evidence.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-audit-reporting-evidence.mjs'
      - 'scripts/verify-governance-report-source-evidence.mjs'
      - 'app/api/reports/governance/route.ts'
      - 'app/reports/page.tsx'
      - 'app/reports/report-manager.tsx'
      - '.github/workflows/audit-reporting-evidence.yml'

permissions:
  contents: read

jobs:
  module11-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify immutable chain-bound audit reporting evidence
        run: node scripts/verify-audit-reporting-evidence.mjs
      - name: Verify governed report source evidence propagation
        run: node scripts/verify-governance-report-source-evidence.mjs
