name: Apply Quality Gate Action Pins

on:
  push:
    branches:
      - implementation/p0-p5-revalidation-20260910
    paths:
      - scripts/pin-quality-gate-actions.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: implementation/p0-p5-revalidation-20260910
      - name: Apply immutable action pins
        run: node scripts/pin-quality-gate-actions.mjs
      - name: Commit Quality Gate pins
        run: |
          if git diff --quiet -- .github/workflows/quality-gate.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality-gate.yml
          git commit -m "ci: pin Quality Gate actions to immutable commits"
          git push origin HEAD:implementation/p0-p5-revalidation-20260910
