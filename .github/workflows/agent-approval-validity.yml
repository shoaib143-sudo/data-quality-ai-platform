name: Agent Approval Validity

on:
  pull_request:
    paths:
      - 'lib/governance/agent-approval-service.ts'
      - 'supabase/migrations/20260915090000_agent_approval_validity_expiry.sql'
      - 'supabase/migrations/20260915103000_agent_approval_execution_expiry_guard.sql'
      - 'scripts/verify-agent-approval-validity.mjs'
      - 'scripts/test-agent-approval-validity.sql'
      - 'scripts/audit-agent-approval-validity-adversarial.mjs'
      - '.github/workflows/agent-approval-validity.yml'
  push:
    branches: [main]
    paths:
      - 'lib/governance/agent-approval-service.ts'
      - 'supabase/migrations/20260915090000_agent_approval_validity_expiry.sql'
      - 'supabase/migrations/20260915103000_agent_approval_execution_expiry_guard.sql'
      - 'scripts/verify-agent-approval-validity.mjs'
      - 'scripts/test-agent-approval-validity.sql'
      - 'scripts/audit-agent-approval-validity-adversarial.mjs'
      - '.github/workflows/agent-approval-validity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datanexus_approval_validity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d datanexus_approval_validity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify approval validity and expiry contract
        run: node scripts/verify-agent-approval-validity.mjs
      - name: Run independent approval validity adversarial audit
        run: node scripts/audit-agent-approval-validity-adversarial.mjs
      - name: Run approval validity database negative tests
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d datanexus_approval_validity -v ON_ERROR_STOP=1 -f scripts/test-agent-approval-validity.sql
