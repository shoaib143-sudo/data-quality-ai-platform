name: Durable Queue Readiness

on:
  pull_request:
    paths:
      - 'app/api/health/ready/route.ts'
      - 'lib/observability/queue-readiness.ts'
      - 'scripts/test-queue-readiness.mjs'
      - 'scripts/verify-queue-readiness.mjs'
      - '.github/workflows/durable-queue-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/health/ready/route.ts'
      - 'lib/observability/queue-readiness.ts'
      - 'scripts/test-queue-readiness.mjs'
      - 'scripts/verify-queue-readiness.mjs'
      - '.github/workflows/durable-queue-readiness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify queue readiness integration
        run: node scripts/verify-queue-readiness.mjs
      - name: Test recovered queue readiness semantics
        run: node --experimental-strip-types scripts/test-queue-readiness.mjs
