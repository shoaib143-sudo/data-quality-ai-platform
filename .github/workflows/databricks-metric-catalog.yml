name: Databricks Metric Catalog

on:
  pull_request:
    paths:
      - 'lib/profiling/metric-engine.ts'
      - 'scripts/verify-databricks-metric-catalog.mjs'
      - '.github/workflows/databricks-metric-catalog.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/profiling/metric-engine.ts'
      - 'scripts/verify-databricks-metric-catalog.mjs'
      - '.github/workflows/databricks-metric-catalog.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-databricks-metric-catalog.mjs
