name: Lineage Authority Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify lineage authority integrity
        run: node scripts/verify-lineage-authority-integrity.mjs
      - name: Verify PostgreSQL direct field lineage
        run: node --experimental-strip-types --test scripts/test-postgres-view-column-lineage.mjs
      - name: Verify lineage all-probe failure semantics
        run: node --test tests/lineage-enrichment-fail-closed.test.mjs
      - name: Verify PostgreSQL connector authorization boundary
        run: node --test tests/postgres-connector-service-role-boundary.test.mjs
      - name: Verify real-field-lineage live revalidation boundary
        run: node --test tests/real-field-lineage-live-revalidation-contract.test.mjs
      - name: Syntax-check real-field-lineage evidence runner
        run: node --check scripts/run-real-field-lineage-revalidation.mjs
      - name: Verify cross-dataset relationship authority boundaries
        run: node --experimental-strip-types --test tests/dataset-relationship-intelligence.test.mjs

  live-real-field-lineage:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout with change history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Determine whether live lineage proof is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s' "$BEFORE_SHA" | grep -Eq '^[0-9a-f]{40}$' || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "run_live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(supabase/functions/_shared/postgres-view-column-lineage\.ts|supabase/functions/dgp-postgres-connector/|lib/catalog/lineage-enrichment\.ts|lib/connectors/jdbc\.ts|scripts/run-real-field-lineage-revalidation\.mjs|scripts/test-postgres-view-column-lineage\.mjs|tests/real-field-lineage-live-revalidation-contract\.test\.mjs|\.github/workflows/lineage-authority-integrity\.yml)$'; then
            echo "run_live=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_live=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.scope.outputs.run_live == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        if: steps.scope.outputs.run_live == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install application dependencies
        if: steps.scope.outputs.run_live == 'true'
        run: pnpm install --frozen-lockfile

      - name: Execute governed real PostgreSQL field-lineage revalidation
        if: steps.scope.outputs.run_live == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://tvjnavjxuehpesxcfvrx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINEAGE_PROJECT_ID: 479813aa-72a4-4b12-b72a-74da8d2419ce
          LINEAGE_SOURCE_ID: b5fe07cb-9f58-4e2c-8039-1fb7e5de78b1
          LINEAGE_TARGET_SCHEMA: governance
          LINEAGE_TARGET_VIEW: glossary_reference_concepts
          LINEAGE_EVIDENCE_PATH: ${{ runner.temp }}/real-field-lineage-revalidation.json
        run: node scripts/run-real-field-lineage-revalidation.mjs

      - name: Upload field-lineage evidence
        if: always() && steps.scope.outputs.run_live == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-field-lineage-${{ github.sha }}
          path: ${{ runner.temp }}/real-field-lineage-revalidation.json
          retention-days: 90
          if-no-files-found: error
