name: Lineage Authority Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify lineage authority integrity
        run: node scripts/verify-lineage-authority-integrity.mjs
      - name: Verify PostgreSQL direct field lineage
        run: node --experimental-strip-types --test scripts/test-postgres-view-column-lineage.mjs
      - name: Verify lineage all-probe failure semantics
        run: node --test tests/lineage-enrichment-fail-closed.test.mjs
      - name: Verify PostgreSQL connector authorization boundary
        run: node --test tests/postgres-connector-service-role-boundary.test.mjs
      - name: Verify cross-dataset relationship authority boundaries
        run: node --experimental-strip-types --test tests/dataset-relationship-intelligence.test.mjs
