name: Durable Queue Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datanexus_queue_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify queue health contract
        run: node scripts/verify-job-queue-health.mjs
      - name: Run independent automated adversarial audit
        run: node scripts/audit-job-queue-health-adversarial.mjs
      - name: Execute queue health dynamic and negative matrix
        run: psql -h 127.0.0.1 -U postgres -d datanexus_queue_health -f scripts/test-job-queue-health.sql
