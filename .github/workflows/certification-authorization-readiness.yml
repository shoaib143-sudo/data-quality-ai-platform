name: Certification Authorization Readiness

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260912062000_certification_authorization_and_readiness.sql'
      - 'app/api/agents/governance-orchestrator/handsfree-e2e/**'
      - 'lib/auth/authorize-data-governance-admin.ts'
      - 'lib/auth/require-api-user.ts'
      - 'scripts/verify-certification-authorization-readiness.mjs'
      - 'scripts/verify-handsfree-e2e-admin-gate.mjs'
      - 'scripts/verify-handsfree-cert-auth-contract.mjs'
      - '.github/workflows/certification-authorization-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260912062000_certification_authorization_and_readiness.sql'
      - 'app/api/agents/governance-orchestrator/handsfree-e2e/**'
      - 'lib/auth/authorize-data-governance-admin.ts'
      - 'lib/auth/require-api-user.ts'
      - 'scripts/verify-certification-authorization-readiness.mjs'
      - 'scripts/verify-handsfree-e2e-admin-gate.mjs'
      - 'scripts/verify-handsfree-cert-auth-contract.mjs'
      - '.github/workflows/certification-authorization-readiness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-certification-authorization-readiness.mjs
      - run: node scripts/verify-handsfree-e2e-admin-gate.mjs
      - run: node scripts/verify-handsfree-cert-auth-contract.mjs
      - run: pnpm exec tsc --noEmit
