name: Certification Authorization Readiness

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260912062000_certification_authorization_and_readiness.sql'
      - 'scripts/verify-certification-authorization-readiness.mjs'
      - '.github/workflows/certification-authorization-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260912062000_certification_authorization_and_readiness.sql'
      - 'scripts/verify-certification-authorization-readiness.mjs'
      - '.github/workflows/certification-authorization-readiness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-certification-authorization-readiness.mjs
      - run: pnpm exec tsc --noEmit
