name: P0-P5 Revalidation

on:
  push:
    branches:
      - main
      - implementation/p0-p5-revalidation-20260910
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required PR context: intentionally tiny. The expensive suite runs only after merge.
  revalidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fast-path revalidation sentinel
        run: |
          echo 'PR fast path active.'
          echo 'Full P0-P5 revalidation runs automatically after merge on the exact main SHA.'

  # Full certification is preserved, but it no longer blocks rapid PR merge/deploy.
  revalidate-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Exact-main certification trigger contract
        run: node --test tests/exact-main-certification-contract.test.mjs
      - name: Full post-merge P0-P5 certification
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/verify-v0-trusted-governance-baseline.mjs
          node scripts/verify-journey-sensitive-governance.mjs
          node scripts/verify-journey-dq-incident.mjs
          node scripts/verify-journey-change-governance.mjs
          node scripts/verify-journey-governed-investigation.mjs
          node scripts/verify-journey-governed-outcome-learning.mjs
          node scripts/verify-journey-governed-action-verification.mjs
          node scripts/verify-journey-operational-certification.mjs
          node scripts/verify-p0-p4-revalidation.mjs
          pnpm run verify:recovery-assurance
          pnpm run verify:worker-runtime
          pnpm exec tsc --noEmit
          pnpm run verify:profiling-lifecycle
          pnpm run verify:governance-reviews
          pnpm run verify:governance
          pnpm run verify:model-gateway
          pnpm run verify:reasoning-provider
          pnpm run verify:retrieval-provider
          pnpm run verify:governed-autonomy
          pnpm run verify:provider-fallback
          if [ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            pnpm run verify:database
          else
            echo 'Live database verification is NOT_MEASURED because protected credentials are unavailable.'
          fi
          pnpm run build
