name: Governed Backtest Readiness Service

on:
  pull_request:
    paths:
      - 'lib/ai/governance-evaluation-dataset.ts'
      - 'lib/ai/governed-backtesting.ts'
      - 'lib/ai/governed-backtesting-service.ts'
      - 'app/api/analytics/governed-backtest-readiness/route.ts'
      - 'scripts/verify-governed-backtest-readiness-service.mjs'
      - '.github/workflows/governed-backtest-readiness-service.yml'
  push:
    branches: [main]
    paths:
      - 'lib/ai/governance-evaluation-dataset.ts'
      - 'lib/ai/governed-backtesting.ts'
      - 'lib/ai/governed-backtesting-service.ts'
      - 'app/api/analytics/governed-backtest-readiness/route.ts'
      - 'scripts/verify-governed-backtest-readiness-service.mjs'
      - '.github/workflows/governed-backtest-readiness-service.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/verify-governed-backtest-readiness-service.mjs
      - run: node --experimental-strip-types scripts/test-governed-backtesting.mjs
      - run: node --experimental-strip-types scripts/test-evaluation-dataset.mjs
