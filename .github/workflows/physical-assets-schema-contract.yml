name: Physical assets schema contract

on:
  pull_request:
    paths:
      - 'app/catalog/physical-assets/page.tsx'
      - 'app/catalog/physical-assets/physical-asset-manager.tsx'
      - 'scripts/test-physical-assets-schema-contract.mjs'
      - 'scripts/audit-physical-assets-schema-adversarial.mjs'
      - '.github/workflows/physical-assets-schema-contract.yml'

permissions:
  contents: read

jobs:
  physical-assets-schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Schema contract and negative cases
        run: node scripts/test-physical-assets-schema-contract.mjs
      - name: Independent adversarial audit
        run: node scripts/audit-physical-assets-schema-adversarial.mjs
