name: Governed Real Case Buckets

on:
  pull_request:
    paths:
      - 'lib/data-quality/governed-real-case-buckets.ts'
      - 'lib/data-quality/governed-real-case-bucket-service.ts'
      - 'app/api/analytics/governed-real-case-buckets/route.ts'
      - 'scripts/verify-governed-real-case-buckets.mjs'
      - '.github/workflows/governed-real-case-buckets.yml'
  push:
    branches: [main]
    paths:
      - 'lib/data-quality/governed-real-case-buckets.ts'
      - 'lib/data-quality/governed-real-case-bucket-service.ts'
      - 'app/api/analytics/governed-real-case-buckets/route.ts'
      - 'scripts/verify-governed-real-case-buckets.mjs'
      - '.github/workflows/governed-real-case-buckets.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify governed real-case bucket contracts
        run: node scripts/verify-governed-real-case-buckets.mjs
