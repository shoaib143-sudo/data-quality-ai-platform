name: AI Assisted Governance

on:
  push:
    branches: [main, governed-ai-assistance]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-ai-assisted-governance.mjs'
      - '.github/workflows/ai-assisted-governance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-ai-assisted-governance.mjs'
      - '.github/workflows/ai-assisted-governance.yml'

permissions:
  contents: read

jobs:
  module12-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify AI suggestions remain separate from governance authority
        run: node scripts/verify-ai-assisted-governance.mjs
