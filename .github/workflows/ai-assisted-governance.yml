name: AI Assisted Governance

on:
  push:
    branches: [main, governed-ai-assistance]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-ai-assisted-governance.mjs'
      - '.github/workflows/ai-assisted-governance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-ai-assisted-governance.mjs'
      - '.github/workflows/ai-assisted-governance.yml'

permissions:
  contents: read

jobs:
  module12-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify AI suggestions remain separate from governance authority
        run: node scripts/verify-ai-assisted-governance.mjs
