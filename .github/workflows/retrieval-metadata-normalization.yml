name: Retrieval Metadata Normalization

on:
  pull_request:
    paths:
      - 'lib/governance/governed-similarity-contract.ts'
      - 'lib/governance/governed-similarity.ts'
      - 'app/api/search/similar/route.ts'
      - 'tests/governed-similarity.test.mjs'
      - 'lib/governance/semantic-knowledge-indexer.ts'
      - 'scripts/test-regulatory-retrieval-provenance.mjs'
      - 'lib/ai/retrieval-provider.ts'
      - 'lib/governance/semantic-project-reindex.ts'
      - 'lib/governance/semantic-project-reindex-runtime.ts'
      - 'app/api/search/semantic/reindex/route.ts'
      - 'tests/semantic-project-reindex.test.mjs'
      - 'lib/ai/retrieval-metadata-normalization.ts'
      - 'scripts/verify-retrieval-provider.mjs'
      - 'scripts/test-retrieval-provider.mjs'
      - 'scripts/test-retrieval-metadata-normalization.mjs'
      - '.github/workflows/retrieval-metadata-normalization.yml'
  push:
    branches: [main]
    paths:
      - 'lib/governance/governed-similarity-contract.ts'
      - 'lib/governance/governed-similarity.ts'
      - 'app/api/search/similar/route.ts'
      - 'tests/governed-similarity.test.mjs'
      - 'lib/governance/semantic-knowledge-indexer.ts'
      - 'scripts/test-regulatory-retrieval-provenance.mjs'
      - 'lib/ai/retrieval-provider.ts'
      - 'lib/governance/semantic-project-reindex.ts'
      - 'lib/governance/semantic-project-reindex-runtime.ts'
      - 'app/api/search/semantic/reindex/route.ts'
      - 'tests/semantic-project-reindex.test.mjs'
      - 'lib/ai/retrieval-metadata-normalization.ts'
      - 'scripts/verify-retrieval-provider.mjs'
      - 'scripts/test-retrieval-provider.mjs'
      - 'scripts/test-retrieval-metadata-normalization.mjs'
      - '.github/workflows/retrieval-metadata-normalization.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static retrieval contract
        run: node scripts/verify-retrieval-provider.mjs
      - name: Retrieval provider behavior
        run: node --experimental-strip-types scripts/test-retrieval-provider.mjs
      - name: Semantic project reindex behavior
        run: node --experimental-strip-types --test tests/semantic-project-reindex.test.mjs
      - name: Regulatory retrieval provenance
        run: node scripts/test-regulatory-retrieval-provenance.mjs
      - name: Governed object similarity
        run: node --experimental-strip-types --test tests/governed-similarity.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
