<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 19px Arial,sans-serif;fill:#334155}
      .stage{font:700 20px Arial,sans-serif;fill:#0f172a}
      .h{font:700 17px Arial,sans-serif;fill:#0f172a}
      .t{font:400 14px Arial,sans-serif;fill:#334155}
      .small{font:400 12px Arial,sans-serif;fill:#475569}
      .num{font:700 18px Arial,sans-serif;fill:white}
      .arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#475569;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
      .opt{stroke:#16a34a;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrowGreen)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="28" y="48" class="title">DataNexus Ingestion Architecture &amp; Data Flow</text>
  <text x="28" y="78" class="subtitle">From file upload or database table selection to processing, persistence, observability, and governed canary execution</text>

  <!-- Stage 1 -->
  <rect x="24" y="115" width="225" height="510" rx="18" fill="#eff6ff" stroke="#60a5fa"/>
  <circle cx="55" cy="148" r="19" fill="#1d4ed8"/><text x="49" y="155" class="num">1</text>
  <text x="84" y="155" class="stage">Data Source</text>
  <text x="50" y="210" class="h">File Upload</text>
  <text x="50" y="234" class="t">CSV, XLSX, JSON, etc.</text>
  <text x="50" y="292" class="h">Database Table</text>
  <text x="50" y="316" class="t">Postgres, MSSQL,</text>
  <text x="50" y="337" class="t">Databricks, etc.</text>
  <text x="50" y="395" class="h">External Source</text>
  <text x="50" y="419" class="t">S3, APIs, source systems</text>

  <!-- Stage 2 -->
  <rect x="278" y="115" width="240" height="510" rx="18" fill="#f0fdf4" stroke="#4ade80"/>
  <circle cx="309" cy="148" r="19" fill="#16a34a"/><text x="303" y="155" class="num">2</text>
  <text x="338" y="155" class="stage">Web App (Vercel)</text>
  <text x="304" y="210" class="h">Ingestion UI</text>
  <text x="304" y="238" class="t">• Select file or table</text>
  <text x="304" y="263" class="t">• Configure mapping/filters</text>
  <text x="304" y="288" class="t">• Validate source input</text>
  <text x="304" y="313" class="t">• Register dataset/version</text>
  <text x="304" y="338" class="t">• Create ingestion request</text>
  <text x="304" y="388" class="h">Control Plane</text>
  <text x="304" y="416" class="t">Interactive UX remains on Vercel</text>

  <!-- Stage 3 -->
  <rect x="548" y="115" width="270" height="510" rx="18" fill="#f5f3ff" stroke="#8b5cf6"/>
  <circle cx="579" cy="148" r="19" fill="#6d28d9"/><text x="573" y="155" class="num">3</text>
  <text x="608" y="155" class="stage">Supabase</text>
  <text x="574" y="205" class="h">Transactional Authority</text>
  <text x="574" y="235" class="t">• Dataset metadata</text>
  <text x="574" y="260" class="t">• Dataset versions</text>
  <text x="574" y="285" class="t">• Source configuration</text>
  <text x="574" y="310" class="t">• Job queue + status</text>
  <text x="574" y="335" class="t">• Lease/claim fencing</text>
  <text x="574" y="360" class="t">• Audit trail</text>
  <text x="574" y="410" class="h">Scheduler / Claiming</text>
  <text x="574" y="438" class="t">• Primary durable scheduler</text>
  <text x="574" y="463" class="t">• Single-flight canary subset</text>
  <text x="574" y="488" class="t">• Fail-closed controls</text>

  <!-- Stage 4 -->
  <rect x="848" y="115" width="300" height="510" rx="18" fill="#fffbeb" stroke="#f59e0b"/>
  <circle cx="879" cy="148" r="19" fill="#f59e0b"/><text x="873" y="155" class="num">4</text>
  <text x="908" y="155" class="stage">Worker Execution</text>

  <rect x="878" y="190" width="240" height="170" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="900" y="220" class="h">Primary Worker (Vercel)</text>
  <text x="900" y="250" class="t">• Claims normal durable jobs</text>
  <text x="900" y="275" class="t">• Runs ingestion/profiling</text>
  <text x="900" y="300" class="t">• Handles retries/failures</text>
  <text x="900" y="325" class="t">• Writes results to Supabase</text>

  <rect x="878" y="385" width="240" height="185" rx="14" fill="#ecfdf5" stroke="#34d399"/>
  <text x="900" y="415" class="h">Canary Worker (Cloudflare)</text>
  <text x="900" y="445" class="t">• OBSERVABILITY-only</text>
  <text x="900" y="470" class="t">• executionLane=CLOUDFLARE_CANARY</text>
  <text x="900" y="495" class="t">• Single-flight limit = 1</text>
  <text x="900" y="520" class="t">• Disabled by default</text>
  <text x="900" y="545" class="t">• Governed enable/rollback</text>

  <!-- Stage 5 -->
  <rect x="1178" y="115" width="240" height="510" rx="18" fill="#f5f3ff" stroke="#8b5cf6"/>
  <circle cx="1209" cy="148" r="19" fill="#6d28d9"/><text x="1203" y="155" class="num">5</text>
  <text x="1238" y="155" class="stage">Supabase Results</text>
  <text x="1204" y="210" class="h">Persisted Output</text>
  <text x="1204" y="240" class="t">• Schema + discovered columns</text>
  <text x="1204" y="265" class="t">• Profile metrics</text>
  <text x="1204" y="290" class="t">• Findings</text>
  <text x="1204" y="315" class="t">• Quality score</text>
  <text x="1204" y="340" class="t">• Governance insights</text>
  <text x="1204" y="365" class="t">• Job state + errors</text>
  <text x="1204" y="415" class="h">Status Updates</text>
  <text x="1204" y="443" class="t">queued → running →</text>
  <text x="1204" y="466" class="t">succeeded / retry / dead</text>

  <!-- Stage 6 -->
  <rect x="1448" y="115" width="128" height="510" rx="18" fill="#eff6ff" stroke="#60a5fa"/>
  <circle cx="1479" cy="148" r="19" fill="#1d4ed8"/><text x="1473" y="155" class="num">6</text>
  <text x="1508" y="153" class="stage" text-anchor="middle">UI</text>
  <text x="1512" y="210" class="h" text-anchor="middle">Admin</text>
  <text x="1512" y="235" class="small" text-anchor="middle">status</text>
  <text x="1512" y="255" class="small" text-anchor="middle">metrics</text>
  <text x="1512" y="275" class="small" text-anchor="middle">alerts</text>
  <text x="1512" y="295" class="small" text-anchor="middle">audit</text>
  <text x="1512" y="335" class="h" text-anchor="middle">Read-only</text>
  <text x="1512" y="360" class="small" text-anchor="middle">operational</text>
  <text x="1512" y="380" class="small" text-anchor="middle">state</text>

  <!-- Main arrows -->
  <path d="M249 370 H278" class="arrow"/>
  <path d="M518 370 H548" class="arrow"/>
  <path d="M818 370 H848" class="arrow"/>
  <path d="M1148 370 H1178" class="arrow"/>
  <path d="M1418 370 H1448" class="arrow"/>

  <!-- Support boxes -->
  <rect x="40" y="680" width="280" height="155" rx="16" fill="#fff7ed" stroke="#fb923c"/>
  <text x="60" y="712" class="h">Optional External Storage</text>
  <text x="60" y="742" class="t">• Raw files / large staging objects</text>
  <text x="60" y="767" class="t">• S3 / R2 style object storage</text>
  <text x="60" y="792" class="t">• Source-system access</text>

  <rect x="350" y="680" width="300" height="155" rx="16" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="370" y="712" class="h">Secrets &amp; Configuration</text>
  <text x="370" y="742" class="t">• GitHub environment secrets</text>
  <text x="370" y="767" class="t">• Supabase Vault runtime secrets</text>
  <text x="370" y="792" class="t">• Worker URL / activation flags</text>

  <rect x="680" y="680" width="300" height="155" rx="16" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="700" y="712" class="h">Monitoring &amp; Logging</text>
  <text x="700" y="742" class="t">• Vercel / Cloudflare worker logs</text>
  <text x="700" y="767" class="t">• Supabase logs + queue telemetry</text>
  <text x="700" y="792" class="t">• Audit evidence + alerts</text>

  <rect x="1010" y="680" width="320" height="155" rx="16" fill="#fef2f2" stroke="#f87171"/>
  <text x="1030" y="712" class="h">Release Governance</text>
  <text x="1030" y="742" class="t">• Exact-SHA verification</text>
  <text x="1030" y="767" class="t">• Readiness / enable / disable workflows</text>
  <text x="1030" y="792" class="t">• Rollback + post-activation certification</text>

  <!-- Support arrows -->
  <path d="M170 680 V640 H398 V625" class="opt"/>
  <path d="M500 680 V642 H683 V625" class="dashed"/>
  <path d="M830 680 V642 H998 V625" class="dashed"/>
  <path d="M1170 680 V642 H1010 V625" class="dashed"/>

  <text x="28" y="872" class="small">Source of truth: DataNexus repository architecture and current governed Cloudflare OBSERVABILITY canary model.</text>
</svg>